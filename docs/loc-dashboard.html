<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Labs — LOC Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --text-muted: #8b8fa3;
    --accent: #6c63ff;
    --accent-light: #8b83ff;
    --code: #3ecf8e;
    --test: #f59e42;
    --docs: #38bdf8;
    --total-bar: #6c63ff22;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 3rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }

  h1 span { color: var(--accent-light); }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.875rem;
  }

  /* ── Summary cards ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    text-align: center;
  }

  .card .value {
    font-size: 1.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .card .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }

  .card.code .value  { color: var(--code); }
  .card.tests .value { color: var(--test); }
  .card.docs .value  { color: var(--docs); }
  .card.total .value { color: var(--accent-light); }

  /* ── Table ── */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 2.5rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
  }

  thead th {
    text-align: right;
    padding: 0.75rem 1rem;
    font-weight: 600;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    transition: background 0.15s;
  }

  tbody tr:hover { background: #ffffff06; }

  tbody td {
    padding: 0.6rem 1rem;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }

  tbody td:first-child {
    text-align: left;
    font-weight: 500;
  }

  tbody tr:last-child td { border-bottom: none; }

  tfoot td {
    padding: 0.75rem 1rem;
    text-align: right;
    font-weight: 700;
    border-top: 2px solid var(--border);
  }

  tfoot td:first-child { text-align: left; }

  .zero { color: var(--text-muted); opacity: 0.4; }

  /* ── Bar chart ── */
  .chart-section { margin-bottom: 2.5rem; }

  .chart-section h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.75rem;
  }

  .bar-row {
    display: flex;
    align-items: center;
    margin-bottom: 0.4rem;
  }

  .bar-label {
    width: 140px;
    flex-shrink: 0;
    font-size: 0.8rem;
    font-weight: 500;
    text-align: right;
    padding-right: 0.75rem;
  }

  .bar-track {
    flex: 1;
    height: 22px;
    display: flex;
    border-radius: 4px;
    overflow: hidden;
    background: var(--total-bar);
  }

  .bar-seg {
    height: 100%;
    transition: width 0.4s ease;
  }

  .bar-seg.code  { background: var(--code); }
  .bar-seg.tests { background: var(--test); }
  .bar-seg.docs  { background: var(--docs); }

  .bar-total {
    width: 60px;
    flex-shrink: 0;
    text-align: right;
    font-size: 0.75rem;
    color: var(--text-muted);
    padding-left: 0.5rem;
    font-variant-numeric: tabular-nums;
  }

  /* ── Legend ── */
  .legend {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  .legend-dot.code  { background: var(--code); }
  .legend-dot.tests { background: var(--test); }
  .legend-dot.docs  { background: var(--docs); }

  /* ── Ratio badge ── */
  .ratio-badge {
    display: inline-block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 1.2rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--test);
    margin-bottom: 2rem;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.75rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 640px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .bar-label { width: 100px; font-size: 0.7rem; }
    body { padding: 1rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span>AI Labs</span> — LOC Dashboard</h1>
    <p class="subtitle">Lines of code across 16 projects &middot; Generated 2026-04-24</p>
  </header>

  <div class="cards">
    <div class="card code">
      <div class="value">12,913</div>
      <div class="label">Code</div>
    </div>
    <div class="card tests">
      <div class="value">18,381</div>
      <div class="label">Tests</div>
    </div>
    <div class="card docs">
      <div class="value">42,262</div>
      <div class="label">Docs</div>
    </div>
    <div class="card total">
      <div class="value">73,556</div>
      <div class="label">Total</div>
    </div>
  </div>

  <div style="text-align:center;">
    <span class="ratio-badge">Test / Code ratio: 1.4×</span>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="legend-dot code"></span> Code</span>
    <span class="legend-item"><span class="legend-dot tests"></span> Tests</span>
    <span class="legend-item"><span class="legend-dot docs"></span> Docs</span>
  </div>

  <div class="chart-section">
    <h2>Lines by project</h2>
    <div id="chart"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Project</th>
          <th>Code</th>
          <th>Tests</th>
          <th>Docs</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot>
        <tr>
          <td>TOTAL</td>
          <td>12,913</td>
          <td>18,381</td>
          <td>42,262</td>
          <td>73,556</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <footer>
    ai-labs &middot; loc-dashboard.sh
  </footer>
</div>

<script>
const data = [
  { name: "oracle",         code: 3428, tests: 5607, docs: 3816 },
  { name: "notio",          code: 2198, tests: 4055, docs: 6331 },
  { name: "nomos",          code:  816, tests: 4442, docs: 3586 },
  { name: "dev-skills",     code:  741, tests:    0, docs: 8112 },
  { name: "web-scout",      code:  382, tests:  790, docs: 5527 },
  { name: "neris",          code:  764, tests: 1909, docs: 1431 },
  { name: "agents",         code:    0, tests:    0, docs: 3828 },
  { name: "corpus-scout",   code:  748, tests:  829, docs: 1222 },
  { name: "sandbox",        code:  332, tests:    0, docs: 2178 },
  { name: "nexum",          code:    0, tests:    0, docs: 2424 },
  { name: "loki",           code:  984, tests:  548, docs:  908 },
  { name: "tools",          code:  765, tests:    0, docs: 1144 },
  { name: "regentara",      code:    0, tests:    0, docs: 1528 },
  { name: "repo-scripts",   code: 1138, tests:  201, docs:    0 },
  { name: "claude-insights",code:  617, tests:    0, docs:  164 },
  { name: "niora",          code:    0, tests:    0, docs:   63 },
];

// Sort by total descending
data.sort((a, b) => (b.code + b.tests + b.docs) - (a.code + a.tests + a.docs));

const maxTotal = Math.max(...data.map(d => d.code + d.tests + d.docs));

function fmt(n) { return n.toLocaleString(); }

// Build chart
const chart = document.getElementById("chart");
data.forEach(d => {
  const total = d.code + d.tests + d.docs;
  const row = document.createElement("div");
  row.className = "bar-row";
  row.innerHTML = `
    <span class="bar-label">${d.name}</span>
    <div class="bar-track">
      <div class="bar-seg code"  style="width:${(d.code  / maxTotal) * 100}%"></div>
      <div class="bar-seg tests" style="width:${(d.tests / maxTotal) * 100}%"></div>
      <div class="bar-seg docs"  style="width:${(d.docs  / maxTotal) * 100}%"></div>
    </div>
    <span class="bar-total">${fmt(total)}</span>
  `;
  chart.appendChild(row);
});

// Build table
const tbody = document.getElementById("tbody");
data.forEach(d => {
  const total = d.code + d.tests + d.docs;
  const tr = document.createElement("tr");
  const cell = v => `<td${v === 0 ? ' class="zero"' : ''}>${fmt(v)}</td>`;
  tr.innerHTML = `<td>${d.name}</td>${cell(d.code)}${cell(d.tests)}${cell(d.docs)}${cell(total)}`;
  tbody.appendChild(tr);
});
</script>
</body>
</html>
