<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="rexlab-version" content="%REXLAB_VERSION%" />
    <title>RexLab</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f3f7e9;
        color: #2f4a1f;
      }
      h1 {
        font-size: clamp(3rem, 10vw, 7rem);
        margin: 0;
      }
      footer {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        font-size: 0.875rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>Hello RexLab 🦖</h1>
    <footer aria-label="Version">%REXLAB_VERSION%</footer>
  </body>
</html>
