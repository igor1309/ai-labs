<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>clipdeck</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <main class="app-shell">
      <div data-loading class="loading-state" hidden>Loading…</div>
      <section data-library class="library" hidden>
        <header class="toolbar">
          <div class="library-brand">
            <h1 class="library-title">clipdeck</h1>
            <span data-app-version aria-label="Version" class="app-version"></span>
          </div>
          <button data-reload class="reload-btn" type="button">Reload</button>
        </header>
        <div data-sections class="sections"></div>
      </section>
      <p data-toast class="toast" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
