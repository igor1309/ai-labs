<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>clipdeck</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <main class="app-shell">
      <form data-unlock-form class="unlock-panel">
        <h1>clipdeck</h1>
        <label>
          Access secret
          <input data-secret-input type="password" autocomplete="current-password">
        </label>
        <button type="submit">Unlock</button>
      </form>
      <section data-library class="library" hidden>
        <header class="toolbar">
          <h1>clipdeck</h1>
          <button data-reload type="button">Reload</button>
        </header>
        <div data-sections></div>
      </section>
      <p data-toast class="toast" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
