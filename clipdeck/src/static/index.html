<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>clipdeck</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <main class="app-shell">
      <form data-unlock-form class="unlock-card">
        <h1 class="unlock-title"><span>clipdeck</span></h1>
        <p class="unlock-subtitle">Enter your access secret</p>
        <div class="field">
          <label class="field-label" for="secret">Access secret</label>
          <input data-secret-input class="field-input" id="secret" type="password" autocomplete="current-password" required>
        </div>
        <button class="submit-btn" type="submit">Unlock</button>
      </form>
      <div data-loading class="loading-state" hidden>Loading…</div>
      <section data-library class="library" hidden>
        <header class="toolbar">
          <h1 class="library-title">clipdeck</h1>
          <button data-reload class="reload-btn" type="button">Reload</button>
        </header>
        <div data-sections class="sections"></div>
      </section>
      <p data-toast class="toast" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
