name: notio

services:
  notio:
    image: notio:${NOTIO_VERSION:-dev}
    build:
      context: .
      args:
        VERSION: ${NOTIO_VERSION:-dev}
    container_name: notio
    restart: unless-stopped
    env_file: .env
    environment:
      NOTIO_VERSION: ${NOTIO_VERSION:-dev}
    ports:
      - "8080:8080"
    labels:
      com.logging.project: notio
      com.logging.service: api
