# Implement, then gate on Audelin's tests run outside the implementer's
# sandbox: while they fail, the implementer's session repairs and they run
# again, at most three times.
schema: agister.workflow/v1alpha1
params:
  brief: {}
inputs:
  brief: {source: file, path: {from: params.brief}, form: [goal, step]}

steps:
  - {name: build, process: implement, agent: codex-sol-61, inputs: {brief: {from: inputs.brief}}}
  - {name: test, process: audelin_tests, agent: bash}
  - name: gate
    branch:
      - name: repair
        if: {not: {equals: [{from: steps.test.outputs.exit_code}, 0]}}
        repeat:
          state:
            exit_code: {from: steps.test.outputs.exit_code}
            output: {from: steps.test.outputs.stdout.tail}
          steps:
            - name: fix
              process: repair_tests
              agent: codex-sol-61
              session: {from: steps.build.session}
              inputs: {test_output: {from: state.output}}
            - {name: retest, process: audelin_tests, agent: bash}
          next:
            exit_code: {from: steps.retest.outputs.exit_code}
            output: {from: steps.retest.outputs.stdout.tail}
          until: {equals: [{from: state.exit_code}, 0]}
          max: 3
        outputs: {exit_code: {from: steps.repair.outputs.exit_code}, output: {from: steps.repair.outputs.output}}
      - name: passed
        process: audelin_tests
        agent: bash
        outputs: {exit_code: {from: steps.passed.outputs.exit_code}, output: {from: steps.passed.outputs.stdout.tail}}

outputs:
  implementation: {from: steps.build.outputs}
  exit_code: {from: steps.gate.outputs.exit_code}
  test_output: {from: steps.gate.outputs.output}
