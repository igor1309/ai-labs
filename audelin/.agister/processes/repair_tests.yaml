schema: agister.process/v1alpha1
prompt: continuation
instruction: >-
  Audelin's tests, run outside your sandbox after your changes, failed;
  their output is the input test_output. Fix the cause in the code and
  commit. Do not weaken, skip or delete a check or a test. In your sandbox
  run the tests only as `CLANG_MODULE_CACHE_PATH=/tmp/codex-swift/clang
  swift test --disable-sandbox --cache-path /tmp/codex-swift/cache
  --config-path /tmp/codex-swift/config --security-path
  /tmp/codex-swift/security`; tests that make speech with `say` fail there
  on an empty file, so judge those from test_output. The workflow runs every
  test again after you.

params:
  test_output: {}
inputs:
  test_output: {source: param, name: test_output}

workspace:
  access: read-write

permissions:
  require:
    - repository.read
    - repository.write
    - process.execute
  allow:
    - repository.read
    - repository.search
    - repository.diff
    - repository.history.read
    - repository.write
    - repository.history.write
    - process.execute
    - network
    - host.read
    - host.write

limits:
  time: 30m
  stale:
    no_event: 21m
    tool_command: 15m
    repeated_tool_calls: 5

output:
  schema: implementation
