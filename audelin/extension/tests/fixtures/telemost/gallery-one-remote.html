<!doctype html><meta charset="utf-8" />
<!-- Gallery view: the local tile and one remote participant. -->
<div data-video-root="true">
  <div>
    <div class="tile">
      <video style="transform: scaleX(-1)"></video>
      <div class="overlay">
        <span title="Анна Петрова">Анна Петрова</span><svg data-testid="micro-off-icon"></svg>
      </div>
    </div>
    <div class="tile">
      <video></video>
      <div class="overlay">
        <span title="Boris Ivanov">Boris Ivanov</span>
      </div>
    </div>
  </div>
</div>
<div id="toolbar">
  <div>
    <button data-testid="share-button">Share</button>
    <button data-testid="turn-off-mic-button">Mic</button>
    <button data-testid="turn-on-camera-button">Camera</button>
  </div>
  <div>
    <button data-testid="more-popup-alt-button">More</button>
    <div><div><button data-testid="end-call-alt-button">Leave</button></div></div>
  </div>
</div>
