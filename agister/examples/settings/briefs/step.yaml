schema: agister.brief/v1alpha1
name: step

parts:
  - {heading: "## Goal", required: true, reference: file}
  - {heading: "## Covers", required: true}
  - {heading: "## Acts on", required: false}
  - {heading: "## Constraints", required: false}
  - {heading: "## Open", required: true, reads: None.}

template: |
  # <issue> step <n>: <what this run makes true, in a line>

  ## Goal

  `<the goal file, relative to the directory the call is made from>`

  ## Covers

  - <Each criterion of the goal this step makes true, by its number. The
    implementer derives the check that proves each, unless the goal names
    one.>

  ## Acts on

  <The findings or judge items this step answers, with the judgement they
  come from. Leave the part out when there are none.>

  ## Constraints

  <Only what the goal does not already say. Leave the part out otherwise.>

  ## Open

  None.
