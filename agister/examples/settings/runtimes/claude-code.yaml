# What each Claude Code tool actually grants under adapter contract
# claude-code/3 (--permission-mode dontAsk, --strict-mcp-config, Skill on
# every turn). claude-code/3 differs from claude-code/2 in dropping
# --restricted (ADR-006): Claude Code loads the repository's instruction
# files, settings and skills, and its file tools are no longer confined to
# the working directory. /2 resumed like /3; /1 forked a continuation into a
# preset session ID.
#
# verified lists the Claude Code versions a primitive's grants were checked
# against live (docs/findings.md). A plan uses only primitives verified for
# the installed version; an unverified one is never granted.
schema: agister.runtime/v1alpha1
name: claude-code
adapter: claude-code
contract: claude-code/3
efforts: [low, medium, high, xhigh, max]
primitives:
  select: any
  items:
    # Without --restricted, each read a file outside the working directory
    # (observed live, 2.1.285): they reach the host.
    Read: {grants: [repository.read, host.read], verified: ["2.1."]}
    Glob: {grants: [repository.read, host.read], verified: ["2.1."]}
    Grep: {grants: [repository.search, host.read], verified: ["2.1."]}
    # Not yet verified, so never granted.
    Edit: {grants: [repository.write]}
    Write: {grants: [repository.write]}
    NotebookEdit: {grants: [repository.write]}
    WebFetch: {grants: [network]}
    WebSearch: {grants: [network]}
    # Exposed Bash auto-approves read-only commands (git show, git log, …)
    # whatever --allowedTools says (observed live), and can reach anything
    # the user can. It grants everything. (2.1.283)
    Bash:
      verified: ["2.1."]
      grants:
        - process.execute
        - repository.read
        - repository.search
        - repository.diff
        - repository.history.read
        - repository.write
        - repository.history.write
        - network
        - host.read
        - host.write
