# Architecture-focused role instantiated with the same reviewer agent profile.

schema: agister.process/v1alpha1
name: architecture_review

type: process
uses: agent:reviewer
policy: process-policy:static-review

# A concrete process may narrow a numeric policy limit.
timeout: 15m

input:
  instruction: >-
    Review the exact candidate against the governing architecture and module
    responsibilities. Report boundary drift, misplaced decisions, duplicated
    responsibilities, dependency violations, and missing integration behavior.
  params:
    base: {default: origin/HEAD}
    candidate: {default: HEAD}
    architecture: {}
  values:
    base_revision: {source: git.revision, rev: "${param.base}"}
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    diff: {source: git.diff, base: "${value.base_revision}", head: "${value.candidate_revision}"}
    changed_files: {source: git.changed_files, base: "${value.base_revision}", head: "${value.candidate_revision}"}
    architecture_context: {source: file, path: "${param.architecture}"}

workspace:
  checkout: candidate_revision

output:
  format: json
  schema: review-result
  require_valid: true
