schema: agister.process/v1alpha1
name: review_summary

type: process
prompt: review-summary

input:
  instruction: >-
    Summarize the reviews given as input reviews; a review with no output
    did not complete, so say so and summarize nothing for it. Merge
    findings that make the same claim, keep each finding's evidence and its
    source, and say where the reviews disagree. Add no finding of your own.
  values:
    reviews: {source: workflow.collection}

workspace:
  access: read-only
  scope: repository

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 10m

output:
  format: text
