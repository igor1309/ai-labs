schema: agister.process/v1alpha1
name: adversarial_review

type: process
prompt: adversarial-review

input:
  instruction: >-
    Review the exact candidate adversarially. Report material correctness,
    safety, contract, and maintainability findings. Take no suspected defect
    or focus as given.
  params:
    base: {default: origin/HEAD}
    candidate: {default: HEAD}
  values:
    base_revision: {source: git.revision, rev: "${param.base}"}
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    diff: {source: git.diff, base: "${value.base_revision}", head: "${value.candidate_revision}"}
    changed_files: {source: git.changed_files, base: "${value.base_revision}", head: "${value.candidate_revision}"}

workspace:
  access: read-only
  scope: candidate
  revision: candidate_revision

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search

timeout: 20m
retry:
  max_attempts: 1

isolation:
  deny:
    - repository.write
    - repository.history.write
    - process.execute
    - network

output:
  format: json
  schema: review-result
  require_valid: true
