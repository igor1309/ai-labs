schema: agister.process/v1alpha1
name: implement

type: process
uses: agent:assistant
policy: process-policy:implement
prompt: implement

input:
  instruction: >-
    Implement the task given as input brief in this worktree, at the
    candidate. Do not commit; your changes stay here, uncommitted.
  params:
    candidate: {default: HEAD}
    brief: {}
  values:
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    brief: {source: file, path: "${param.brief}"}

workspace:
  revision: candidate_revision
  clean: true

output:
  format: text

verify: verify:repo
