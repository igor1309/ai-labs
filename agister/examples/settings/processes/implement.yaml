# Implementation in a checkout of the candidate, verified: the node
# completes only once the verification command passes on the content it
# delivers, and a failing run goes back to the agent in the same session.

schema: agister.process/v1alpha1
name: implement

type: process
uses: agent:assistant
policy: process-policy:implement

input:
  instruction: >-
    Implement the task given as input brief in this checkout of the
    candidate. Do not commit; Agister keeps your changes.
  params:
    candidate: {default: HEAD}
    brief: {}
  values:
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    brief: {source: file, path: "${param.brief}"}

workspace:
  checkout: candidate_revision
  # A fresh checkout holds only tracked files. If the agent needs untracked
  # configuration, a setup command prepares it before the first turn; what
  # it makes must be ignored by git. `.agister/workspace.yaml` can give one
  # setup for every process with a checkout.
  # setup: {command: ./scripts/link-local-config, timeout: 1m}

output:
  format: text

# The repository's verification, verifies/repo.yaml: the command, its
# limits and what the agent is told when it fails. A repository supplies its
# own in .agister/verifies/repo.yaml; without one in either place a call
# of this process is refused.
verify: verify:repo
