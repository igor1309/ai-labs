schema: agister.workflow/v1alpha1
name: review_panel

type: workflow

input:
  params:
    base: {default: origin/HEAD}
    candidate: {default: HEAD}
    architecture: {}
  values:
    base: {source: git.revision, rev: "${param.base}"}
    candidate: {source: git.revision, rev: "${param.candidate}"}
    architecture: {source: param, name: architecture}

fan_out:
  - {node: adversarial, uses: process:adversarial_review, agent: reviewer}
  - {node: architecture, uses: process:architecture_review, agent: reviewer}

join: {node: summary, uses: process:review_summary, agent: reviewer}
