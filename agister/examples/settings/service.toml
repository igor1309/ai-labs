schema = "agister.service/v1alpha1"

# Hard limits no policy may exceed. Retries are not supported yet.
max_timeout = "1h"
max_attempts = 1
# Runs of a process's verification command per call, the first included;
# a process may declare fewer, never more.
max_verify_attempts = 3

# The permission vocabulary. Policies and runtime mappings may use only these.
permissions = [
  "repository.read",
  "repository.search",
  "repository.diff",
  "repository.history.read",
  "repository.write",
  "repository.history.write",
  "process.execute",
  "network",
  "host.read",
  "host.write",
]

# Permissions that change the workspace or its history. Read-only
# workspace access withholds them.
writing = ["repository.write", "repository.history.write"]

# Writing beyond the workspace could change Agister's own state, so this is
# never granted, whatever a policy allows. Reading the host is granted where
# a policy allows it: Codex's sandboxes and Claude Code's file tools always
# read outside the workspace, so they run only under such a policy.
state_reaching = ["host.write"]
