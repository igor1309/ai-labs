# Writing in a checkout of the candidate. Claude Code's Edit and Write are
# verified but grant host.write, and its read tools and Bash reach the host
# too (runtimes/claude-code.yaml). The shipped service.toml lists host.read
# and host.write as state-reaching, so on the shipped settings the agent is
# granted no file tool and writing is withheld; verification runs either
# way.
schema: agister.process-policy/v1alpha1
name: implement

workspace:
  access: read-write
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.search
    - repository.diff
    - repository.write
    - process.execute

timeout: 30m
