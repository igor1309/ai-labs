# Writing in a checkout of the candidate. Claude Code's Edit and Write are
# not yet verified, and Bash reaches the host (runtimes/claude-code.yaml),
# so on the shipped mapping the agent is granted reading only and writing is
# withheld; verification runs either way.
schema: agister.process-policy/v1alpha1
name: implement

workspace:
  access: read-write
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.search
    - repository.diff
    - repository.write
    - process.execute

timeout: 30m
max_cost_usd: 5
