schema: agister.process-policy/v1alpha1
name: static-review

workspace:
  access: read-only
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search

timeout: 20m
retry:
  max_attempts: 1

isolation:
  deny:
    - repository.write
    - repository.history.write
    - process.execute
    - network
