# Read-only questions. The allowlist is what Codex's read-only sandbox
# grants under contract codex/2, which runs commands and reads the host. A
# process under this policy runs on Codex only when the repository's
# service opts in to host reads, by not listing host.read as
# state-reaching; under the shipped service it is still refused.
schema: agister.process-policy/v1alpha1
name: read-only

workspace:
  access: read-only
  scope: repository

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 10m
