# Read-only questions. The allowlist is what Codex's read-only sandbox
# grants under contract codex/2, which runs commands and reads the host, so
# a process under this policy runs on Codex as well as on Claude Code.
schema: agister.process-policy/v1alpha1
name: read-only

workspace:
  access: read-only
  scope: repository

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 10m
