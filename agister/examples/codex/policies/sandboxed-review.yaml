schema: agister.process-policy/v1alpha1
name: sandboxed-review

workspace:
  access: read-only
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 20m
retry:
  max_attempts: 1

isolation:
  deny:
    - repository.write
    - repository.history.write
    - network
