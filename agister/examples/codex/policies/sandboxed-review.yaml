# Review policy for Codex's read-only sandbox under contract codex/2:
# unlike static-review it allows what that sandbox grants, which runs
# commands, reads history and reads the host. A process under this policy
# runs on Codex only when the repository's service opts in to host reads,
# by not listing host.read as state-reaching; under the shipped service it
# is still refused.

schema: agister.process-policy/v1alpha1
name: sandboxed-review

workspace:
  access: read-only
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 20m
retry:
  max_attempts: 1

isolation:
  deny:
    - repository.write
    - repository.history.write
    - network
