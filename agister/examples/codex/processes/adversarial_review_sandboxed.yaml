# The adversarial review for sandboxed runtimes: same work and contract,
# different agent and policy.

schema: agister.process/v1alpha1
name: adversarial_review_sandboxed

type: process
uses: agent:codex-reviewer
policy: process-policy:sandboxed-review
prompt: adversarial-review

input:
  instruction: >-
    Review the exact candidate independently and adversarially. Report material
    correctness, safety, contract, and maintainability findings. Do not assume a
    suspected defect or focus supplied outside this process.
  params:
    base: {default: origin/HEAD}
    candidate: {default: HEAD}
  values:
    base_revision: {source: git.revision, rev: "${param.base}"}
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    diff: {source: git.diff, base: "${value.base_revision}", head: "${value.candidate_revision}"}
    changed_files: {source: git.changed_files, base: "${value.base_revision}", head: "${value.candidate_revision}"}

workspace:
  revision: candidate_revision

output:
  format: json
  schema: review-result
  require_valid: true
