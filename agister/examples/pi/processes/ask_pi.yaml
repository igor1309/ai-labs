schema: agister.process/v1alpha1
name: ask_pi

type: process
uses: agent:pi-minimax
prompt: ask

input:
  instruction: >-
    Answer the question about the repository in the working directory.
    Be concise and cite files where relevant.
  params:
    question: {}
  values:
    question: {source: param, name: question}

workspace:
  access: read-only
  scope: repository

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 10m

output:
  format: text
