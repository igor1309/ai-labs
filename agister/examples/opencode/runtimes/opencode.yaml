schema: agister.runtime/v1alpha1
name: opencode
adapter: opencode
contract: opencode/1
efforts: [none, minimal, low, medium, high, xhigh, max]
primitives:
  select: any
  items:
    read: {grants: [repository.read, host.read]}
    grep: {grants: [repository.search, host.read]}
    glob: {grants: [repository.read, host.read]}
    skill: {grants: [repository.read, host.read]}
    edit: {grants: [repository.write]}
    webfetch: {grants: [network]}
    websearch: {grants: [network]}
    bash:
      grants:
        - process.execute
        - repository.read
        - repository.search
        - repository.diff
        - repository.history.read
        - repository.write
        - repository.history.write
        - network
        - host.read
        - host.write
