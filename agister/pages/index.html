<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agister</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#14161a; --card:#1c1f26; --line:#2b2f38; --fg:#e6e8ec;
    --fg2:#bec0c4; --fg3:#999ca1; --dim:#9aa1ad; --low:#3fb950;
    --mid:#d29922; --high:#f85149; --accent:#58a6ff; --active:#00e5ff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  code, .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  body > header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 16px; font-weight: 600; }
  main { padding: 24px 20px 64px; max-width: 1080px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .dim { color: var(--dim); }
  .error { color: var(--high); }

  .header-right { display: flex; align-items: center; gap: 8px; }
  #refresh {
    width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    font-size: 17px; line-height: 1; color: var(--fg2);
  }
  #refresh:hover { border-color: var(--dim); color: var(--fg); }
  #refresh.spinning { color: var(--accent); border-color: var(--accent); cursor: progress; }
  #refresh .glyph { display: inline-block; }
  #refresh.spinning .glyph { animation: spin .6s linear infinite; }
  .read-at { color: var(--fg3); font-size: 12px; font-variant-numeric: tabular-nums; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .picker { position: relative; }
  #picker-button {
    display: flex; align-items: center; gap: 8px; max-width: 420px;
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  }
  #picker-button:hover { border-color: var(--dim); }
  #picker-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; width: 320px;
    padding: 6px 0;
  }
  .menu h2 { margin: 4px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--fg3); }
  .menu ul { list-style: none; margin: 0; padding: 0; }
  .menu li { display: flex; align-items: center; }
  .menu .item { flex: 1; min-width: 0; text-align: left; padding: 6px 14px; display: flex; justify-content: space-between; gap: 8px; }
  .menu .item:hover, .menu .remove:hover { background: var(--line); }
  .menu .item:disabled { color: var(--fg3); cursor: progress; background: none; }
  .menu .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .item .when { color: var(--fg3); font-size: 12px; white-space: nowrap; }
  .menu .remove { padding: 6px 12px; color: var(--fg3); }
  .menu .remove:hover { color: var(--high); }
  .menu .empty, .menu .note, .menu .status { margin: 4px 14px; font-size: 12px; }
  .menu .note { color: var(--fg3); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  #status { margin: 0 0 16px; }

  section.card { padding: 16px 20px; margin-bottom: 20px; }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .section-head h2 { margin: 0; font-size: 16px; }
  .section-head .note { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); font-weight: 600; padding: 0 12px 8px 0; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--fg2); }
  tr:last-child td { border-bottom: none; }
  td:first-child code { color: var(--fg); font-weight: 600; }
  tr:target td { background: #1f3b57; }
  td.num { white-space: nowrap; }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .muted { color: var(--fg3); }
  .outside { color: var(--mid); }
  .required { color: var(--fg); }
  .unused { color: var(--fg3); font-style: italic; }
  .access-read-only { color: var(--low); }
  .access-read-write { color: var(--mid); }
</style>
</head>
<body>
<header>
  <h1>Agister</h1>
  <div class="header-right">
  <span id="read-at" class="read-at"></span>
  <button id="refresh" type="button" title="Refresh: read the settings again" aria-label="Refresh"><span class="glyph">↻</span></button>
  <div id="picker" class="picker">
    <button id="picker-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="picker-menu">
      <span id="picker-label" class="mono">~</span>
    </button>
    <div id="picker-menu" class="menu card" hidden>
      <ul><li><button id="open-home" class="item" type="button">
        <span class="name mono">~</span><span class="when">Agister home, ~/.agister</span>
      </button></li></ul>
      <hr>
      <h2>Recent repos</h2>
      <ul id="recent-list"></ul>
      <p id="recent-empty" class="empty dim" hidden>No recent repos.</p>
      <hr>
      <ul><li><button id="add-folder" class="item" type="button">Add folder…</button></li></ul>
      <p id="picker-status" class="status error" role="status" hidden></p>
    </div>
  </div>
  </div>
</header>
<main>
  <p id="status" class="error" role="status" hidden></p>
  <div id="dashboard" hidden></div>
</main>
<script src="repos.js"></script>
<script src="config.js"></script>
<script type="module">
  const R = globalThis.AgisterRepos;
  const C = globalThis.AgisterConfig;

  // current: the path shown, ~ for Agister home.
  const state = { current: null };
  let renderToken = 0;

  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...children) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children.filter((c) => c != null && c !== false));
    return node;
  };

  function say(id, text) {
    const node = $(id);
    node.textContent = text || '';
    node.hidden = !text;
  }

  const label = (id) => (id === R.HOME_ID ? '~' : R.baseName(id));

  // --- picker ---

  function setMenu(open) {
    $('picker-menu').hidden = !open;
    $('picker-button').setAttribute('aria-expanded', String(open));
    say('picker-status', '');
    if (open) renderRecent();
  }

  function when(ms) {
    const d = new Date(ms);
    return d.toDateString() === new Date().toDateString()
      ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function renderRecent() {
    const list = R.readRecent(localStorage);
    $('recent-list').replaceChildren(...list.map((entry) => {
      const open = el('button', { type: 'button', className: 'item', title: entry.id },
        el('span', { className: 'name mono', textContent: entry.name }),
        el('span', { className: 'when', textContent: when(entry.lastOpened) }));
      open.addEventListener('click', () => open_(entry.id));
      const remove = el('button', { type: 'button', className: 'remove', textContent: '×' });
      remove.setAttribute('aria-label', `Remove ${entry.name}`);
      remove.addEventListener('click', () => { R.forgetRepo(localStorage, entry.id); renderRecent(); });
      return el('li', {}, open, remove);
    }));
    $('recent-empty').hidden = list.length > 0;
  }

  // Asks the server for the settings at id (a repo path, or ~) and shows
  // them. Only a repo whose .agister was found goes on the recent list; on
  // failure the page says why and keeps what it showed. The user's home
  // folder holds Agister's home, so it shows as ~ and leaves the list.
  async function open_(path) {
    const token = ++renderToken;
    let id, files;
    try {
      ({ id, files } = await R.fetchSettings(fetch, path));
      if (id !== path) R.forgetRepo(localStorage, path);
    } catch (err) {
      if (token !== renderToken) return;
      if (!$('picker-menu').hidden) say('picker-status', err.message);
      else say('status', err.message);
      return;
    }
    if (token !== renderToken) return;
    if (id !== R.HOME_ID) R.rememberRepo(localStorage, id, Date.now());
    R.writeCurrent(localStorage, id);
    state.current = id;
    setMenu(false);
    say('status', '');
    await render(token, files);
  }

  // Asks for a folder in the Mac's own dialog and opens it; cancelling
  // changes nothing. The button waits while the dialog is open; the server
  // also refuses a second dialog.
  async function addFolder() {
    const button = $('add-folder');
    if (button.disabled) return;
    say('picker-status', '');
    button.disabled = true;
    button.textContent = 'Choosing a folder…';
    let path;
    try {
      path = await R.chooseFolder(fetch);
    } catch (err) {
      return say('picker-status', err.message);
    } finally {
      button.disabled = false;
      button.textContent = 'Add folder…';
    }
    if (path) open_(path);
  }

  // --- dashboard ---

  async function render(token, files) {
    $('picker-label').textContent = label(state.current);
    $('picker-button').title = state.current === R.HOME_ID ? 'Agister home, ~/.agister' : state.current;
    const now = new Date();
    $('read-at').textContent = `read ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    $('read-at').title = `Settings read from disk at ${now.toLocaleString()}`;
    let model;
    try {
      model = await C.loadAgister(R.agisterFromFiles(files));
    } catch (err) {
      if (token === renderToken) say('status', `Could not read .agister: ${err.message}`);
      return;
    }
    if (token !== renderToken) return;
    const sections = [
      workflows(model.workflows),
      processes(model.processes),
      agents(model.agents),
      policies(model.policies),
      runtimes(model.runtimes),
      schemas(model.schemas),
      limits(model.service),
    ].filter(Boolean);
    $('dashboard').replaceChildren(...sections);
    $('dashboard').hidden = false;
    if (!sections.length) say('status', `${label(state.current)}: .agister holds no settings.`);
  }

  const anchor = (kind, name) => `${kind}-${name}`;
  const code = (text, className = '') => el('code', { className, textContent: text });
  const text = (value, className = '') => el('span', { className, textContent: value });
  const none = () => text('—', 'muted');

  // A name that links to its row, or is marked when defined outside the repo.
  function ref(kind, name, outside) {
    if (!name) return none();
    if (outside) {
      return el('span', { className: 'outside', title: `Not in this repo's .agister: defined in Agister's home or built in` },
        code(name, 'outside'), text(' ↗'));
    }
    return el('a', { href: `#${anchor(kind, name)}` }, code(name));
  }

  function refs(kind, names) {
    if (!names?.length) return text('unused', 'unused');
    return el('div', { className: 'list' }, ...names.map((n) => ref(kind, n, false)));
  }

  // The row's name cell; the file's purpose shows on hover.
  function nameCell(kind, item) {
    return el('td', { title: item.purpose || '' }, code(item.name));
  }

  // A table section; build(item) returns the cells after the name.
  function section(title, note, kind, columns, items, build) {
    if (!items.length) return null;
    return el('section', { className: 'card' },
      el('header', { className: 'section-head' },
        el('h2', { textContent: title }),
        note ? el('span', { className: 'note', textContent: note }) : null),
      el('table', {},
        el('thead', {}, el('tr', {}, ...columns.map((c) => el('th', { textContent: c })))),
        el('tbody', {}, ...items.map((item) => {
          const row = el('tr', { id: anchor(kind, item.name) });
          if (item.error) {
            row.append(el('td', {}, code(item.name)),
              el('td', { colSpan: columns.length - 1, className: 'error', textContent: `${item.file}: ${item.error}` }));
          } else {
            row.append(nameCell(kind, item), ...build(item).map((c) => el('td', {}, c)));
          }
          return row;
        }))));
  }

  function params(list) {
    if (!list.length) return none();
    return el('div', { className: 'list' }, ...list.map((p) => (p.default === undefined
      ? el('span', {}, code(p.name, 'required'), text(' required', 'muted'))
      : el('span', {}, code(p.name), text(` = ${p.default}`, 'muted')))));
  }

  function workflows(items) {
    return section('Workflows', 'run several processes, then one that collects their results', 'workflow',
      ['Workflow', 'Runs together', 'Then', 'Params'], items, (w) => [
        w.fanOut.length ? el('div', { className: 'list' }, ...w.fanOut.map((n) => ref('process', n.process, n.outside))) : none(),
        w.join ? ref('process', w.join.process, w.join.outside) : none(),
        params(w.params),
      ]);
  }

  function processes(items) {
    return section('Processes', 'one agent call each', 'process',
      ['Process', 'Agent', 'Policy', 'Output', 'Verify', 'Params', 'In workflows'], items, (p) => [
        ref('agent', p.agent, p.agentOutside),
        ref('policy', p.policy, p.policyOutside),
        p.output ? ref('schema', p.output, p.outputOutside) : none(),
        p.verify ? text(`up to ${p.verify.maxAttempts ?? '?'}×`) : none(),
        params(p.params),
        p.usedBy.length ? refs('workflow', p.usedBy) : none(),
      ]);
  }

  function agents(items) {
    return section('Agents', null, 'agent',
      ['Agent', 'Runtime', 'Model', 'Effort', 'Session', 'Used by'], items, (a) => [
        ref('runtime', a.runtime, a.runtimeOutside),
        a.model ? code(a.model) : none(),
        a.effort ? text(a.effort) : none(),
        a.session ? text(a.session) : none(),
        refs('process', a.usedBy),
      ]);
  }

  function policies(items) {
    return section('Policies', 'what a process may do', 'policy',
      ['Policy', 'Workspace', 'Timeout', 'Cost cap', 'Allows', 'Denies', 'Used by'], items, (p) => [
        p.access ? text(p.access, `access-${p.access}`) : none(),
        p.timeout ? text(p.timeout) : none(),
        p.maxCostUsd != null ? text(`$${p.maxCostUsd}`) : none(),
        el('span', { title: p.allow.join('\n') }, text(p.allow.length ? `${p.allow.length} permissions` : 'nothing')),
        p.deny.length ? el('span', { title: p.deny.join('\n') }, text(`${p.deny.length} permissions`)) : none(),
        refs('process', p.usedBy),
      ]);
  }

  function runtimes(items) {
    return section('Runtimes', 'defined here; others are built into Agister', 'runtime',
      ['Runtime', 'Adapter', 'Contract', 'Checked on', 'Used by'], items, (r) => [
        r.adapter ? text(r.adapter) : none(),
        r.contract ? code(r.contract) : none(),
        r.verified.length ? text(r.verified.map((v) => v.replace(/\.$/, '.x')).join(', ')) : none(),
        refs('agent', r.usedBy),
      ]);
  }

  function schemas(items) {
    return section('Output schemas', null, 'schema', ['Schema', 'Used by'], items, (s) => [refs('process', s.usedBy)]);
  }

  // service.toml: the caps no policy or process may go past.
  function limits(service) {
    if (!service) return null;
    const head = el('header', { className: 'section-head' },
      el('h2', { textContent: 'Service limits' }),
      el('span', { className: 'note', textContent: 'service.toml: caps no policy or process may go past' }));
    if (service.error) {
      return el('section', { className: 'card' }, head, el('p', { className: 'error', textContent: service.error }));
    }
    const rows = [
      ['Longest timeout', service.maxTimeout, 'no policy may set a longer timeout'],
      ['Attempts per call', service.maxAttempts, 'how many times an agent call may be tried; 1 means no retries'],
      ['Verify attempts', service.maxVerifyAttempts, 'how many times a process may fix its work after the verify command fails'],
      ['Permissions', service.permissions, 'the words policies may use to allow or deny access'],
    ].filter(([, v]) => v != null);
    return el('section', { className: 'card' }, head,
      el('table', {},
        el('thead', {}, el('tr', {}, ...['Limit', 'Value', 'Meaning'].map((c) => el('th', { textContent: c })))),
        el('tbody', {}, ...rows.map(([name, value, meaning]) => el('tr', {},
          el('td', {}, text(name)), el('td', { className: 'num' }, code(String(value))), el('td', {}, text(meaning)))))));
  }

  // --- start ---

  $('picker-button').addEventListener('click', () => setMenu($('picker-menu').hidden));
  $('open-home').addEventListener('click', () => open_(R.HOME_ID));
  $('add-folder').addEventListener('click', addFolder);
  // ↻ spins while the settings are read, at least one turn so a fast read
  // is still seen.
  $('refresh').addEventListener('click', async () => {
    const button = $('refresh');
    if (button.classList.contains('spinning')) return;
    button.classList.add('spinning');
    await Promise.all([open_(state.current ?? R.HOME_ID), new Promise((r) => setTimeout(r, 600))]);
    button.classList.remove('spinning');
  });
  document.addEventListener('click', (e) => {
    // The path, not e.target: a replaced row is detached by now.
    if (!$('picker-menu').hidden && !e.composedPath().includes($('picker'))) setMenu(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('picker-menu').hidden) {
      setMenu(false);
      $('picker-button').focus();
    }
  });

  // Start where the page was left; with nothing chosen yet, at home.
  if (location.protocol === 'file:') say('status', R.NO_SERVER);
  else open_(R.readCurrent(localStorage) ?? R.HOME_ID);
</script>
</body>
</html>
