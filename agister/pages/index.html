<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agister</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#14161a; --card:#1c1f26; --line:#2b2f38; --fg:#e6e8ec;
    --fg2:#bec0c4; --fg3:#999ca1; --dim:#9aa1ad; --low:#3fb950;
    --mid:#d29922; --high:#f85149; --accent:#58a6ff; --active:#00e5ff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  code, .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  body > header {
    display: flex; align-items: center; justify-content: space-between;
    /* The header lines up with main: 1080px wide with 20px padding. */
    padding: 12px max(20px, calc((100% - 1080px) / 2 + 20px)); border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 16px; font-weight: 600; }
  main { padding: 24px 20px 64px; max-width: 1080px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .dim { color: var(--dim); }
  .error { color: var(--high); }

  .header-left, .header-right { display: flex; align-items: center; gap: 8px; }
  .header-left { gap: 16px; }
  .views { display: flex; }
  .views button {
    padding: 4px 12px; border: 1px solid var(--line); background: var(--card); font-size: 13px; color: var(--fg3);
  }
  .views button + button { border-left: 0; }
  .views button:first-child { border-radius: 8px 0 0 8px; }
  .views button:last-child { border-radius: 0 8px 8px 0; }
  .views button:hover { color: var(--fg); }
  .views button[aria-pressed="true"] { color: var(--fg); background: var(--line); }
  #refresh {
    width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    font-size: 17px; line-height: 1; color: var(--fg2);
  }
  #refresh:hover { border-color: var(--dim); color: var(--fg); }
  #refresh.spinning { color: var(--accent); border-color: var(--accent); cursor: progress; }
  #refresh .glyph { display: inline-block; }
  #refresh.spinning .glyph { animation: spin .6s linear infinite; }
  .read-at { color: var(--fg3); font-size: 12px; font-variant-numeric: tabular-nums; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .picker { position: relative; }
  #picker-button {
    display: flex; align-items: center; gap: 8px; max-width: 420px;
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  }
  #picker-button:hover { border-color: var(--dim); }
  #picker-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; width: 320px;
    padding: 6px 0;
  }
  .menu h2 { margin: 4px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--fg3); }
  .menu ul { list-style: none; margin: 0; padding: 0; }
  .menu li { display: flex; align-items: center; }
  .menu .item { flex: 1; min-width: 0; text-align: left; padding: 6px 14px; display: flex; justify-content: space-between; gap: 8px; }
  .menu .item:hover, .menu .remove:hover { background: var(--line); }
  .menu .item:disabled { color: var(--fg3); cursor: progress; background: none; }
  .menu .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .item .when { color: var(--fg3); font-size: 12px; white-space: nowrap; }
  .menu .remove { padding: 6px 12px; color: var(--fg3); }
  .menu .remove:hover { color: var(--high); }
  .menu .empty, .menu .note, .menu .status { margin: 4px 14px; font-size: 12px; }
  .menu .note { color: var(--fg3); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  #status { margin: 0 0 16px; }

  .intro { margin: 0 0 8px; color: var(--fg2); font-size: 13px; max-width: 760px; }
  h2.group { margin: 28px 0 2px; font-size: 18px; font-weight: 600; }
  .group-note { margin: 0 0 12px; color: var(--dim); font-size: 13px; }
  /* Two columns while both fit, one below that; never wider than the page. */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); gap: 16px; }
  article.run { padding: 16px 18px; min-width: 0; }
  .run-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .run-head h3 { margin: 0; font: 600 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }
  .purpose { margin: 6px 0 12px; color: var(--fg2); max-width: 760px; }
  .chip {
    font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 0 7px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--fg3); white-space: nowrap;
  }
  .chip.repo { color: var(--accent); border-color: #1f3b57; }
  .chip.replaces { color: var(--mid); border-color: #4a3a12; }
  .cmd {
    display: flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 6px 6px 6px 10px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  .cmd code { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--fg); }
  .cmd code::before { content: '$ '; color: var(--fg3); }
  .copy { font-size: 12px; color: var(--fg3); padding: 1px 8px; border: 1px solid var(--line); border-radius: 4px; }
  .copy:hover { color: var(--fg); border-color: var(--dim); }
  /* The facts of a card, in one font. */
  .facts {
    display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg2);
  }
  .facts .label { color: var(--fg3); }
  .facts .name { color: var(--fg); }
  .sub { color: var(--fg3); }
  /* A workflow's stages: each step a block with a rule on its left; the
     name and settings in monospace, what it does as a sentence. */
  .stage { margin-top: 16px; }
  .stage h4 {
    margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--dim);
  }
  .step { padding: 2px 0 2px 12px; border-left: 2px solid var(--line); max-width: 760px; }
  .step + .step { margin-top: 12px; }
  .step-name { font: 600 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }
  .step-purpose { margin: 2px 0 4px; color: var(--fg2); font-size: 13px; }
  .step-meta { font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg2); }
  .step-meta .label { color: var(--fg3); white-space: pre; }
  .missing { color: var(--high); }

  section.card { padding: 16px 20px; margin-bottom: 16px; }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .section-head h3 { margin: 0; font-size: 15px; }
  .section-head .note { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); font-weight: 600; padding: 0 12px 8px 0; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  /* One font in every cell: names and values alike. */
  td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--fg2);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  tr:last-child td { border-bottom: none; }
  td.name { color: var(--fg); font-weight: 600; white-space: nowrap; }
  /* Only a workspace that can be written is marked; read-only is the usual case. */
  .access-read-write { color: var(--mid); }
  td .access-read-only, td .access-read-write { white-space: nowrap; }

  /* Runs: a failed or interrupted run is red; the others are not marked. */
  .failed { color: var(--high); }
  td.short { white-space: nowrap; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 12px; font-size: 13px; color: var(--fg3); }
  .filters label { display: flex; align-items: center; gap: 6px; }
  .filters select {
    font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px;
  }
  tr.pick { cursor: pointer; }
  tr.pick:hover td, tr.pick.chosen td { background: var(--line); }
  tr.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #run-detail { margin-top: 16px; }
  #run-detail .facts a { color: var(--accent); }
  .record { margin-top: 14px; }
  .record summary { cursor: pointer; color: var(--fg3); font-size: 12px; }
  .record pre {
    margin: 8px 0 0; padding: 10px; max-height: 480px; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--fg2);
  }
  /* Knowledge: the matrix of skills and agents, and the opened agent or skill. */
  .link { color: var(--fg); font: inherit; text-align: left; }
  .link:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  th .link { font: 600 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: none; letter-spacing: 0; }
  th .sub { display: block; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .matrix { overflow-x: auto; }
  #knowledge-detail { margin-top: 16px; }
  #knowledge-detail a { color: var(--accent); }
  .stage ul { margin: 0; padding-left: 18px; color: var(--fg2); font-size: 13px; }
  .skill-head { display: flex; align-items: baseline; gap: 8px; }
  .source {
    margin: 8px 0 0; padding: 10px; max-height: 640px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--fg2);
  }
  .markdown { margin-top: 8px; max-width: 760px; color: var(--fg2); overflow-wrap: anywhere; }
  .markdown h3, .markdown h4, .markdown h5, .markdown h6 { margin: 14px 0 4px; color: var(--fg); font-size: 14px; }
  .markdown h3 { font-size: 16px; }
  .markdown p, .markdown ul, .markdown ol, .markdown blockquote { margin: 0 0 8px; }
  .markdown blockquote { padding-left: 12px; border-left: 2px solid var(--line); }
  .markdown pre { margin: 0 0 8px; padding: 10px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .markdown hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .markdown li > ul, .markdown li > ol { margin-bottom: 0; }
  .markdown table { width: auto; margin: 0 0 8px; }
  .markdown th { color: var(--fg); font-size: 12px; text-transform: none; letter-spacing: 0; white-space: normal; }
  .markdown td { font: inherit; padding: 4px 12px 4px 0; }
  .markdown .align-center { text-align: center; }
  .markdown .align-right { text-align: right; }
  /* A narrow screen stacks each row: the name, then label and value lines. */
  @media (max-width: 900px) {
    table, tbody, tr, td { display: block; }
    thead { display: none; }
    tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
    tr:last-child { border-bottom: none; }
    td { padding: 1px 0; border: none; }
    td[data-label] { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; }
    td[data-label]::before { content: attr(data-label); color: var(--fg3); }
    td[data-label] > * { justify-self: start; }
    td.name { white-space: normal; margin-bottom: 2px; }
    td[data-label]:empty { display: none; }
    /* A skill's own table stays a table. */
    .markdown table { display: table; }
    .markdown thead { display: table-header-group; }
    .markdown tbody { display: table-row-group; }
    .markdown tr { display: table-row; padding: 0; }
    .markdown td { display: table-cell; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div class="header-left">
  <h1>Agister</h1>
  <div class="views" role="group" aria-label="View">
    <button id="view-settings" type="button" aria-pressed="true">Settings</button>
    <button id="view-runs" type="button" aria-pressed="false">Runs</button>
    <button id="view-compare" type="button" aria-pressed="false">Compare</button>
    <button id="view-knowledge" type="button" aria-pressed="false">Knowledge</button>
  </div>
  </div>
  <div class="header-right">
  <span id="read-at" class="read-at"></span>
  <button id="refresh" type="button" title="Refresh: read the settings again" aria-label="Refresh"><span class="glyph">↻</span></button>
  <div id="picker" class="picker">
    <button id="picker-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="picker-menu">
      <span id="picker-label" class="mono">~</span>
    </button>
    <div id="picker-menu" class="menu card" hidden>
      <ul><li><button id="open-home" class="item" type="button">
        <span class="name mono">~</span><span class="when">Agister home, ~/.agister</span>
      </button></li></ul>
      <hr>
      <h2>Recent repos</h2>
      <ul id="recent-list"></ul>
      <p id="recent-empty" class="empty dim" hidden>No recent repos.</p>
      <hr>
      <ul><li><button id="add-folder" class="item" type="button">Add folder…</button></li></ul>
      <p id="picker-status" class="status error" role="status" hidden></p>
    </div>
  </div>
  </div>
</header>
<main>
  <p id="status" class="error" role="status" hidden></p>
  <div id="dashboard" hidden></div>
  <div id="runs" hidden></div>
  <div id="compare" hidden></div>
  <div id="knowledge" hidden></div>
</main>
<script src="repos.js"></script>
<script src="config.js"></script>
<script src="runs.js"></script>
<script src="markdown-it.min.js"></script>
<script src="knowledge.js"></script>
<script src="page.js"></script>
<script type="module">
  globalThis.AgisterPage.start({ document, fetch, localStorage, location, navigator, setTimeout });
</script>
</body>
</html>
