# Agister's check for every process that names verify:repo (ADR-010),
# launched in agister/ (ADR-028 rule 1): run with the operator's authority
# after each valid turn, in the call's worktree, at the candidate with the
# turn's changes (ADR-025), from the worktree root (ADR-028 rule 2); the
# node completes only when it passes. It covers gokit too.
schema: agister.verify/v1alpha1
name: repo
command: >-
  cd agister && test -z "$(gofmt -l .)" && go vet ./... &&
  go test -count=1 -timeout 1m ./... && go test -race -count=1 -timeout 1m ./internal/app/... &&
  cd ../gokit && test -z "$(gofmt -l .)" && go vet ./... && go test -race -count=1 -timeout 1m ./...
timeout: 5m
max_attempts: 3
instruction: >-
  The verification command failed on your changes. Fix the cause in the
  code; do not weaken, skip or delete a check or a test.
