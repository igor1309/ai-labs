schema: agister.workflow/v1alpha1
name: code_review

type: workflow

input:
  params:
    base: {default: origin/trunk}
    candidate: {default: HEAD}
    goal: {}
  values:
    base: {source: git.revision, rev: "${param.base}"}
    candidate: {source: git.revision, rev: "${param.candidate}"}
    goal: {source: file, path: "${param.goal}", form: [goal]}

fan_out:
  - {node: architecture, uses: process:architecture_review_codex, agent: codex-sol-61}
  - {node: tests, uses: process:tests_review_codex, agent: codex-sol-61}
  - {node: adversarial, uses: process:adversarial_review_codex, agent: codex-sol-61}
  - {node: clarity, uses: process:clarity_review_codex, agent: codex-sol-61}
  - {node: intent, uses: process:intent_review_codex, agent: codex-sol-61}

join: {node: judge, uses: process:review_judge, agent: claude-opus}
