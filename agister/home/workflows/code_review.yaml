schema: agister.workflow/v1alpha1
params:
  base: {default: origin/trunk}
  candidate: {default: HEAD}
  goal: {}
inputs:
  base: {source: git.revision, rev: {from: params.base}}
  candidate: {source: git.revision, rev: {from: params.candidate}}
  goal: {source: file, path: {from: params.goal}, form: [goal]}

steps:
  - name: reviews
    parallel:
      - {name: architecture, process: architecture_review, agent: codex-sol-61, inputs: {base: {from: inputs.base}, candidate: {from: inputs.candidate}, goal: {from: inputs.goal}}}
      - {name: tests, process: tests_review, agent: codex-sol-61, inputs: {base: {from: inputs.base}, candidate: {from: inputs.candidate}, goal: {from: inputs.goal}}}
      - {name: adversarial, process: adversarial_review, agent: codex-sol-61, inputs: {base: {from: inputs.base}, candidate: {from: inputs.candidate}, goal: {from: inputs.goal}}}
      - {name: clarity, process: clarity_review, agent: codex-sol-61, inputs: {base: {from: inputs.base}, candidate: {from: inputs.candidate}, goal: {from: inputs.goal}}}
      - {name: intent, process: intent_review, agent: codex-sol-61, inputs: {base: {from: inputs.base}, candidate: {from: inputs.candidate}, goal: {from: inputs.goal}}}
  - name: judge
    process: review_judge
    agent: claude-opus
    inputs: {reviews: {from: steps.reviews.outputs}}

outputs:
  judgement: {from: steps.judge.outputs}
