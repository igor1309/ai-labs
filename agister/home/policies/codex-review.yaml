# Read-only review under Codex's read-only sandbox, which runs commands and
# reads the host. No cost limit: contract codex/2 cannot enforce one.
schema: agister.process-policy/v1alpha1
name: codex-review

workspace:
  access: read-only
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 20m
retry:
  max_attempts: 1

# 2x+ the reviews' and advisor's longest event gap (282 s), 09-30..10-01; tool_command above a full check with -race.
stale:
  no_event: 10m
  tool_command: 8m
  repeated_tool_calls: 5

isolation:
  deny:
    - repository.write
    - repository.history.write
    - network
