schema: agister.process-policy/v1alpha1
name: codex-review

workspace:
  access: read-only
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 20m
retry:
  max_attempts: 1

stale:
  no_event: 10m
  tool_command: 8m
  repeated_tool_calls: 5

isolation:
  deny:
    - repository.write
    - repository.history.write
    - network
