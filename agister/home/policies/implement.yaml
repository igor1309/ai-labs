schema: agister.process-policy/v1alpha1
name: implement

workspace:
  access: read-write
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.search
    - repository.diff
    - repository.history.read
    - repository.write
    - repository.history.write
    - process.execute
    - network
    - host.read
    - host.write

timeout: 45m
retry:
  max_attempts: 1

stale:
  no_event: 21m
  tool_command: 15m
  repeated_tool_calls: 5
