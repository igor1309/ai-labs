schema: agister.process/v1alpha1
name: implement
type: process
uses: agent:claude-opus
session: resumable
prompt: implement

input:
  instruction: Implement the task given as input brief, as input prompt says.
  params:
    candidate: {default: HEAD}
    brief: {}
  values:
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    brief: {source: file, path: "${param.brief}", form: [goal, step]}

workspace:
  access: read-write
  scope: candidate
  revision: candidate_revision
  clean: true

tools:
  require:
    - repository.read
    - repository.write
    - process.execute
  allow:
    - repository.read
    - repository.search
    - repository.diff
    - repository.history.read
    - repository.write
    - repository.history.write
    - process.execute
    - network
    - host.read
    - host.write

timeout: 45m
retry:
  max_attempts: 1

stale:
  no_event: 21m
  tool_command: 15m
  repeated_tool_calls: 5

output:
  format: json
  schema: implementation
  require_valid: true

verify: verify:repo
