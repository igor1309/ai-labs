schema: agister.process/v1alpha1
prompt: advisor
instruction: >-
  Answer the question given as input question, following the prompt given
  as input prompt. The question file holds who asked, the question
  and its options. Your working directory is a read-only checkout of the
  revision: read the recorded decisions there yourself.

params:
  question: {}
  revision: {default: HEAD}
inputs:
  revision: {source: git.revision, rev: {from: params.revision}}
  question: {source: file, path: {from: params.question}}

workspace:
  access: read-only
  revision: {from: inputs.revision}

permissions:
  require:
    - repository.read
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

limits:
  time: 20m
  stale:
    no_event: 10m
    tool_command: 8m
    repeated_tool_calls: 5

output:
  schema: advice
