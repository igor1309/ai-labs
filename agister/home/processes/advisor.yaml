schema: agister.process/v1alpha1
name: advisor

type: process
uses: agent:codex-sol-61
prompt: advisor

input:
  instruction: >-
    Answer the question given as input question, following the prompt given
    as input prompt. The question file holds who asked, the question
    and its options. Your working directory is a read-only checkout of the
    revision: read the recorded decisions there yourself.
  params:
    question: {}
    revision: {default: HEAD}
  values:
    revision: {source: git.revision, rev: "${param.revision}"}
    question: {source: file, path: "${param.question}"}

workspace:
  access: read-only
  scope: candidate
  revision: revision

tools:
  require:
    - repository.read
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 20m
retry:
  max_attempts: 1

stale:
  no_event: 10m
  tool_command: 8m
  repeated_tool_calls: 5

isolation:
  deny:
    - repository.write
    - repository.history.write
    - network

output:
  format: json
  schema: advice
  require_valid: true
