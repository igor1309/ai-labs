schema: agister.process/v1alpha1
name: review

type: process
uses: agent:codex-sol-61

input:
  instruction: >-
    Review the exact candidate, your working directory, against the base,
    following the prompt given as input prompt. Read the
    change yourself: git diff <base_revision> <candidate_revision>, whole or
    per file of changed_files. Report material findings
    only, with repository-relative paths and candidate line numbers.
    Each finding carries its evidence: the concrete case, the trace you
    verified and its scope: in the change, or outside it but stopping the
    goal, or neither. A judge who never reads the code or the goal rules on
    that evidence alone; a finding without it is rejected.
    The input goal says what the change is for. Its claims about design or
    completeness are claims you check, as you check a commit message's. Its
    scope exclusions are the owner's: you may show that one stops the goal,
    but you cannot override it.
    Any guidance given as further inputs holds the rules the repository
    gives for the code it names: code in the change that departs from one
    is a finding, which quotes the rule.
  params:
    base: {default: origin/trunk}
    candidate: {default: HEAD}
    goal: {}
  values:
    base_revision: {source: git.revision, rev: "${param.base}"}
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    changed_files: {source: git.changed_files, base: "${value.base_revision}", head: "${value.candidate_revision}"}
    goal: {source: param, name: goal}

workspace:
  access: read-only
  scope: candidate
  revision: candidate_revision

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute
    - host.read

timeout: 20m
retry:
  max_attempts: 1

stale:
  no_event: 10m
  tool_command: 8m
  repeated_tool_calls: 5

isolation:
  deny:
    - repository.write
    - repository.history.write
    - network

output:
  format: json
  schema: review-result
  require_valid: true
