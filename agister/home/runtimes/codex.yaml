# A version is listed as verified for a primitive once
# agister/scripts/codex-sandbox-contract.py passes on it.
schema: agister.runtime/v1alpha1
name: codex
adapter: codex
contract: codex/2
efforts: [minimal, low, medium, high, xhigh]
primitives:
  select: one
  items:
    read-only:
      grants: [repository.read, repository.search, repository.diff, repository.history.read, process.execute, host.read]
      verified: ["0.158.", "0.159.", "0.160.", "0.161.", "0.162."]
    workspace-write:
      grants: [repository.read, repository.search, repository.diff, repository.history.read, process.execute, host.read,
               repository.write, host.write]
      verified: ["0.159.", "0.160.", "0.161.", "0.162."]
