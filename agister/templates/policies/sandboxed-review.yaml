# Review policy for runtimes that contain command execution in an OS sandbox
# (Codex). Unlike static-review it grants process.execute and history reads:
# a sandboxed runtime cannot withhold them, so it refuses static-review.

schema: agister.process-policy/v1alpha1
name: sandboxed-review

constraints:
  agent.model_family:
    not_equal: >-
      evidence.candidate(input.candidate_revision).provenance.writer.model_family
    on_unsatisfied: fail

workspace:
  access: read-only
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
    - repository.history.read
    - process.execute

timeout: 20m
retry:
  max_attempts: 1
resources:
  - reviews

isolation:
  deny:
    - repository.write
    - repository.history.write
    - network

artifacts:
  retain:
    - review_result
    - run_log
