<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Am I done?</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="shell" aria-labelledby="page-title">
        <header class="hero">
          <p data-testid="hero-eyebrow" class="eyebrow">Career Outlook</p>
          <h1 id="page-title" data-testid="hero-title">Am I done?</h1>
          <p data-testid="hero-intro" class="intro">Enter a profession and get a structured outlook in one response.</p>
        </header>

        <form data-testid="outlook-form" class="form">
          <label data-testid="profession-label" for="profession-input">Profession</label>
          <input
            id="profession-input"
            data-testid="profession-input"
            type="text"
            placeholder="e.g. software developer"
            autocomplete="off"
            required
          />
          <button data-testid="submit-button" type="submit">Get outlook</button>
        </form>

        <div class="state-stack" aria-live="polite">
          <p data-testid="loading" class="state" hidden>Analyzing your profession...</p>
          <p data-testid="transport-error" class="state error" hidden>Request failed. Please try again.</p>
        </div>

        <section data-testid="clarification" class="result-card" hidden>
          <h2 data-testid="clarification-title">Need clarification</h2>
          <p data-testid="clarification-message" class="result-lead"></p>
          <ul data-testid="clarification-suggestions" class="result-list"></ul>
        </section>

        <section data-testid="answer" class="result-card" hidden>
          <h2 data-testid="answer-headline"></h2>

          <article class="result-block">
            <h3 data-testid="time-horizon-title">Time horizon</h3>
            <p data-testid="answer-time-horizon-label" class="result-label"></p>
            <p data-testid="answer-time-horizon-explanation"></p>
          </article>

          <article class="result-block">
            <h3 data-testid="confidence-title">Confidence</h3>
            <p data-testid="answer-confidence-label" class="result-label"></p>
            <p data-testid="answer-confidence-rationale"></p>
          </article>

          <article class="result-block">
            <h3 data-testid="risks-title">Risks</h3>
            <ul data-testid="answer-key-risks" class="result-list"></ul>
          </article>

          <article class="result-block">
            <h3 data-testid="what-to-do-next-title">What to do next</h3>
            <ul data-testid="answer-what-to-do-next" class="result-list"></ul>
          </article>

          <article class="result-block">
            <h3 data-testid="assumptions-title">Assumptions</h3>
            <ul data-testid="answer-assumptions" class="result-list"></ul>
          </article>
        </section>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
