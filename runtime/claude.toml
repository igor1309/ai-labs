schema_version = 1
runtime = "claude"
launcher = "claude"
executable = "claude"
provider = "anthropic"
unavailable_model_policy = "stop"

[roles.planner]
model = "opus"
reasoning_effort = "high"
context_mode = "warm"
access = "read-only"

[roles.implementer]
model = "sonnet"
reasoning_effort = "medium"
context_mode = "cold"
access = "workspace-write"

[roles.reviewer]
model = "opus"
reasoning_effort = "high"
context_mode = "cold"
access = "read-only"

[roles.escalation]
model = "opus"
reasoning_effort = "high"
context_mode = "warm"
access = "read-only"

[independent_review]
runtime = "codex"
launcher = "codex"
executable = "codex"
provider = "openai"
model = "gpt-5.6-sol"
reasoning_effort = "high"
context_mode = "cold"
access = "read-only"
classification = "cross-runtime"

[presets]
