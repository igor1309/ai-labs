schema_version = 1
runtime = "claude"
launcher = "claude"
provider = "anthropic"
unavailable_model_policy = "stop"

[roles.planner]
model = "opus"
reasoning_effort = "high"
context_mode = "warm"

[roles.implementer]
model = "sonnet"
reasoning_effort = "medium"
context_mode = "warm"

[roles.reviewer]
model = "opus"
reasoning_effort = "high"
context_mode = "cold"

[roles.escalation]
model = "opus"
reasoning_effort = "high"
context_mode = "warm"

[independent_review]
runtime = "codex"
launcher = "codex"
provider = "openai"
model = "gpt-5.6-sol"
reasoning_effort = "high"
context_mode = "cold"
classification = "cross-runtime"

