name: nomos-staging

services:
  nomos:
    build: .
    container_name: nomos-staging
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NOMOS_JSON_BODY_LIMIT: ${NOMOS_JSON_BODY_LIMIT:-1mb}
    volumes:
      - nomos-staging-data:/app/data
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - default
      - nomos-shared
    labels:
      com.logging.project: nomos
      com.logging.service: api

networks:
  nomos-shared:
    external: true

volumes:
  nomos-staging-data:
