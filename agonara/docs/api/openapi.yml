openapi: 3.1.0
info:
  title: Agonara API
  version: 0.1.0
  summary: API-first structured learning program environment.
  description: |
    Canonical route-level OpenAPI contract for implemented Agonara HTTP surfaces. Detailed domain field semantics remain governed by the linked Agonara Markdown specs; this contract locks routes, transport security, shared envelopes, request headers, status families, and client-facing operation names.
  license:
    name: Private
    identifier: LicenseRef-Private
servers:
  - url: http://127.0.0.1:8080
    description: Local container or development server
  - url: https://staging.agonara.enoa.ai
    description: Private staging instance
tags:
  - name: operations
    description: Health, diagnostics, and operator-triggered runtime work.
  - name: identity
    description: Bootstrap, sessions, identities, Admin authority, and audit inspection.
  - name: programs
    description: Program shell, participation, invitations, participants, and membership recovery.
  - name: corpus
    description: Sources, candidates, accepted corpus, navigation, checks, and target links.
  - name: student-workspace
    description: Student-owned attempts, learner state, readiness, and evidence reads.
  - name: curator-workspace
    description: Curator-only diagnostics and LLM-assisted draft suggestions.
  - name: ui
    description: HTML shells that consume the API.
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: agonara_session
      description: Server-managed opaque session cookie.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Agonara-CSRF
      description: Required for state-changing session-backed requests.
    idempotencyKey:
      type: apiKey
      in: header
      name: X-Agonara-Idempotency-Key
      description: Required for Student attempt submissions; never returned by the API.
    operationsTriggerToken:
      type: http
      scheme: bearer
      description: Optional host-configured operations trigger token.
  headers:
    SessionCookie:
      description: Server-managed `agonara_session` cookie.
      schema:
        type: string
  parameters:
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdentityId:
      name: identityId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdentityIdQuery:
      name: identityId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TargetLinkId:
      name: targetLinkId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TargetKind:
      name: targetKind
      in: path
      required: true
      schema:
        type: string
        enum:
          - topic
          - concept
          - material
          - check
          - readiness_check
    TargetId:
      name: targetId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ParticipationKind:
      name: participationKind
      in: path
      required: true
      schema:
        type: string
        enum:
          - student
          - program_curator
    ParticipationKindQuery:
      name: participationKind
      in: query
      required: false
      schema:
        type: string
        enum:
          - student
          - program_curator
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    CandidateStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/CandidateStatus"
    InvitationStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - pending
          - accepted
          - declined
          - revoked
    MembershipStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - left
          - removed
    AcceptedKind:
      name: acceptedKind
      in: query
      required: false
      schema:
        type: string
        enum:
          - topic
          - concept
    CheckRevisionId:
      name: checkRevisionId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    ReadinessCheckRevisionId:
      name: readinessCheckRevisionId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    CoverageGapScopeKind:
      name: scopeKind
      in: query
      required: false
      schema:
        type: string
        enum:
          - program
          - topic
          - period
    CoverageGapScopeId:
      name: scopeId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    CoverageGapMinimumSeverity:
      name: minimumSeverity
      in: query
      required: false
      schema:
        type: string
        enum:
          - info
          - warning
          - critical
    CoverageGapKind:
      name: gapKind
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    LlmSuggestionStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - draft_suggestion
          - materialized
          - rejected
    LlmSuggestionKind:
      name: suggestionKind
      in: query
      required: false
      schema:
        type: string
        enum:
          - navigation_candidate
          - quick_check_candidate
          - assessment_criterion_candidate
          - open_answer_check_candidate
          - readiness_check_candidate
  requestBodies:
    SetSourceContent:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - content
              - contentFormat
            properties:
              content:
                type: string
                minLength: 1
              contentFormat:
                type: string
                enum:
                  - markdown
                  - plain_text
            additionalProperties: false
    SetAcceptedMaterialContent:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - content
              - contentFormat
            properties:
              content:
                type: string
                minLength: 1
              contentFormat:
                type: string
                enum:
                  - markdown
                  - plain_text
              sourceContentProvenance:
                type: object
                additionalProperties: true
            additionalProperties: false
    LifecycleStatus:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - active
                  - withdrawn
            additionalProperties: false
    OptionalObject:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    EvaluatorTick:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              evaluatorJobId:
                type: string
                minLength: 1
            additionalProperties: false
    IdentityBootstrap:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - bootstrapSecret
              - displayName
              - login
              - password
            properties:
              bootstrapSecret:
                type: string
                minLength: 1
              displayName:
                type: string
                minLength: 1
              login:
                type: string
                minLength: 1
              password:
                type: string
                minLength: 1
            additionalProperties: false
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - login
              - password
            properties:
              login:
                type: string
                minLength: 1
              password:
                type: string
                minLength: 1
            additionalProperties: false
    DisplayName:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - displayName
            properties:
              displayName:
                type: string
                minLength: 1
            additionalProperties: false
    LocalPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - login
              - password
            properties:
              login:
                type: string
                minLength: 1
              password:
                type: string
                minLength: 1
            additionalProperties: false
    CreateProgram:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
            properties:
              title:
                type: string
                minLength: 1
              description:
                type: string
            additionalProperties: false
    AdmissionPolicy:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - admissionPolicy
            properties:
              admissionPolicy:
                type: string
                enum:
                  - self_join
                  - invitation_only
            additionalProperties: false
    CreateInvitation:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - participationKind
              - targetIdentityId
            properties:
              participationKind:
                type: string
                const: student
              targetIdentityId:
                type: string
                minLength: 1
            additionalProperties: false
    MembershipRecovery:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - programId
              - targetIdentityId
              - participationKind
              - recoveryReason
            properties:
              programId:
                type: string
                minLength: 1
              targetIdentityId:
                type: string
                minLength: 1
              participationKind:
                type: string
                enum:
                  - student
                  - program_curator
              recoveryReason:
                type: string
                minLength: 1
            additionalProperties: false
    MembershipRevocation:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - programId
              - targetIdentityId
              - participationKind
              - revocationReason
            properties:
              programId:
                type: string
                minLength: 1
              targetIdentityId:
                type: string
                minLength: 1
              participationKind:
                type: string
                enum:
                  - student
                  - program_curator
              revocationReason:
                type: string
                minLength: 1
            additionalProperties: false
    ProgramSource:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - sourceKind
              - title
            properties:
              sourceKind:
                type: string
                minLength: 1
              title:
                type: string
                minLength: 1
              locator:
                type: string
              citation:
                type: string
            additionalProperties: false
    CorpusCandidate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - candidateKind
              - title
            properties:
              candidateKind:
                type: string
                minLength: 1
              title:
                type: string
                minLength: 1
              body:
                type: string
              sourceIds:
                type: array
                items:
                  type: string
                  minLength: 1
              rationale:
                type: string
            additionalProperties: false
    TargetEntity:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              targetEntityId:
                type: string
                minLength: 1
            additionalProperties: false
    NavigationCandidate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    AssessmentCriterionCandidate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    OpenAnswerCheckCandidate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    QuickCheckCandidate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ReadinessCheckCandidate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    LearnerStateTargetLink:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    OpenAnswerAttempt:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - checkRevisionId
              - submittedAnswer
            properties:
              checkRevisionId:
                type: string
                minLength: 1
              submittedAnswer:
                type: string
                minLength: 1
            additionalProperties: false
    QuickCheckAttempt:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - checkRevisionId
              - selectedOptionId
            properties:
              checkRevisionId:
                type: string
                minLength: 1
              selectedOptionId:
                type: string
                minLength: 1
            additionalProperties: false
    ReadinessCheckAttempt:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - readinessCheckRevisionId
            properties:
              readinessCheckRevisionId:
                type: string
                minLength: 1
            additionalProperties: false
    LlmCurationSuggestionGeneration:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    Accepted:
      description: Operation accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedObjectResult"
    Rejected:
      description: Operation rejected by validation, session, authorization, or domain policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RejectedResult"
    Fault:
      description: Unexpected fault; details are redacted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FaultResult"
    Html:
      description: HTML shell.
      content:
        text/html:
          schema:
            type: string
  schemas:
    AcceptedObjectResult:
      type: object
      required:
        - status
        - value
      properties:
        status:
          type: string
          const: accepted
        value:
          type: object
          additionalProperties: true
      additionalProperties: false
    RejectedResult:
      type: object
      required:
        - status
        - reason
      properties:
        status:
          type: string
          const: rejected
        reason:
          $ref: "#/components/schemas/ApiRejectionReason"
      additionalProperties: false
    FaultResult:
      type: object
      required:
        - status
        - reason
      properties:
        status:
          type: string
          const: fault
        reason:
          type: string
          const: internal_error
      additionalProperties: false
    HealthResult:
      type: object
      required:
        - status
        - checkedAt
        - requestId
        - version
      properties:
        status:
          type: string
          const: ok
        checkedAt:
          type: string
          format: date-time
        requestId:
          type: string
        version:
          type: string
      additionalProperties: false
    CandidateStatus:
      type: string
      enum:
        - draft
        - accepted
        - rejected
    ApiRejectionReason:
      type: string
      enum:
        - accepted_entity_not_found
        - accepted_entity_program_mismatch
        - accepted_kind_mismatch
        - accepted_revision_not_found
        - admin_or_curator_required
        - admin_required
        - attempt_not_found
        - bootstrap_already_completed
        - candidate_already_accepted
        - candidate_already_rejected
        - candidate_not_found
        - check_candidate_already_accepted
        - check_candidate_already_rejected
        - check_candidate_not_found
        - check_entity_not_found
        - check_entity_program_mismatch
        - check_revision_not_found
        - check_revision_program_mismatch
        - content_not_found
        - content_too_large
        - coverage_gap_not_found
        - coverage_gap_scope_not_found
        - coverage_gap_scope_program_mismatch
        - criterion_candidate_already_accepted
        - criterion_candidate_already_rejected
        - criterion_candidate_not_found
        - criterion_entity_not_found
        - criterion_entity_program_mismatch
        - criterion_revision_not_found
        - csrf_invalid
        - csrf_required
        - entity_withdrawal_blocked
        - idempotency_conflict
        - identity_already_has_credential
        - identity_disabled
        - identity_not_active
        - identity_not_found
        - invalid_bootstrap_secret
        - invalid_credentials
        - invitation_conflict
        - invitation_not_found
        - invitation_not_pending
        - last_admin_removal
        - last_curator_required
        - learner_state_evidence_owner_not_found
        - learner_state_evidence_owner_program_mismatch
        - learner_state_target_link_not_found
        - learner_state_target_not_found
        - learner_state_target_program_mismatch
        - llm_curation_suggestion_already_materialized
        - llm_curation_suggestion_already_rejected
        - llm_curation_suggestion_not_found
        - login_already_bound
        - material_content_already_set
        - membership_already_active
        - membership_left
        - membership_missing
        - membership_removed
        - navigation_entity_not_found
        - navigation_prerequisite_cycle
        - navigation_relationship_endpoint_kind_mismatch
        - navigation_relationship_program_mismatch
        - navigation_relationship_self_reference
        - navigation_revision_not_found
        - not_found
        - participation_required
        - policy_not_satisfied
        - program_creation_incomplete
        - program_curator_required
        - program_not_found
        - provider_adapter_not_found
        - provider_budget_exceeded
        - provider_execution_failed
        - provider_output_rejected
        - quick_check_candidate_already_accepted
        - quick_check_candidate_already_rejected
        - quick_check_candidate_not_found
        - quick_check_entity_not_found
        - quick_check_entity_program_mismatch
        - quick_check_revision_not_found
        - quick_check_revision_program_mismatch
        - rate_limited
        - readiness_candidate_already_accepted
        - readiness_candidate_already_rejected
        - readiness_candidate_not_found
        - readiness_entity_not_found
        - readiness_entity_program_mismatch
        - readiness_requirement_id_conflict
        - readiness_requirement_program_mismatch
        - readiness_requirement_target_not_found
        - readiness_revision_not_found
        - readiness_revision_program_mismatch
        - readiness_scope_not_found
        - readiness_scope_program_mismatch
        - revision_not_found
        - selected_option_not_found
        - session_expired
        - session_not_found
        - session_revoked
        - source_not_found
        - source_hard_delete_blocked
        - source_program_mismatch
        - suggestion_materialization_rejected
        - suggestion_policy_not_found
        - suggestion_rejection_failed
        - target_identity_disabled
        - target_identity_not_found
        - unsupported_participation_kind
        - validation_failed
        - worker_already_running
paths:
  /operations/health:
    get:
      tags:
        - operations
      operationId: getOperationsHealth
      summary: Read service health and deployed version.
      security: []
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResult"
        "404":
          $ref: "#/components/responses/Rejected"
        "500":
          $ref: "#/components/responses/Fault"
  /operations/diagnostics:
    get:
      tags:
        - operations
      operationId: getOperationsDiagnostics
      summary: Read Admin-only operational diagnostics.
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "401":
          $ref: "#/components/responses/Rejected"
        "403":
          $ref: "#/components/responses/Rejected"
        "500":
          $ref: "#/components/responses/Fault"
  /operations/open-answer-evaluator/tick:
    post:
      tags:
        - operations
      operationId: tickOpenAnswerEvaluator
      summary: Trigger one open-answer evaluator worker tick.
      security:
        - sessionCookie: []
        - operationsTriggerToken: []
      requestBody:
        $ref: "#/components/requestBodies/EvaluatorTick"
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/Rejected"
        "401":
          $ref: "#/components/responses/Rejected"
        "403":
          $ref: "#/components/responses/Rejected"
        "409":
          $ref: "#/components/responses/Rejected"
        "500":
          $ref: "#/components/responses/Fault"
  /admin:
    get:
      tags:
        - ui
      operationId: getAdminBoard
      summary: Serve the private Admin operations board HTML shell.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "404":
          $ref: "#/components/responses/Rejected"
  /learn:
    get:
      tags:
        - ui
      operationId: getLearnShell
      summary: Serve the learner and curator product HTML shell.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "404":
          $ref: "#/components/responses/Rejected"
  /identity/bootstrap/status:
    get:
      tags:
        - identity
      operationId: getIdentityBootstrapStatus
      summary: Read whether first-Admin bootstrap remains available.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "404":
          $ref: "#/components/responses/Rejected"
        "500":
          $ref: "#/components/responses/Fault"
  /identity/bootstrap/admin:
    post:
      tags:
        - identity
      operationId: bootstrapFirstAdmin
      summary: Bootstrap the first Admin while no effective Admin exists.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/IdentityBootstrap"
      responses:
        "200":
          description: Operation accepted.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedObjectResult"
        "400":
          $ref: "#/components/responses/Rejected"
        "401":
          $ref: "#/components/responses/Rejected"
        "409":
          $ref: "#/components/responses/Rejected"
        "429":
          $ref: "#/components/responses/Rejected"
        "500":
          $ref: "#/components/responses/Fault"
  /identity/sessions:
    post:
      tags:
        - identity
      operationId: createIdentitySession
      summary: Sign in with a local password credential.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          description: Operation accepted.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedObjectResult"
        "400":
          $ref: "#/components/responses/Rejected"
        "401":
          $ref: "#/components/responses/Rejected"
        "429":
          $ref: "#/components/responses/Rejected"
        "500":
          $ref: "#/components/responses/Fault"
  /identity/session:
    delete:
      tags:
        - identity
      operationId: deleteIdentitySession
      summary: Sign out the current session.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Operation accepted.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedObjectResult"
        "401":
          $ref: "#/components/responses/Rejected"
        "403":
          $ref: "#/components/responses/Rejected"
        "500":
          $ref: "#/components/responses/Fault"
    get:
      tags:
        - identity
      operationId: getIdentitySession
      summary: Resolve the current session and return a CSRF token.
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "401":
          $ref: "#/components/responses/Rejected"
        "403":
          $ref: "#/components/responses/Rejected"
        "500":
          $ref: "#/components/responses/Fault"
  /identity/identities:
    get:
      tags:
        - identity
      operationId: listIdentities
      summary: List identities for an Admin session.
      responses:
        "200":
          $ref: "#/components/responses/Accepted"
        "401":
          $ref: "#/components/responses/Rejected"
        "403":
