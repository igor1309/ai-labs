name: MizanBLE
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  MizanBLEApp:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  MizanBLE:
    type: application
    platform: iOS
    sources:
      - MizanBLE
    dependencies:
      - package: MizanBLEApp
        product: Root
      - package: MizanBLEApp
        product: DeviceRadios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.igor1309.mizan-ble
        APP_DISPLAY_NAME: Mizan BLE
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MizanBLE/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        NSBluetoothAlwaysUsageDescription: Mizan BLE uses Bluetooth to pay a nearby till, or to be the till.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  MizanBLE Rehearsal:
    type: application
    platform: iOS
    sources:
      - MizanBLERehearsal
      - MizanBLE/AppIcon.icon
    dependencies:
      - package: MizanBLEApp
        product: Root
      - package: MizanBLEApp
        product: ScriptedRadio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.igor1309.mizan-ble.rehearsal
        PRODUCT_NAME: MizanBLE Rehearsal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APP_DISPLAY_NAME: Mizan Rehearsal
        INFOPLIST_FILE: MizanBLE/Info.plist
schemes:
  MizanBLE:
    build:
      targets:
        MizanBLE: all
    run:
      config: Debug
  MizanBLE Rehearsal:
    build:
      targets:
        MizanBLE Rehearsal: all
    run:
      config: Debug
