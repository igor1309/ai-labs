appId: dev.igor1309.mizan-ble.rehearsal
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Bluetooth off"
    timeout: 15000
- tapOn:
    id: "key 1"
- assertVisible:
    text: "Lock & broadcast"
    enabled: false
- tapOn: "Client"
- extendedWaitUntil:
    visible: "Bluetooth is off"
    timeout: 15000
- assertVisible: "No signal"
- assertVisible:
    text: "Start handshake"
    enabled: false
- assertNotVisible: "Confirm"
- tapOn: "Host"
- assertVisible: "Bluetooth off"
- assertVisible:
    text: "Lock & broadcast"
    enabled: false
