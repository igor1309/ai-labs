appId: dev.igor1309.mizan-ble.rehearsal
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Lock & broadcast"
    timeout: 15000
- tapOn:
    id: "key 1"
- tapOn:
    id: "key 2"
- tapOn:
    id: "key 3"
- tapOn:
    id: "key \\."
- tapOn:
    id: "key 4"
- tapOn:
    id: "key 5"
- tapOn: "Lock & broadcast"
- extendedWaitUntil:
    visible: "Handshake failed"
    timeout: 15000
- assertVisible: "The client could not finish the handshake. Broadcast again or start over."
- tapOn: "Broadcast again"
- assertVisible: "Waiting for a client"
- extendedWaitUntil:
    visible: "Handshake failed"
    timeout: 15000
- assertVisible: "New amount"
