appId: dev.igor1309.mizan-ble.rehearsal
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Near is in range. Start the handshake to see the amount."
    timeout: 15000
- tapOn: "Start handshake"
- extendedWaitUntil:
    visible: "Near asks for"
    timeout: 15000
- assertVisible: "123.45 Mizan"
- assertNotVisible: "Far asks for"
