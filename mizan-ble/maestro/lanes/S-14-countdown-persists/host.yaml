appId: dev.igor1309.mizan-ble.rehearsal
---
- launchApp:
    clearState: false
- tapOn: "Settings"
- tapOn: "90 s"
- tapOn: "Done"
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Lock & broadcast"
    timeout: 15000
- tapOn:
    id: "key 1"
- tapOn:
    id: "key 2"
- tapOn:
    id: "key 3"
- tapOn:
    id: "key \\."
- tapOn:
    id: "key 4"
- tapOn:
    id: "key 5"
- tapOn: "Lock & broadcast"
- assertVisible: "90 seconds left"
- assertVisible: "TIMEOUT 90 S · SETTINGS"
