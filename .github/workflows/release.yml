name: Release (Legacy Oracle)

# LEGACY WORKFLOW — Oracle-specific, triggers on global v* tags.
#
# Coexistence boundary (ADR-000):
#   This workflow handles Oracle releases via the v* tag namespace
#   (tied to root package.json). New per-unit releases use the
#   <basename>_v<version> tag format and are handled by release-unit.yml.
#
# Migration path:
#   When Oracle is added to release-units.config.toml with its own
#   metadata (release.toml or package.json in oracle/), this workflow
#   should be retired in favor of release-unit.yml with an Oracle-specific
#   deploy job.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          lock_version="$(node -p 'JSON.parse(require("fs").readFileSync("package-lock.json","utf8")).version')"
          expected="v${version}"
          if [ "${lock_version}" != "${version}" ]; then
            echo "package-lock.json version must match package.json version: lock=${lock_version} package=${version}" >&2
            exit 1
          fi
          if [ "${TAG}" != "${expected}" ]; then
            echo "release tag must match package.json version: tag=${TAG} expected=${expected}" >&2
            exit 1
          fi

      - name: Verify tag commit is on trunk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin
          git fetch origin trunk:refs/remotes/origin/trunk
          tag_sha="$(git rev-list -n1 "${TAG}")"
          git merge-base --is-ancestor "${tag_sha}" "origin/trunk"

  core:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: ./scripts/run_silent.sh "build" npx tsc --noEmit

      - name: Run tests
        run: ./scripts/run_silent.sh "tests" npm test

  real-provider-smoke:
    needs: [core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires:
    # - vars.OPENROUTER_CI_MODEL (cheap model for the smoke gate)
    # - secrets.NOMOS_ORACLE_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run real-provider smoke
        env:
          LLM_API_KEY: ${{ secrets.NOMOS_ORACLE_TOKEN }}
          NORMALIZER_MODEL: ${{ vars.OPENROUTER_CI_MODEL }}
          LLM_TIMEOUT_MS: "180000"
          OUTLOOK_MODEL: ${{ vars.OPENROUTER_CI_MODEL }}
          RUN_REAL_PROVIDER_SMOKE: "1"
        run: ./scripts/run_silent.sh "real-provider-smoke" node --test oracle/apps/am-i-done-web/tests/web-real-provider-smoke.test.js

  web-e2e:
    needs: [core]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers npx playwright install --with-deps chromium

      - name: Run web E2E tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
          RUN_WEB_E2E: "1"
        run: ./scripts/run_silent.sh "web-e2e" node --test oracle/apps/am-i-done-web/tests/web-e2e.test.js

  deploy:
    needs: [core, real-provider-smoke, web-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required Cloudflare credentials for wrangler:
      # - secrets.CLOUDFLARE_API_TOKEN
      # - secrets.CLOUDFLARE_ACCOUNT_ID (if needed by your Cloudflare setup)
      - name: Deploy worker
        run: npm run worker:deploy

      - name: Deploy web
        run: npm run web:deploy

  github-release:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generateReleaseNotes: false
          draft: false
          prerelease: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    if: ${{ always() && !cancelled() && (needs.verify.result == 'failure' || needs.core.result == 'failure' || needs.real-provider-smoke.result == 'failure' || needs.web-e2e.result == 'failure' || needs.deploy.result == 'failure' || needs.github-release.result == 'failure') }}
    needs: [verify, core, real-provider-smoke, web-e2e, deploy, github-release]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "Release (Legacy Oracle)"
      ref_label: "tag"
      ref_value: ${{ github.ref_name }}
      job_results: |
        verify=${{ needs.verify.result }}
        core=${{ needs.core.result }}
        real-provider-smoke=${{ needs.real-provider-smoke.result }}
        web-e2e=${{ needs.web-e2e.result }}
        deploy=${{ needs.deploy.result }}
        github-release=${{ needs.github-release.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
