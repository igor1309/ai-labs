name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          lock_version="$(node -p 'JSON.parse(require("fs").readFileSync("package-lock.json","utf8")).version')"
          expected="v${version}"
          if [ "${lock_version}" != "${version}" ]; then
            echo "package-lock.json version must match package.json version: lock=${lock_version} package=${version}" >&2
            exit 1
          fi
          if [ "${TAG}" != "${expected}" ]; then
            echo "release tag must match package.json version: tag=${TAG} expected=${expected}" >&2
            exit 1
          fi

      - name: Verify tag commit is on trunk
        run: |
          git fetch origin trunk:refs/remotes/origin/trunk
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/trunk"

  core:
    needs: [verify]
    uses: ./.github/workflows/core.yml

  web-e2e:
    needs: [core]
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-web-e2e.yml

  deploy:
    needs: [core, web-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required Cloudflare credentials for wrangler:
      # - secrets.CLOUDFLARE_API_TOKEN
      # - secrets.CLOUDFLARE_ACCOUNT_ID (if needed by your Cloudflare setup)
      - name: Deploy worker
        run: npm run worker:deploy

      - name: Deploy web
        run: npm run web:deploy

  notify:
    if: ${{ always() && !cancelled() && (needs.verify.result == 'failure' || needs.core.result == 'failure' || needs.web-e2e.result == 'failure' || needs.deploy.result == 'failure') }}
    needs: [verify, core, web-e2e, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
        run: |
          failed_jobs=""
          if [ "${{ needs.verify.result }}" = "failure" ]; then
            failed_jobs="verify"
          fi
          if [ "${{ needs.core.result }}" = "failure" ]; then
            [ -n "$failed_jobs" ] && failed_jobs="$failed_jobs, "
            failed_jobs="${failed_jobs}core"
          fi
          if [ "${{ needs.web-e2e.result }}" = "failure" ]; then
            [ -n "$failed_jobs" ] && failed_jobs="$failed_jobs, "
            failed_jobs="${failed_jobs}web-e2e"
          fi
          if [ "${{ needs.deploy.result }}" = "failure" ]; then
            [ -n "$failed_jobs" ] && failed_jobs="$failed_jobs, "
            failed_jobs="${failed_jobs}deploy"
          fi
          text="❌ Release failed: ${failed_jobs}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./scripts/ci/notify_telegram_failure.sh "${text}"
