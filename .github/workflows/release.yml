name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          lock_version="$(node -p 'JSON.parse(require("fs").readFileSync("package-lock.json","utf8")).version')"
          expected="v${version}"
          if [ "${lock_version}" != "${version}" ]; then
            echo "package-lock.json version must match package.json version: lock=${lock_version} package=${version}" >&2
            exit 1
          fi
          if [ "${TAG}" != "${expected}" ]; then
            echo "release tag must match package.json version: tag=${TAG} expected=${expected}" >&2
            exit 1
          fi

      - name: Verify tag commit is on trunk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin
          git fetch origin trunk:refs/remotes/origin/trunk
          tag_sha="$(git rev-list -n1 "${TAG}")"
          git merge-base --is-ancestor "${tag_sha}" "origin/trunk"

  core:
    needs: [verify]
    uses: ./.github/workflows/core.yml
    with:
      ref: ${{ github.ref_name }}

  real-provider-smoke:
    needs: [core]
    # Requires:
    # - vars.OPENROUTER_CI_MODEL (cheap model for the smoke gate)
    # - secrets.OPENROUTER_API_KEY
    uses: ./.github/workflows/core-real-provider-smoke.yml
    with:
      ref: ${{ github.ref_name }}
      openrouter_model: ${{ vars.OPENROUTER_CI_MODEL }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  web-e2e:
    needs: [core]
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-web-e2e.yml
    with:
      ref: ${{ github.ref_name }}

  deploy:
    needs: [core, real-provider-smoke, web-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required Cloudflare credentials for wrangler:
      # - secrets.CLOUDFLARE_API_TOKEN
      # - secrets.CLOUDFLARE_ACCOUNT_ID (if needed by your Cloudflare setup)
      - name: Deploy worker
        run: npm run worker:deploy

      - name: Deploy web
        run: npm run web:deploy

  github-release:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generateReleaseNotes: false
          draft: false
          prerelease: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    if: ${{ always() && !cancelled() && (needs.verify.result == 'failure' || needs.core.result == 'failure' || needs.real-provider-smoke.result == 'failure' || needs.web-e2e.result == 'failure' || needs.deploy.result == 'failure' || needs.github-release.result == 'failure') }}
    needs: [verify, core, real-provider-smoke, web-e2e, deploy, github-release]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      ref: ${{ github.ref_name }}
      title: "Release"
      ref_label: "tag"
      ref_value: ${{ github.ref_name }}
      job_results: |
        verify=${{ needs.verify.result }}
        core=${{ needs.core.result }}
        real-provider-smoke=${{ needs.real-provider-smoke.result }}
        web-e2e=${{ needs.web-e2e.result }}
        deploy=${{ needs.deploy.result }}
        github-release=${{ needs.github-release.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
