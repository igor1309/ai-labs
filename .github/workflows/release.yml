name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match v<package.json version>)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          lock_version="$(node -p 'JSON.parse(require("fs").readFileSync("package-lock.json","utf8")).version')"
          expected="v${version}"
          if [ "${lock_version}" != "${version}" ]; then
            echo "package-lock.json version must match package.json version: lock=${lock_version} package=${version}" >&2
            exit 1
          fi
          if [ "${TAG}" != "${expected}" ]; then
            echo "release tag must match package.json version: tag=${TAG} expected=${expected}" >&2
            exit 1
          fi

      - name: Verify tag commit is on trunk
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          git fetch --force --tags origin
          git fetch origin trunk:refs/remotes/origin/trunk
          tag_sha="$(git rev-list -n1 "${TAG}")"
          git merge-base --is-ancestor "${tag_sha}" "origin/trunk"

  core:
    needs: [verify]
    uses: ./.github/workflows/core.yml
    with:
      ref: ${{ env.RELEASE_TAG }}

  real-provider-smoke:
    needs: [core]
    # Requires:
    # - vars.OPENROUTER_CI_MODEL (cheap model for the smoke gate)
    # - secrets.OPENROUTER_API_KEY
    uses: ./.github/workflows/core-real-provider-smoke.yml
    with:
      ref: ${{ env.RELEASE_TAG }}
      openrouter_model: ${{ vars.OPENROUTER_CI_MODEL }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  web-e2e:
    needs: [core]
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-web-e2e.yml
    with:
      ref: ${{ env.RELEASE_TAG }}

  deploy:
    needs: [core, real-provider-smoke, web-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required Cloudflare credentials for wrangler:
      # - secrets.CLOUDFLARE_API_TOKEN
      # - secrets.CLOUDFLARE_ACCOUNT_ID (if needed by your Cloudflare setup)
      - name: Deploy worker
        run: npm run worker:deploy

      - name: Deploy web
        run: npm run web:deploy

  github-release:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generateReleaseNotes: false
          draft: false
          prerelease: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    if: ${{ always() && !cancelled() && (needs.verify.result == 'failure' || needs.core.result == 'failure' || needs.real-provider-smoke.result == 'failure' || needs.web-e2e.result == 'failure' || needs.deploy.result == 'failure' || needs.github-release.result == 'failure') }}
    needs: [verify, core, real-provider-smoke, web-e2e, deploy, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          CORE_RESULT: ${{ needs.core.result }}
          REAL_PROVIDER_SMOKE_RESULT: ${{ needs.real-provider-smoke.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GITHUB_RELEASE_RESULT: ${{ needs.github-release.result }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed_jobs=""
          for entry in "verify:${VERIFY_RESULT}" "core:${CORE_RESULT}" "real-provider-smoke:${REAL_PROVIDER_SMOKE_RESULT}" "web-e2e:${WEB_E2E_RESULT}" "deploy:${DEPLOY_RESULT}" "github-release:${GITHUB_RELEASE_RESULT}"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            if [ "${result}" = "failure" ]; then
              [ -n "${failed_jobs}" ] && failed_jobs="${failed_jobs}, "
              failed_jobs="${failed_jobs}${job}"
            fi
          done
          text="$(printf "❌ Release failed: %s\nrepo: %s\ntag: %s\ncommit: %s\nrun: %s" "${failed_jobs}" "${REPO}" "${RELEASE_TAG}" "${SHA}" "${RUN_URL}")"
          ./scripts/ci/notify_telegram_failure.sh "${text}"
