name: Mac Health Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    # mac-health is a macOS tool: its checks and installer call the system's
    # own df, stat and date.
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Run tests
        run: ./scripts/run_silent.sh "mac-health-tests" sh tools/mac-health/tests/run-all.sh
