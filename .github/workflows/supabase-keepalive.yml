name: Supabase Keep-Alive

# Write a heartbeat to Supabase every 3 days to prevent free-tier auto-pause (7-day inactivity limit).
# Updates public.keepalive (id=1) — a write resets the inactivity timer; SELECTs do not reliably.
# Runs at 07:00 UTC (10:00 Moscow time).

on:
  schedule:
    - cron: "0 7 */3 * *"   # 10:00 MSK, every 3rd day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write Supabase keepalive heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X PATCH \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping_at\":\"${NOW}\"}" \
            "${SUPABASE_URL}/rest/v1/keepalive?id=eq.1")
          echo "Supabase keepalive PATCH: HTTP ${HTTP_CODE}"
          [ "${HTTP_CODE}" = "204" ] || { echo "Keep-alive failed"; exit 1; }

  notify:
    if: ${{ always() && !cancelled() && needs.ping.result == 'failure' }}
    needs: [ping]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "Supabase Keep-Alive"
      ref_label: "branch"
      ref_value: "trunk"
      job_results: |
        ping=${{ needs.ping.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
