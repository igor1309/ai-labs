name: Web E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers npx playwright install --with-deps chromium

      - name: Run web E2E tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
          RUN_WEB_E2E: "1"
        run: ./scripts/run_silent.sh "web-e2e" node --test oracle/apps/am-i-done-web/tests/web-e2e.test.js

  notify:
    if: ${{ !cancelled() && needs.web-e2e.result == 'failure' }}
    needs: [web-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
        run: |
          text="❌ Web E2E failed
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${CI_BOT_TOKEN}/sendMessage" \
            -d chat_id="${CI_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="${text}"
