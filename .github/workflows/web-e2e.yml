name: Web E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-e2e:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/core-web-e2e.yml

  notify:
    if: ${{ always() && !cancelled() && needs.web-e2e.result == 'failure' }}
    needs: [web-e2e]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "Web E2E"
      ref_label: "branch"
      ref_value: ${{ github.ref_name }}
      job_results: |
        web-e2e=${{ needs.web-e2e.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
