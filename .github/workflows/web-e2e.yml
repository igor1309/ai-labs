name: Web E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-e2e:
    uses: ./.github/workflows/core-web-e2e.yml

  notify:
    if: ${{ !cancelled() && needs.web-e2e.result == 'failure' }}
    needs: [web-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
        run: |
          text="❌ Web E2E failed
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./scripts/ci/notify_telegram_failure.sh "${text}"
