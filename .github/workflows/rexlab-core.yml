name: RexLab Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: rexlab
        run: npm ci

      - name: Typecheck
        working-directory: rexlab
        run: npm run typecheck

      - name: Run tests
        working-directory: rexlab
        run: npm test -- --shard=${{ matrix.shard }}/4

      - name: Build
        working-directory: rexlab
        run: npm run build

  # The released app, built once for the browser contracts that open it.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: rexlab
        run: npm ci

      - name: Build the app
        working-directory: rexlab
        run: npx vite build --outDir "$RUNNER_TEMP/rexlab-app"

      - name: Keep the app for the browser contracts
        uses: actions/upload-artifact@v4
        with:
          name: rexlab-app
          path: ${{ runner.temp }}/rexlab-app
          include-hidden-files: true
          retention-days: 1

  # Each browser contract runs in a job of its own, with its own 10-minute
  # limit, on the app built once above.
  browser:
    needs: [app]
    strategy:
      fail-fast: false
      matrix:
        script:
          - compareQuestion
          - compareResult
          - compareFlow
          - whoseJawBoardLandscape
          - catalogueFit
          - coloringProbe
          - coloringPainter
          - coloringWorkshop
          - coloringDrawing
          - coloringGallery
          - coloringResult
          - coloringFlow
          - homePhone
          - nativeTouch
          - homeTiles
          - careFriends
          - languagePicker
          - browserChrome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: rexlab
        run: npm ci

      - name: Install browser engine
        working-directory: rexlab
        run: |
          if [ "${{ matrix.script }}" = "browserChrome" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Take the built app
        uses: actions/download-artifact@v4
        with:
          name: rexlab-app
          path: ${{ runner.temp }}/rexlab-app

      - name: Run browser contract
        working-directory: rexlab
        env:
          REXLAB_APP_BUILD: ${{ runner.temp }}/rexlab-app
        run: node tests/${{ matrix.script }}.browser.cjs
