name: RexLab Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: rexlab
        run: npm ci

      - name: Typecheck
        working-directory: rexlab
        run: npm run typecheck

      - name: Run tests
        working-directory: rexlab
        run: npm test

      - name: Build
        working-directory: rexlab
        run: npm run build
