name: RexLab Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: rexlab
        run: npm ci

      - name: Typecheck
        working-directory: rexlab
        run: npm run typecheck

      - name: Run tests
        working-directory: rexlab
        run: npm test -- --shard=${{ matrix.shard }}/4

      - name: Build
        working-directory: rexlab
        run: npm run build

  # The browser contracts run on this Mac's runner, one after another in
  # one job: one runner takes one job at a time, and a job per contract
  # would queue past the 15-minute local-wait limit. Each contract owns its
  # server and build, keeps its own 10-minute limit, and every failure is
  # named, not only the first.
  browser:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: rexlab
        run: npm ci

      - name: Install browser engines
        working-directory: rexlab
        run: npx playwright install chromium webkit

      # The contracts that open the released app share one build of it.
      - name: Build the app
        working-directory: rexlab
        run: npx vite build --outDir "$RUNNER_TEMP/rexlab-app"

      - name: Run browser contracts
        working-directory: rexlab
        env:
          REXLAB_APP_BUILD: ${{ runner.temp }}/rexlab-app
        run: |
          failed=()
          for script in compareQuestion compareResult compareFlow whoseJawBoardLandscape catalogueFit \
            coloringProbe coloringPainter coloringWorkshop coloringDrawing coloringGallery coloringResult \
            coloringFlow homePhone nativeTouch homeTiles careFriends languagePicker browserChrome; do
            echo "::group::$script"
            if ! perl -e 'alarm 600; exec @ARGV' node "tests/$script.browser.cjs"; then failed+=("$script"); fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::Failed: ${failed[*]}"; exit 1; fi
