name: RexLab Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: rexlab
        run: npm ci

      - name: Typecheck
        working-directory: rexlab
        run: npm run typecheck

      - name: Run tests
        working-directory: rexlab
        run: npm test -- --shard=${{ matrix.shard }}/4

      - name: Build
        working-directory: rexlab
        run: npm run build

      - name: Install Chromium
        if: matrix.shard == 1
        working-directory: rexlab
        run: npx playwright install --with-deps chromium

      - name: Check board geometry in Chromium
        if: matrix.shard == 1
        working-directory: rexlab
        run: npm run test:browser

      - name: Check coloring technical probe in Chromium
        if: matrix.shard == 1
        working-directory: rexlab
        run: node tests/coloringProbe.browser.cjs

      - name: Check production coloring pixels in Chromium
        if: matrix.shard == 1
        working-directory: rexlab
        run: node tests/coloringPainter.browser.cjs

      - name: Check coloring workshop in Chromium
        if: matrix.shard == 1
        working-directory: rexlab
        run: node tests/coloringWorkshop.browser.cjs

      - name: Check long coloring contacts in Chromium
        if: matrix.shard == 1
        working-directory: rexlab
        run: node tests/coloringDrawing.browser.cjs

      - name: Check coloring gallery in Chromium
        if: matrix.shard == 1
        working-directory: rexlab
        run: node tests/coloringGallery.browser.cjs

      - name: Check coloring result in Chromium
        if: matrix.shard == 1
        working-directory: rexlab
        run: node tests/coloringResult.browser.cjs
