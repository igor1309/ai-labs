name: Warder Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # Self-hosted: Go caches persist on the runner; uploading them hangs.
          cache: false

      - name: Format, vet and test every module
        run: warder/scripts/test.sh
