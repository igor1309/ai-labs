name: Doc Drift Agent Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # The scope-registry coverage check uses only Node built-ins (node:test,
      # node:fs); no install is needed.
      - name: Scope-registry coverage check
        run: ./scripts/run_silent.sh "tests" node --test doc-drift-agent/tests/*.test.js
