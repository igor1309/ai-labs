name: Notio Frontend Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: notio-frontend-deploy
  cancel-in-progress: false

jobs:
  core:
    uses: ./.github/workflows/notio-frontend-core.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  deploy:
    needs: [core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.NOTIO_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.NOTIO_SUPABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Wrangler dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: notio/frontend
        run: npm ci

      - name: Build frontend
        working-directory: notio/frontend
        run: npm run build

      - name: Deploy frontend
        run: WRANGLER_LOG_PATH=.wrangler/logs npx wrangler pages deploy dist --project-name notio-frontend --cwd notio/frontend
