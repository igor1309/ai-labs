name: Clipdeck Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: clipdeck-deploy
  cancel-in-progress: false

jobs:
  core:
    uses: ./.github/workflows/clipdeck-core.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  deploy:
    needs: [core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLIPDECK_PRODUCTION_URL: ${{ vars.CLIPDECK_PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        run: WRANGLER_LOG_PATH=.wrangler/logs npx wrangler deploy --cwd clipdeck

      - name: Verify unauthenticated API is locked
        run: |
          status="$(curl -sS --max-time 30 -D /tmp/clipdeck-api-headers.txt -o /tmp/clipdeck-api-body.txt -w "%{http_code}" "${CLIPDECK_PRODUCTION_URL}/api/items")"
          echo "HTTP status: ${status}"
          if grep -q '"sections"' /tmp/clipdeck-api-body.txt; then
            echo "Clipdeck item data was returned to an unauthenticated request"
            exit 1
          fi
          normalized_body="$(tr -d '\n\r\t ' < /tmp/clipdeck-api-body.txt)"
          if [ "${normalized_body}" = '{"error":"unauthorized"}' ]; then
            echo "Old Worker unauthorized body returned instead of Cloudflare Access handling"
            exit 1
          fi
          if [ "${status}" = "302" ] || [ "${status}" = "303" ]; then
            location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { print $0 }' /tmp/clipdeck-api-headers.txt)"
            if echo "${location}" | grep -Eiq 'Cloudflare Access|cloudflareaccess|/cdn-cgi/access'; then
              exit 0
            fi
            echo "Redirect did not point to Cloudflare Access"
            exit 1
          fi
          if [ "${status}" = "401" ] || [ "${status}" = "403" ]; then
            exit 0
          fi
          echo "Expected Cloudflare Access 302, 303, 401, or 403"
          exit 1
