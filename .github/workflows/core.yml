name: Core

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: ./scripts/run_silent.sh "build" npx tsc --noEmit

      - name: Run tests
        run: ./scripts/run_silent.sh "tests" npm test
