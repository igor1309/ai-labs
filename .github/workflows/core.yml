name: Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  changes:
    if: ${{ inputs.ref == '' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      oracle: ${{ steps.filter.outputs.oracle }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed projects
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - ".github/workflows/**"
              - ".node-version"
              - "package-lock.json"
              - "package.json"
              - "scripts/**"
              - "tsconfig.json"
              - "vendor/**"
            oracle:
              - "oracle/**"

  oracle-on-ref:
    if: ${{ inputs.ref != '' }}
    uses: ./.github/workflows/oracle-core.yml
    with:
      ref: ${{ inputs.ref }}

  oracle-on-dispatch:
    if: ${{ inputs.ref == '' && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/oracle-core.yml

  oracle-on-changes:
    needs: [changes]
    if: ${{ inputs.ref == '' && (needs.changes.outputs.oracle == 'true' || needs.changes.outputs.shared == 'true') }}
    uses: ./.github/workflows/oracle-core.yml
