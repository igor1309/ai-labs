name: Agonara Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: ./scripts/run_silent.sh "build" npx tsc --noEmit

      - name: Run tests
        run: ./scripts/run_silent.sh "agonara-tests" npm test --workspace agonara

      - name: Build Docker image
        run: docker build -t agonara:ci agonara

      - name: Smoke container start
        run: |
          cid=$(docker run --rm -d -e AGONARA_BOOTSTRAP_SECRET=ci-bootstrap-secret -p 127.0.0.1:18080:8080 agonara:ci)
          trap 'docker rm -f "$cid"' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:18080/operations/health > /tmp/agonara-health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          grep '"status":"ok"' /tmp/agonara-health.json
          expected_version=$(node -p "require('./agonara/package.json').version")
          grep "\"version\":\"$expected_version\"" /tmp/agonara-health.json
          curl -fsS -X POST http://127.0.0.1:18080/identity/bootstrap/admin -H 'content-type: application/json' --data '{"bootstrapSecret":"ci-bootstrap-secret","displayName":"CI Admin","login":"ci-admin@example.test","password":"correct horse battery staple"}' > /tmp/agonara-bootstrap.json
          grep '"status":"accepted"' /tmp/agonara-bootstrap.json
          grep '"isAdmin":true' /tmp/agonara-bootstrap.json
          curl -fsS http://127.0.0.1:18080/identity/bootstrap/status > /tmp/agonara-bootstrap-status.json
          grep '"available":false' /tmp/agonara-bootstrap-status.json
          curl -fsS http://127.0.0.1:18080/admin > /tmp/agonara-admin.html
          grep 'id="admin-app"' /tmp/agonara-admin.html
          docker logs "$cid" | grep '"operation":"GET /operations/health"'
