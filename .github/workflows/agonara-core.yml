name: Agonara Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: ./scripts/run_silent.sh "build" npx tsc --noEmit

      - name: Run tests
        run: ./scripts/run_silent.sh "agonara-tests" npm test --workspace agonara

      - name: Build Docker image
        run: docker build -t agonara:ci agonara

      - name: Smoke container start
        run: |
          cid=$(docker run --rm -d agonara:ci)
          trap 'docker rm -f "$cid"' EXIT
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = "true"
          docker logs "$cid"
