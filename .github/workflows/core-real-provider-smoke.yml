name: Core Real Provider Smoke

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string
      llm_model:
        description: "LLM model ID used for both NORMALIZER_MODEL and OUTLOOK_MODEL."
        required: true
        type: string
      llm_timeout_ms:
        description: "Timeout for real-provider smoke calls."
        required: false
        default: "180000"
        type: string
    secrets:
      LLM_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  real-provider-smoke:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Run real-provider smoke
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NORMALIZER_MODEL: ${{ inputs.llm_model }}
          LLM_TIMEOUT_MS: ${{ inputs.llm_timeout_ms }}
          OUTLOOK_MODEL: ${{ inputs.llm_model }}
          RUN_REAL_PROVIDER_SMOKE: "1"
        run: ./scripts/run_silent.sh "real-provider-smoke" node --test oracle/apps/am-i-done-web/tests/web-real-provider-smoke.test.js
