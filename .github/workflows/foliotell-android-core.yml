name: FolioTell Android Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use the runner's Android SDK
        run: echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"

      - name: Run core tests
        run: ./gradlew :core:test
        working-directory: foliotell/android

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: foliotell/android
