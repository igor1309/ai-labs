name: FolioTell Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Build
        run: swift build
        working-directory: foliotell/ios

      - name: Run tests
        run: swift test
        working-directory: foliotell/ios

      - name: Verify iOS archive wrapper
        run: |
          xcodebuild archive \
            -project FolioTell.xcodeproj \
            -scheme FolioTell \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/FolioTell.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=VRVJ9YNRQU \
            PRODUCT_BUNDLE_IDENTIFIER=foliotell.FolioTell
        working-directory: foliotell/ios
