name: FolioTell Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Build
        run: swift build
        working-directory: foliotell

      - name: Run tests
        run: swift test
        working-directory: foliotell
