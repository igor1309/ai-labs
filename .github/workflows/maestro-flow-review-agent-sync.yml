name: Sync maestro-flow-review-agent to OpenClaw VPS

on:
  push:
    branches:
      - trunk
    paths:
      - 'agents/maestro-flow-review-agent/agent/**'
  workflow_dispatch:

concurrency:
  group: maestro-flow-review-agent-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage workspace bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/workspace-maestro-review
          rsync -a --delete agents/maestro-flow-review-agent/agent/ /tmp/workspace-maestro-review/
          # OpenClaw loads AGENTS.md from the workspace root as the system prompt.
          mv /tmp/workspace-maestro-review/agent.md /tmp/workspace-maestro-review/AGENTS.md

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OPENCLAW_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 107.172.143.196 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to VPS workspace
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            /tmp/workspace-maestro-review/ \
            openclaw@107.172.143.196:/home/openclaw/.openclaw/workspace-maestro-review/

      - name: Verify sync
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes openclaw@107.172.143.196 \
            "ls -la /home/openclaw/.openclaw/workspace-maestro-review/AGENTS.md"
