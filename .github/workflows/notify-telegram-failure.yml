name: Notify Telegram Failure

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string
      title:
        description: "Prefix used in the notification title, e.g. CI / Release."
        required: true
        type: string
      ref_label:
        description: "Label for the ref line, e.g. branch / tag."
        required: true
        type: string
      ref_value:
        description: "Value for the ref line, e.g. trunk / v1.2.3."
        required: true
        type: string
      job_results:
        description: "Newline-separated list of job=result pairs."
        required: true
        type: string
    secrets:
      CI_BOT_TOKEN:
        required: true
      CI_CHAT_ID:
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Send Telegram notification
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
          JOB_RESULTS: ${{ inputs.job_results }}
          REF_LABEL: ${{ inputs.ref_label }}
          REF_VALUE: ${{ inputs.ref_value }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ inputs.title }}
        run: |
          failed_jobs=""
          while IFS= read -r entry; do
            [ -z "${entry}" ] && continue
            job="${entry%%=*}"
            result="${entry#*=}"
            if [ "${result}" = "failure" ]; then
              [ -n "${failed_jobs}" ] && failed_jobs="${failed_jobs}, "
              failed_jobs="${failed_jobs}${job}"
            fi
          done <<< "${JOB_RESULTS}"

          commit="$(git rev-parse HEAD)"
          text="$(printf "❌ %s failed: %s\nrepo: %s\n%s: %s\ncommit: %s\nrun: %s" "${TITLE}" "${failed_jobs}" "${REPO}" "${REF_LABEL}" "${REF_VALUE}" "${commit}" "${RUN_URL}")"
          ./scripts/ci/notify_telegram_failure.sh "${text}"
