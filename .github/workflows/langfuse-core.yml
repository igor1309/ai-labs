name: Langfuse Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Create Python 3.12 virtual environment
        run: |
          venv="$(mktemp -d "$RUNNER_TEMP/python-venv.XXXXXX")"
          python3.12 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: python -m pip install --quiet pytest pyyaml

      - name: Run tests
        run: python -m pytest -q tests/test_langfuse_shared_stack.py
