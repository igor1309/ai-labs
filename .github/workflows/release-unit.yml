name: Release Unit

# Per-unit release workflow (ADR-000 through ADR-006).
# Triggers on tags matching <basename>_v<version>.
# Determines which unit is being released, validates invariants,
# runs tests, and dispatches to unit-specific deployment.

on:
  push:
    tags:
      - "*_v*"

permissions:
  contents: read

concurrency:
  group: release-unit-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      basename: ${{ steps.parse.outputs.basename }}
      version: ${{ steps.parse.outputs.version }}
      docker: ${{ steps.parse.outputs.docker }}
      unit_path: ${{ steps.parse.outputs.unit_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Parse tag and validate against manifest
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # verify-tag.js parses the tag safely (no shell→JS interpolation),
          # validates against the manifest, and outputs key=value lines.
          node scripts/release/verify-tag.js "$TAG" | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on trunk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin
          git fetch origin trunk:refs/remotes/origin/trunk
          tag_sha="$(git rev-list -n1 "${TAG}")"
          git merge-base --is-ancestor "${tag_sha}" "origin/trunk"

      - name: Validate manifest invariants
        run: node scripts/release/validate-manifest.js

  core:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: ./scripts/run_silent.sh "build" npx tsc --noEmit

      - name: Run tests
        run: ./scripts/run_silent.sh "tests" npm test

  deploy-nomos:
    if: ${{ needs.verify.outputs.basename == 'nomos' }}
    needs: [core, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Copy source files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "nomos/Dockerfile,nomos/package.json,nomos/package-lock.json,nomos/src"
          target: /tmp/nomos-deploy
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/nomos
            cp /tmp/nomos-deploy/Dockerfile .
            cp /tmp/nomos-deploy/package.json .
            cp /tmp/nomos-deploy/package-lock.json .
            rm -rf src && cp -r /tmp/nomos-deploy/src .
            rm -rf /tmp/nomos-deploy
            docker build -t nomos:latest .
            docker compose down
            docker compose up -d
            sleep 5
            docker exec nomos wget -qO- http://127.0.0.1:8080/health | grep -q '"ok"'
            echo "Deploy successful"

      - name: Verify version
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: EXPECTED_VERSION
          script: |
            set -e
            HEALTH=$(docker exec nomos wget -qO- http://127.0.0.1:8080/health)
            echo "Health response: $HEALTH"
            echo "$HEALTH" | grep -q "\"version\":\"${EXPECTED_VERSION}\""
            echo "Version verified: ${EXPECTED_VERSION}"

      - name: Smoke test (real LLM call)
        env:
          NOMOS_SMOKE_TOKEN: ${{ secrets.NOMOS_SMOKE_TOKEN }}
          OPENROUTER_CI_MODEL: ${{ vars.OPENROUTER_CI_MODEL }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NOMOS_SMOKE_TOKEN,OPENROUTER_CI_MODEL
          script: |
            set -e
            RESPONSE=$(curl -s --max-time 60 -w "\n%{http_code}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${NOMOS_SMOKE_TOKEN}" \
              -d "{\"model\":\"${OPENROUTER_CI_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" \
              https://nomos.enoa.ai/v1/chat/completions)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "HTTP status: $HTTP_CODE"
            echo "Response body length: $(echo "$BODY" | wc -c)"
            [ "$HTTP_CODE" = "200" ] || { echo "Smoke test failed: expected 200, got $HTTP_CODE"; exit 1; }
            echo "Smoke test passed"

  github-release:
    needs: [core, verify, deploy-nomos]
    if: ${{ always() && !cancelled() && needs.core.result == 'success' && (needs.deploy-nomos.result == 'success' || needs.deploy-nomos.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: "${{ needs.verify.outputs.basename }} v${{ needs.verify.outputs.version }}"
          body: "Release of **${{ needs.verify.outputs.basename }}** version `${{ needs.verify.outputs.version }}`."
          generateReleaseNotes: false
          draft: false
          prerelease: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    if: ${{ always() && !cancelled() && (needs.verify.result == 'failure' || needs.core.result == 'failure' || needs.deploy-nomos.result == 'failure' || needs.github-release.result == 'failure') }}
    needs: [verify, core, deploy-nomos, github-release]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "Release Unit"
      ref_label: "tag"
      ref_value: ${{ github.ref_name }}
      job_results: |
        verify=${{ needs.verify.result }}
        core=${{ needs.core.result }}
        deploy-nomos=${{ needs.deploy-nomos.result }}
        github-release=${{ needs.github-release.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
