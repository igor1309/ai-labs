name: Release Unit

# Per-unit release workflow (ADR-000 through ADR-006).
# Triggers on tags matching <basename>_v<version>.
# Determines which unit is being released, validates invariants,
# runs tests, and dispatches to unit-specific deployment.

on:
  push:
    tags:
      - "*_v*"

permissions:
  contents: read

concurrency:
  group: release-unit-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      basename: ${{ steps.parse.outputs.basename }}
      version: ${{ steps.parse.outputs.version }}
      docker: ${{ steps.parse.outputs.docker }}
      unit_path: ${{ steps.parse.outputs.unit_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Parse tag and validate against manifest
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # pipefail: without it the step's exit code is tee's, and a
          # verify-tag.js rejection silently yields empty outputs downstream.
          set -o pipefail
          # verify-tag.js parses the tag safely (no shell→JS interpolation),
          # validates against the manifest, and outputs key=value lines.
          node scripts/release/verify-tag.js "$TAG" | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on trunk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin
          git fetch origin trunk:refs/remotes/origin/trunk
          tag_sha="$(git rev-list -n1 "${TAG}")"
          git merge-base --is-ancestor "${tag_sha}" "origin/trunk"

      - name: Validate manifest invariants
        run: node scripts/release/validate-manifest.js

      - name: Validate FolioTell release notes
        if: ${{ steps.parse.outputs.basename == 'foliotell' }}
        run: node scripts/release/validate-foliotell-release-notes.js

  core:
    if: ${{ needs.verify.outputs.basename != 'foliotell' && needs.verify.outputs.basename != 'notio-backend' && needs.verify.outputs.basename != 'notio-frontend' && needs.verify.outputs.basename != 'rexlab' }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install ripgrep
        # Required by corpus-scout tests
        run: sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: ./scripts/run_silent.sh "build" npx tsc --noEmit

      - name: Run tests
        run: ./scripts/run_silent.sh "tests" npm test

  test-notio-backend:
    if: ${{ needs.verify.outputs.basename == 'notio-backend' }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Run tests
        working-directory: notio/backend
        run: swift test

  test-foliotell:
    if: ${{ needs.verify.outputs.basename == 'foliotell' }}
    needs: [verify]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)/Contents/Developer"

      - name: Build package
        run: swift build
        working-directory: foliotell/ios

      - name: Run package tests
        run: swift test
        working-directory: foliotell/ios

      - name: Verify unsigned iOS archive
        run: |
          xcodebuild archive \
            -project FolioTell.xcodeproj \
            -scheme FolioTell \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/FolioTell.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=VRVJ9YNRQU \
            PRODUCT_BUNDLE_IDENTIFIER=foliotell.FolioTell
        working-directory: foliotell/ios

  deploy-nomos-staging:
    if: ${{ needs.verify.outputs.basename == 'nomos' }}
    needs: [core, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Copy source files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NOMOS_VPS_HOST }}
          username: ${{ secrets.NOMOS_VPS_USER }}
          key: ${{ secrets.NOMOS_VPS_SSH_KEY }}
          source: "nomos/Dockerfile,nomos/package.json,nomos/package-lock.json,nomos/src,nomos/docker-compose.staging.yml,nomos/scripts,vendor/ci-shared/scripts/notify_telegram.sh"
          target: /tmp/nomos-deploy
          strip_components: 1

      - name: Deploy staging on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NOMOS_VPS_HOST }}
          username: ${{ secrets.NOMOS_VPS_USER }}
          key: ${{ secrets.NOMOS_VPS_SSH_KEY }}
          script: bash /tmp/nomos-deploy/scripts/deploy-staging.sh

      - name: Verify staging version
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.NOMOS_VPS_HOST }}
          username: ${{ secrets.NOMOS_VPS_USER }}
          key: ${{ secrets.NOMOS_VPS_SSH_KEY }}
          envs: EXPECTED_VERSION
          script: |
            set -e
            HEALTH=$(docker exec nomos-staging wget -qO- http://127.0.0.1:8081/health)
            echo "Health response: $HEALTH"
            echo "$HEALTH" | grep -q "\"version\":\"${EXPECTED_VERSION}\""
            echo "Staging version verified: ${EXPECTED_VERSION}"

      - name: Staging smoke test (real LLM call)
        env:
          NOMOS_STAGING_SMOKE_TOKEN: ${{ secrets.NOMOS_STAGING_SMOKE_TOKEN }}
          OPENROUTER_CI_MODEL: ${{ vars.OPENROUTER_CI_MODEL }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NOMOS_VPS_HOST }}
          username: ${{ secrets.NOMOS_VPS_USER }}
          key: ${{ secrets.NOMOS_VPS_SSH_KEY }}
          envs: NOMOS_STAGING_SMOKE_TOKEN,OPENROUTER_CI_MODEL
          script: |
            set -e
            RESPONSE=$(curl -s --max-time 60 -w "\n%{http_code}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${NOMOS_STAGING_SMOKE_TOKEN}" \
              -d "{\"model\":\"${OPENROUTER_CI_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" \
              https://staging.nomos.enoa.ai/v1/chat/completions)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP status: $HTTP_CODE"
            echo "Response body length: $(echo "$BODY" | wc -c)"
            [ "$HTTP_CODE" = "200" ] || { echo "Staging smoke test failed: expected 200, got $HTTP_CODE"; exit 1; }
            echo "Staging smoke test passed"

  deploy-nomos-prod:
    if: ${{ needs.verify.outputs.basename == 'nomos' }}
    needs: [deploy-nomos-staging, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy production on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NOMOS_VPS_HOST }}
          username: ${{ secrets.NOMOS_VPS_USER }}
          key: ${{ secrets.NOMOS_VPS_SSH_KEY }}
          script: bash /tmp/nomos-deploy/scripts/deploy-prod.sh

      - name: Verify production version
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.NOMOS_VPS_HOST }}
          username: ${{ secrets.NOMOS_VPS_USER }}
          key: ${{ secrets.NOMOS_VPS_SSH_KEY }}
          envs: EXPECTED_VERSION
          script: |
            set -e
            HEALTH=$(docker exec nomos wget -qO- http://127.0.0.1:8080/health)
            echo "Health response: $HEALTH"
            echo "$HEALTH" | grep -q "\"version\":\"${EXPECTED_VERSION}\""
            echo "Production version verified: ${EXPECTED_VERSION}"

      - name: Production smoke test (real LLM call)
        env:
          NOMOS_SMOKE_TOKEN: ${{ secrets.NOMOS_SMOKE_TOKEN }}
          OPENROUTER_CI_MODEL: ${{ vars.OPENROUTER_CI_MODEL }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NOMOS_VPS_HOST }}
          username: ${{ secrets.NOMOS_VPS_USER }}
          key: ${{ secrets.NOMOS_VPS_SSH_KEY }}
          envs: NOMOS_SMOKE_TOKEN,OPENROUTER_CI_MODEL
          script: |
            set -e
            RESPONSE=$(curl -s --max-time 60 -w "\n%{http_code}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${NOMOS_SMOKE_TOKEN}" \
              -d "{\"model\":\"${OPENROUTER_CI_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" \
              https://nomos.enoa.ai/v1/chat/completions)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP status: $HTTP_CODE"
            echo "Response body length: $(echo "$BODY" | wc -c)"
            [ "$HTTP_CODE" = "200" ] || { echo "Production smoke test failed: expected 200, got $HTTP_CODE"; exit 1; }
            echo "$BODY" > /tmp/nomos-smoke-body.json
            echo "Production smoke test passed"

      - name: Notify deploy success
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          OPENROUTER_CI_MODEL: ${{ vars.OPENROUTER_CI_MODEL }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NOMOS_VPS_HOST }}
          username: ${{ secrets.NOMOS_VPS_USER }}
          key: ${{ secrets.NOMOS_VPS_SSH_KEY }}
          envs: CI_BOT_TOKEN,CI_CHAT_ID,EXPECTED_VERSION,OPENROUTER_CI_MODEL
          script: |
            set -e
            CONTENT=$(python3 -c "import sys,json; print(json.load(sys.stdin)['choices'][0]['message']['content'])" < /tmp/nomos-smoke-body.json 2>/dev/null || echo "(could not parse)")
            CONTENT=$(echo "$CONTENT" | cut -c1-200)
            TEXT=$(printf "✅ nomos v%s deployed\nstaging: passed\nproduction: passed\n%s → %s" "$EXPECTED_VERSION" "$OPENROUTER_CI_MODEL" "$CONTENT")
            bash /tmp/nomos-deploy/ci-shared/scripts/notify_telegram.sh "$CI_BOT_TOKEN" "$CI_CHAT_ID" "$TEXT"
            rm -f /tmp/nomos-smoke-body.json
            rm -rf /tmp/nomos-deploy

      - name: Rollback production on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NOMOS_VPS_HOST }}
          username: ${{ secrets.NOMOS_VPS_USER }}
          key: ${{ secrets.NOMOS_VPS_SSH_KEY }}
          script: bash /opt/nomos/scripts/rollback-prod.sh

  deploy-agonara-staging:
    if: ${{ needs.verify.outputs.basename == 'agonara' }}
    needs: [core, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Verify Agonara deploy secrets
        env:
          AGONARA_VPS_HOST: ${{ secrets.AGONARA_VPS_HOST }}
          AGONARA_VPS_USER: ${{ secrets.AGONARA_VPS_USER }}
          AGONARA_VPS_SSH_KEY: ${{ secrets.AGONARA_VPS_SSH_KEY }}
        run: |
          set -e
          missing=0
          for name in AGONARA_VPS_HOST AGONARA_VPS_USER AGONARA_VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for Agonara release deploy"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Prepare clean Agonara deploy upload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          script: |
            set -e
            rm -rf /tmp/agonara-deploy
            mkdir -p /tmp/agonara-deploy

      - name: Copy source files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          source: "agonara/.dockerignore,agonara/Dockerfile,agonara/package.json,agonara/package-lock.json,agonara/src,agonara/compose.staging.yml,agonara/compose.prod.yml,agonara/scripts"
          target: /tmp/agonara-deploy
          strip_components: 1

      - name: Deploy staging on VPS
        uses: appleboy/ssh-action@v1
        env:
          AGONARA_DEPLOY_VERSION: ${{ needs.verify.outputs.version }}
          AGONARA_GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          command_timeout: 20m
          envs: AGONARA_DEPLOY_VERSION,AGONARA_GIT_SHA
          script: bash /tmp/agonara-deploy/scripts/deploy-staging.sh

      - name: Verify staging version
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          envs: EXPECTED_VERSION
          script: |
            set -e
            docker exec -e EXPECTED_VERSION="${EXPECTED_VERSION}" agonara-staging node -e 'fetch("http://127.0.0.1:8080/operations/health").then(response => { if (!response.ok) process.exit(1); return response.json(); }).then(health => { if (health.status !== "ok" || health.version !== process.env.EXPECTED_VERSION) process.exit(1); }).catch(() => process.exit(1))'
            echo "Staging version verified: ${EXPECTED_VERSION}"

      - name: Staging real evaluator smoke
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          command_timeout: 5m
          envs: EXPECTED_VERSION
          script: |
            set -e
            docker exec -e AGONARA_SMOKE_BASE_URL=http://127.0.0.1:8080 -e EXPECTED_VERSION="${EXPECTED_VERSION}" agonara-staging sh -lc "trap 'rm -f /tmp/agonara-smoke.json' EXIT; node scripts/smoke-open-answer-evaluator.mjs > /tmp/agonara-smoke.json && node -e 'const fs = require(\"node:fs\"); const result = JSON.parse(fs.readFileSync(\"/tmp/agonara-smoke.json\", \"utf8\")); if (!result.evaluationId || result.healthVersion !== process.env.EXPECTED_VERSION) process.exit(1);'"
            echo "Staging real evaluator smoke passed"

      - name: Clean deploy upload after staging failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          script: rm -rf /tmp/agonara-deploy || true

  deploy-agonara-prod:
    if: ${{ needs.verify.outputs.basename == 'agonara' }}
    needs: [deploy-agonara-staging, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy production on VPS
        uses: appleboy/ssh-action@v1
        env:
          AGONARA_DEPLOY_VERSION: ${{ needs.verify.outputs.version }}
          AGONARA_GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          command_timeout: 20m
          envs: AGONARA_DEPLOY_VERSION,AGONARA_GIT_SHA
          script: bash /tmp/agonara-deploy/scripts/deploy-prod.sh

      - name: Verify production version
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          envs: EXPECTED_VERSION
          script: |
            set -e
            docker exec -e EXPECTED_VERSION="${EXPECTED_VERSION}" agonara node -e 'fetch("http://127.0.0.1:8080/operations/health").then(response => { if (!response.ok) process.exit(1); return response.json(); }).then(health => { if (health.status !== "ok" || health.version !== process.env.EXPECTED_VERSION) process.exit(1); }).catch(() => process.exit(1))'
            echo "Production version verified: ${EXPECTED_VERSION}"

      - name: Production real evaluator smoke
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          command_timeout: 5m
          envs: EXPECTED_VERSION
          script: |
            set -e
            docker exec -e AGONARA_SMOKE_BASE_URL=http://127.0.0.1:8080 -e EXPECTED_VERSION="${EXPECTED_VERSION}" agonara sh -lc "trap 'rm -f /tmp/agonara-smoke.json' EXIT; node scripts/smoke-open-answer-evaluator.mjs > /tmp/agonara-smoke.json && node -e 'const fs = require(\"node:fs\"); const result = JSON.parse(fs.readFileSync(\"/tmp/agonara-smoke.json\", \"utf8\")); if (!result.evaluationId || result.healthVersion !== process.env.EXPECTED_VERSION) process.exit(1);'"
            echo "Production real evaluator smoke passed"

      - name: Production public route smoke
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          command_timeout: 2m
          envs: EXPECTED_VERSION
          script: |
            set -e
            docker exec -e AGONARA_PUBLIC_SMOKE_BASE_URL=https://agonara.enoa.ai -e EXPECTED_VERSION="${EXPECTED_VERSION}" agonara node scripts/smoke-public-prod-routes.mjs
            echo "Production public route smoke passed"

      - name: Rollback production on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          command_timeout: 10m
          script: bash /opt/agonara/scripts/rollback-prod.sh

      - name: Clean deploy upload
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AGONARA_VPS_HOST }}
          username: ${{ secrets.AGONARA_VPS_USER }}
          key: ${{ secrets.AGONARA_VPS_SSH_KEY }}
          script: rm -rf /tmp/agonara-deploy || true

  deploy-notio-backend:
    if: ${{ needs.verify.outputs.basename == 'notio-backend' }}
    needs: [test-notio-backend, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Copy backend source files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NOTIO_VPS_HOST }}
          username: ${{ secrets.NOTIO_VPS_USER }}
          key: ${{ secrets.NOTIO_VPS_SSH_KEY }}
          source: "notio/backend/.dockerignore,notio/backend/Dockerfile,notio/backend/Package.swift,notio/backend/Package.resolved,notio/backend/Sources,notio/backend/Tests,notio/backend/docker-compose.yml,notio/backend/scripts"
          target: /tmp/notio-deploy
          strip_components: 2

      - name: Copy shared notify script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NOTIO_VPS_HOST }}
          username: ${{ secrets.NOTIO_VPS_USER }}
          key: ${{ secrets.NOTIO_VPS_SSH_KEY }}
          source: "vendor/ci-shared/scripts/notify_telegram.sh"
          target: /tmp/notio-deploy
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        env:
          NOTIO_GIT_SHA: ${{ github.sha }}
          NOTIO_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.NOTIO_VPS_HOST }}
          username: ${{ secrets.NOTIO_VPS_USER }}
          key: ${{ secrets.NOTIO_VPS_SSH_KEY }}
          envs: NOTIO_VERSION,NOTIO_GIT_SHA
          command_timeout: 15m
          script: bash /tmp/notio-deploy/scripts/deploy.sh

      - name: Verify deployed version
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        with:
          host: ${{ secrets.NOTIO_VPS_HOST }}
          username: ${{ secrets.NOTIO_VPS_USER }}
          key: ${{ secrets.NOTIO_VPS_SSH_KEY }}
          envs: EXPECTED_VERSION
          script: |
            set -e
            RESPONSE=$(curl -fsS http://127.0.0.1:8080/version)
            echo "Version response: $RESPONSE"
            echo "$RESPONSE" | grep -q "\"version\":\"${EXPECTED_VERSION}\""
            echo "Version verified: ${EXPECTED_VERSION}"

      - name: Notify deploy success
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NOTIO_VPS_HOST }}
          username: ${{ secrets.NOTIO_VPS_USER }}
          key: ${{ secrets.NOTIO_VPS_SSH_KEY }}
          envs: CI_BOT_TOKEN,CI_CHAT_ID,EXPECTED_VERSION
          script: |
            set -e
            TEXT=$(printf "✅ notio-backend v%s deployed\nversion verified" "$EXPECTED_VERSION")
            bash /tmp/notio-deploy/ci-shared/scripts/notify_telegram.sh "$CI_BOT_TOKEN" "$CI_CHAT_ID" "$TEXT"
            rm -rf /tmp/notio-deploy

  deploy-notio-frontend:
    if: ${{ needs.verify.outputs.basename == 'notio-frontend' }}
    needs: [verify]
    uses: ./.github/workflows/notio-frontend-deploy.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit

  deploy-rexlab:
    if: ${{ needs.verify.outputs.basename == 'rexlab' }}
    needs: [verify]
    uses: ./.github/workflows/rexlab-deploy.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit

  deploy-clipdeck:
    if: ${{ needs.verify.outputs.basename == 'clipdeck' }}
    needs: [core, verify]
    uses: ./.github/workflows/clipdeck-deploy.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit

  deploy-foliotell-testflight:
    if: ${{ needs.verify.outputs.basename == 'foliotell' }}
    needs: [test-foliotell, verify]
    runs-on: macos-latest
    environment: testflight
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      # macos-latest images differ in default Xcode (16.4 vs 26.5), which changes
      # both the SDK the shipped app is built against and the altool generation.
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)/Contents/Developer"

      - name: Verify FolioTell TestFlight secrets
        env:
          FOLIOTELL_ASC_API_KEY_ID: ${{ secrets.FOLIOTELL_ASC_API_KEY_ID }}
          FOLIOTELL_ASC_API_ISSUER_ID: ${{ secrets.FOLIOTELL_ASC_API_ISSUER_ID }}
          FOLIOTELL_ASC_API_PRIVATE_KEY: ${{ secrets.FOLIOTELL_ASC_API_PRIVATE_KEY }}
        run: |
          set -e
          missing=0
          for name in FOLIOTELL_ASC_API_KEY_ID FOLIOTELL_ASC_API_ISSUER_ID FOLIOTELL_ASC_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for FolioTell TestFlight release"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Write App Store Connect API key
        env:
          FOLIOTELL_ASC_API_KEY_ID: ${{ secrets.FOLIOTELL_ASC_API_KEY_ID }}
          FOLIOTELL_ASC_API_PRIVATE_KEY: ${{ secrets.FOLIOTELL_ASC_API_PRIVATE_KEY }}
        run: |
          set -e
          key_path="$RUNNER_TEMP/AuthKey_${FOLIOTELL_ASC_API_KEY_ID}.p8"
          printf '%s' "$FOLIOTELL_ASC_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "FOLIOTELL_ASC_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          FOLIOTELL_ASC_API_KEY_ID: ${{ secrets.FOLIOTELL_ASC_API_KEY_ID }}
          FOLIOTELL_ASC_API_ISSUER_ID: ${{ secrets.FOLIOTELL_ASC_API_ISSUER_ID }}
          FOLIOTELL_BUILD_NUMBER: ${{ github.run_number }}
          FOLIOTELL_PROVIDER_ID: VRVJ9YNRQU
          FOLIOTELL_TEAM_ID: VRVJ9YNRQU
          FOLIOTELL_VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/distribute-testflight.sh --upload
        working-directory: foliotell/ios

  github-release:
    needs: [core, verify, test-notio-backend, test-foliotell, deploy-nomos-staging, deploy-nomos-prod, deploy-agonara-staging, deploy-agonara-prod, deploy-notio-backend, deploy-notio-frontend, deploy-rexlab, deploy-clipdeck, deploy-foliotell-testflight]
    if: >-
      ${{ always() && !cancelled()
      && needs.verify.result == 'success'
      && (needs.core.result == 'success' || needs.core.result == 'skipped')
      && (needs.test-notio-backend.result == 'success' || needs.test-notio-backend.result == 'skipped')
      && (needs.test-foliotell.result == 'success' || needs.test-foliotell.result == 'skipped')
      && needs.deploy-nomos-staging.result != 'failure'
      && needs.deploy-nomos-prod.result != 'failure'
      && (needs.verify.outputs.basename != 'agonara' || needs.deploy-agonara-staging.result == 'success')
      && (needs.verify.outputs.basename != 'agonara' || needs.deploy-agonara-prod.result == 'success')
      && (needs.verify.outputs.basename != 'foliotell' || needs.deploy-foliotell-testflight.result == 'success')
      && (needs.deploy-agonara-staging.result == 'success' || needs.deploy-agonara-staging.result == 'skipped')
      && (needs.deploy-agonara-prod.result == 'success' || needs.deploy-agonara-prod.result == 'skipped')
      && (needs.deploy-notio-backend.result == 'success' || needs.deploy-notio-backend.result == 'skipped')
      && (needs.deploy-notio-frontend.result == 'success' || needs.deploy-notio-frontend.result == 'skipped')
      && (needs.verify.outputs.basename != 'rexlab' || needs.deploy-rexlab.result == 'success')
      && (needs.deploy-rexlab.result == 'success' || needs.deploy-rexlab.result == 'skipped')
      && (needs.deploy-clipdeck.result == 'success' || needs.deploy-clipdeck.result == 'skipped')
      && (needs.deploy-foliotell-testflight.result == 'success' || needs.deploy-foliotell-testflight.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout release contents
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Prepare release body
        env:
          RELEASE_BASENAME: ${{ needs.verify.outputs.basename }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ "$RELEASE_BASENAME" = "foliotell" ]; then
            release_notes="foliotell/ios/docs/releases/${RELEASE_VERSION}.md"
            release_body="$RUNNER_TEMP/release-body.md"
            awk 'NR == 1 && $0 == "---" { in_front_matter = 1; next } in_front_matter && $0 == "---" { in_front_matter = 0; next } !in_front_matter { print }' "$release_notes" > "$release_body"
          else
            release_body="$RUNNER_TEMP/release-body.md"
            printf 'Release of **%s** version `%s`.\n' "$RELEASE_BASENAME" "$RELEASE_VERSION" > "$release_body"
          fi
          echo "RELEASE_BODY_FILE=$release_body" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: "${{ needs.verify.outputs.basename }} v${{ needs.verify.outputs.version }}"
          bodyFile: ${{ env.RELEASE_BODY_FILE }}
          generateReleaseNotes: false
          draft: false
          prerelease: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    if: >-
      ${{ always() && !cancelled()
      && (needs.verify.result == 'failure'
      || needs.core.result == 'failure'
      || needs.test-notio-backend.result == 'failure'
      || needs.test-foliotell.result == 'failure'
      || needs.deploy-nomos-staging.result == 'failure'
      || needs.deploy-nomos-prod.result == 'failure'
      || needs.deploy-agonara-staging.result == 'failure'
      || needs.deploy-agonara-prod.result == 'failure'
      || needs.deploy-notio-backend.result == 'failure'
      || needs.deploy-notio-frontend.result == 'failure'
      || needs.deploy-rexlab.result == 'failure'
      || needs.deploy-clipdeck.result == 'failure'
      || needs.deploy-foliotell-testflight.result == 'failure'
      || needs.github-release.result == 'failure')
      }}
    needs: [verify, core, test-notio-backend, test-foliotell, deploy-nomos-staging, deploy-nomos-prod, deploy-agonara-staging, deploy-agonara-prod, deploy-notio-backend, deploy-notio-frontend, deploy-rexlab, deploy-clipdeck, deploy-foliotell-testflight, github-release]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "Release Unit"
      ref_label: "tag"
      ref_value: ${{ github.ref_name }}
      job_results: |
        verify=${{ needs.verify.result }}
        core=${{ needs.core.result }}
        test-notio-backend=${{ needs.test-notio-backend.result }}
        test-foliotell=${{ needs.test-foliotell.result }}
        deploy-nomos-staging=${{ needs.deploy-nomos-staging.result }}
        deploy-nomos-prod=${{ needs.deploy-nomos-prod.result }}
        deploy-agonara-staging=${{ needs.deploy-agonara-staging.result }}
        deploy-agonara-prod=${{ needs.deploy-agonara-prod.result }}
        deploy-notio-backend=${{ needs.deploy-notio-backend.result }}
        deploy-notio-frontend=${{ needs.deploy-notio-frontend.result }}
        deploy-rexlab=${{ needs.deploy-rexlab.result }}
        deploy-clipdeck=${{ needs.deploy-clipdeck.result }}
        deploy-foliotell-testflight=${{ needs.deploy-foliotell-testflight.result }}
        github-release=${{ needs.github-release.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
