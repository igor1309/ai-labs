name: Audelin Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Swift 6 and Swift Testing: take the image's newest Xcode, as
      # foliotell-core does.
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)/Contents/Developer"

      - name: Run tests
        working-directory: audelin/macos
        run: swift test

      # ADR-001 invariants 1-6, and the checker's own tests.
      - name: Check module rules
        working-directory: audelin/macos
        run: |
          python3 scripts/check_modules_test.py
          python3 scripts/check-modules.py

      - name: Build the app bundle
        working-directory: audelin/macos
        run: sh scripts/bundle.sh
