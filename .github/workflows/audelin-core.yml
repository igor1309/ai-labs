name: Audelin Core

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Collect fresh-build compiler statistics in a supplemental job.
        type: boolean
        default: true
  workflow_call:
    inputs:
      profile:
        description: Collect fresh-build compiler statistics in a supplemental job.
        type: boolean
        default: false
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Supplemental measurement only: normal callers still run every check below.
  # No build cache is restored, so this measures fresh compilation rather than
  # timestamp or cache reuse. Compiler statistics include per-module frontend
  # and optimization timers; summed job times are not pipeline wall time.
  profile:
    if: inputs.profile
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      STATS: ${{ github.workspace }}/build-profile/statistics
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)/Contents/Developer"
      - name: Record machine and compiler
        run: |
          mkdir -p "$STATS/debug" "$STATS/release"
          {
            git rev-parse HEAD
            swift --version
            sw_vers
            sysctl hw.ncpu hw.memsize
          } | tee build-profile/environment.txt
      - name: Resolve dependencies separately
        working-directory: audelin/macos
        run: |
          swift package resolve
          swift package --package-path App --scratch-path "$PWD/.build" resolve
          swift package --package-path PreviewApps --scratch-path "$PWD/.build" resolve
      - name: Profile fresh core test build
        working-directory: audelin/macos
        run: |
          set -o pipefail
          /usr/bin/time -lp swift build --build-tests -Xswiftc -O \
            -Xswiftc -stats-output-dir -Xswiftc "$STATS/debug" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-profile/core.log"
      - name: Profile app test build
        working-directory: audelin/macos/App
        run: |
          set -o pipefail
          /usr/bin/time -lp swift build --build-tests -Xswiftc -O --scratch-path ../.build \
            -Xswiftc -stats-output-dir -Xswiftc "$STATS/debug" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-profile/app.log"
      - name: Profile preview test build
        working-directory: audelin/macos/PreviewApps
        run: |
          set -o pipefail
          /usr/bin/time -lp swift build --build-tests -Xswiftc -O --scratch-path ../.build \
            -Xswiftc -stats-output-dir -Xswiftc "$STATS/debug" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-profile/preview.log"
      # This is a diagnostic compilation, not a replacement for bundling,
      # signing or testing in the core job. Release retains its existing flags.
      - name: Profile fresh release compilation
        working-directory: audelin/macos
        run: |
          set -o pipefail
          /usr/bin/time -lp swift build --package-path App --scratch-path "$PWD/.build" \
            -c release --product Audelin \
            -Xswiftc -stats-output-dir -Xswiftc "$STATS/release" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-profile/release.log"
      - name: Upload compiler statistics and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audelin-fresh-build-profile
          path: build-profile
          if-no-files-found: error

  core:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Test profiling tools
        timeout-minutes: 2
        run: python3 -I -m unittest discover -s audelin/macos/scripts/tests

      # Swift 6 and Swift Testing: take the image's newest Xcode, as
      # foliotell-core does.
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)/Contents/Developer"

      # The recognizer tests download their speech models, which a fresh
      # download has handed over broken. Keep the models a passing run used;
      # the cache saves only when the job succeeds, so a broken download is
      # never kept.
      - name: Cache the speech models
        id: models
        uses: actions/cache@v6
        with:
          path: ~/Library/Application Support/FluidAudio/Models
          key: audelin-models-${{ hashFiles('audelin/macos/Package.resolved') }}

      # All three test packages build in one scratch directory with the same
      # flags, so each module compiles once. The cache keeps FluidAudio, most of
      # the compile: a checkout's new timestamps still rebuild our own sources.
      - name: Key the build cache
        id: build-key
        run: echo "swift=$(swift --version 2>&1 | shasum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: audelin/macos/.build
          key: audelin-build-${{ steps.build-key.outputs.swift }}-${{ hashFiles('audelin/macos/Package.resolved', 'audelin/macos/App/Package.resolved', 'audelin/macos/PreviewApps/Package.resolved') }}

      # Compiling is bounded by the job; the main tests have a three-minute
      # limit that names unfinished tests when exceeded.
      # Optimize the debug configuration to retain testable imports while
      # measuring the same optimized code paths as the app.
      - name: Build tests
        working-directory: audelin/macos
        run: swift build --build-tests -Xswiftc -O

      # Without the cache, the recognizer tests download the models first:
      # that alone can take longer than the tests' limit.
      - name: Fetch the speech models
        if: steps.models.outputs.cache-hit != 'true'
        working-directory: audelin/macos
        run: sh ../scripts/swift-test-bounded.sh 900 -Xswiftc -O --filter ParakeetContractTests

      - name: Run tests
        working-directory: audelin/macos
        run: sh ../scripts/swift-test-bounded.sh 180 -Xswiftc -O

      - name: Build app tests
        working-directory: audelin/macos/App
        run: swift build --build-tests -Xswiftc -O --scratch-path ../.build

      - name: Run app tests
        working-directory: audelin/macos/App
        run: sh ../../scripts/swift-test-bounded.sh 180 -Xswiftc -O --scratch-path ../.build

      - name: Build preview app tests
        working-directory: audelin/macos/PreviewApps
        run: swift build --build-tests -Xswiftc -O --scratch-path ../.build

      - name: Run preview app tests
        working-directory: audelin/macos/PreviewApps
        run: sh ../../scripts/swift-test-bounded.sh 120 -Xswiftc -O --scratch-path ../.build

      - name: Build the app bundle
        working-directory: audelin/macos
        run: AUDELIN_SIGN_IDENTITY=- AUDELIN_SCRATCH_PATH="$PWD/.build" sh scripts/bundle.sh

      # Trunk alone saves, so pull requests do not fill the cache budget.
      - name: Save the build cache
        if: steps.build-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/trunk'
        uses: actions/cache/save@v6
        with:
          path: audelin/macos/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
