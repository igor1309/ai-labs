name: Sync Agonara skills to Hermes

# Auto-deploys the Agonara student-bot skill set to the live Hermes agent on
# every trunk push that touches the skills. ai-labs is the source of truth for
# skill *content*; this workflow is the push side of "each deployment pulls from
# it" (skills/README.md). The folder list is the reviewable manifest
# agonara/skills/hermes-deploy.txt — not a glob — so a student bot never receives
# the curator/admin role buckets it must not co-install.
#
# Host details follow agonara/docs/deployment-discipline.md: the Hermes address,
# user, and target directory are NEVER committed. They come from secrets:
#   HERMES_DEPLOY_SSH_KEY  — private deploy key authorized on the Hermes host
#   HERMES_DEPLOY_HOST     — host/IP of the Hermes VPS
#   HERMES_DEPLOY_USER     — SSH user that owns the Hermes profile
#   HERMES_SKILLS_DIR      — absolute path to the Hermes skills directory
#                            (the dir Hermes auto-discovers SKILL.md folders in)

on:
  push:
    branches:
      - trunk
    paths:
      - 'agonara/skills/**'
      - '.github/workflows/agonara-hermes-skills-sync.yml'
  workflow_dispatch:

concurrency:
  group: agonara-hermes-skills-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage skills bundle from manifest
        run: |
          set -euo pipefail
          manifest="agonara/skills/hermes-deploy.txt"
          staging="/tmp/agonara-hermes-skills"
          rm -rf "$staging"
          mkdir -p "$staging"
          count=0
          while IFS= read -r skill || [ -n "$skill" ]; do
            # Skip blanks and comments.
            case "$skill" in ''|\#*) continue ;; esac
            skill="${skill%%[[:space:]]*}"
            src="agonara/skills/$skill"
            if [ ! -f "$src/SKILL.md" ]; then
              echo "Manifest entry '$skill' has no SKILL.md at $src" >&2
              exit 1
            fi
            rsync -a "$src" "$staging/"
            count=$((count + 1))
          done < "$manifest"
          if [ "$count" -eq 0 ]; then
            echo "Manifest $manifest selected no skills" >&2
            exit 1
          fi
          echo "Staged $count skill folder(s):"
          ls -1 "$staging"

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.HERMES_DEPLOY_SSH_KEY }}
          HERMES_HOST: ${{ secrets.HERMES_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HERMES_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync skills to Hermes
        env:
          HERMES_HOST: ${{ secrets.HERMES_DEPLOY_HOST }}
          HERMES_USER: ${{ secrets.HERMES_DEPLOY_USER }}
          HERMES_SKILLS_DIR: ${{ secrets.HERMES_SKILLS_DIR }}
        run: |
          set -euo pipefail
          # Sync each managed skill folder individually so --delete only prunes
          # stale files INSIDE an Agonara skill folder, never sibling skills the
          # operator maintains directly on the Hermes host.
          for dir in /tmp/agonara-hermes-skills/*/; do
            name="$(basename "$dir")"
            rsync -az --delete \
              -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
              "$dir" \
              "${HERMES_USER}@${HERMES_HOST}:${HERMES_SKILLS_DIR}/${name}/"
          done

      - name: Verify sync
        env:
          HERMES_HOST: ${{ secrets.HERMES_DEPLOY_HOST }}
          HERMES_USER: ${{ secrets.HERMES_DEPLOY_USER }}
          HERMES_SKILLS_DIR: ${{ secrets.HERMES_SKILLS_DIR }}
        run: |
          set -euo pipefail
          while IFS= read -r skill || [ -n "$skill" ]; do
            case "$skill" in ''|\#*) continue ;; esac
            skill="${skill%%[[:space:]]*}"
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
              "${HERMES_USER}@${HERMES_HOST}" \
              "test -f '${HERMES_SKILLS_DIR}/${skill}/SKILL.md'" \
              || { echo "Missing on host: ${skill}/SKILL.md" >&2; exit 1; }
          done < agonara/skills/hermes-deploy.txt
          echo "All manifest skills present on Hermes host."

  notify:
    if: ${{ always() && !cancelled() && needs.sync.result == 'failure' }}
    needs: [sync]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "Agonara Hermes Skills Sync"
      ref_label: "branch"
      ref_value: ${{ github.ref_name }}
      job_results: |
        sync=${{ needs.sync.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
