name: Clipdeck Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: ./scripts/run_silent.sh "clipdeck-typecheck" npm run typecheck --workspace clipdeck

      - name: Run tests
        run: ./scripts/run_silent.sh "clipdeck-tests" npm test --workspace clipdeck
