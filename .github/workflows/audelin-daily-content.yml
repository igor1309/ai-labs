name: Audelin Daily Content

# The Daily template's real-model content check (daily-notes QA S-1 to S-5,
# LAB-1655, LAB-1657). It needs the signed-in Claude CLI and the frozen calls,
# which stay on the self-hosted Mac outside the repository
# (~/Library/Application Support/Audelin Daily Content), so it runs only there:
# from ci.yml when a pull request changes the Daily template, the notes
# generation or the default notes model, and weekly on Sundays at 18:00 UTC
# (21:00 Moscow time), clear of the nightly long runs and ci-weekly.
# The notes are meeting text: they stay on the Mac, only the report is uploaded.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string
  schedule:
    - cron: "0 18 * * 0"   # Sunday 21:00 MSK
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-content:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 40
    concurrency:
      group: audelin-daily-content
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Run the Daily content check
        working-directory: audelin/macos
        env:
          AUDELIN_DAILY_JUDGE: "1"
        run: |
          out="$HOME/Library/Application Support/Audelin Daily Content/runs/$(date -u +%Y-%m-%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "DAILY_OUT=$out" >> "$GITHUB_ENV"
          sh scripts/daily-content-ci.sh --out "$out"

      - name: Summarize
        if: always() && env.DAILY_OUT != ''
        run: cat "$DAILY_OUT/report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the report
        if: always() && env.DAILY_OUT != ''
        uses: actions/upload-artifact@v4
        with:
          name: audelin-daily-content
          path: |
            ${{ env.DAILY_OUT }}/identity.txt
            ${{ env.DAILY_OUT }}/report.md

  notify:
    if: ${{ always() && !cancelled() && github.event_name == 'schedule' && needs.daily-content.result == 'failure' }}
    needs: [daily-content]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "Audelin Daily Content"
      ref_label: "branch"
      ref_value: ${{ github.ref_name }}
      job_results: |
        daily-content=${{ needs.daily-content.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
