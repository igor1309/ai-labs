name: Sync to Public Skills Repository

on:
  push:
    branches:
      - trunk
    paths:
      - 'skills/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev-skills (private source)
        uses: actions/checkout@v4
        with:
          path: dev-skills

      - name: Checkout skills (public target)
        uses: actions/checkout@v4
        with:
          repository: igor1309/skills
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          path: skills-public

      - name: Sync skills folder to public repo
        run: |
          # Remove all content from public repo
          rm -rf skills-public/*
          rm -rf skills-public/.*  2>/dev/null || true

          # Copy entire skills/ folder content to public repo root
          cp -r dev-skills/skills/* skills-public/
          cp -r dev-skills/skills/.* skills-public/ 2>/dev/null || true

      - name: Commit and push to public repo
        run: |
          cd skills-public
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="Manual sync trigger"
            fi
            git commit -m "Sync from dev-skills: $COMMIT_MSG"
            git push
          fi
