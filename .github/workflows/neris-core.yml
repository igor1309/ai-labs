name: Neris Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Run tests
        working-directory: neris/packages/swift-neris
        run: swift test
