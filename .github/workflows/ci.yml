name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    uses: ./.github/workflows/core.yml

  real-provider-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/core-real-provider-smoke.yml
    with:
      openrouter_model: ${{ vars.OPENROUTER_CI_MODEL }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  notify:
    if: ${{ always() && !cancelled() && (needs.tests.result == 'failure' || needs.real-provider-smoke.result == 'failure') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    needs: [tests, real-provider-smoke]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "CI"
      ref_label: "branch"
      ref_value: ${{ github.ref_name }}
      job_results: |
        tests=${{ needs.tests.result }}
        real-provider-smoke=${{ needs.real-provider-smoke.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
