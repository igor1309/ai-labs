name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*_v*"
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nomos: ${{ steps.filter.outputs.nomos }}
      oracle: ${{ steps.filter.outputs.oracle }}
      shared: ${{ steps.filter.outputs.shared }}
      release: ${{ steps.filter.outputs.release }}
      web-scout: ${{ steps.filter.outputs.web-scout }}
      corpus-scout: ${{ steps.filter.outputs.corpus-scout }}
      notio: ${{ steps.filter.outputs.notio }}
      notio-ci: ${{ steps.filter.outputs.notio-ci }}
      notio-frontend: ${{ steps.filter.outputs.notio-frontend }}
      notio-frontend-ci: ${{ steps.filter.outputs.notio-frontend-ci }}
      reinix: ${{ steps.filter.outputs.reinix }}
      reinix-ci: ${{ steps.filter.outputs.reinix-ci }}
      clipdeck: ${{ steps.filter.outputs.clipdeck }}
      clipdeck-ci: ${{ steps.filter.outputs.clipdeck-ci }}
      dev-skills: ${{ steps.filter.outputs.dev-skills }}
      agonara: ${{ steps.filter.outputs.agonara }}
      agonara-ci: ${{ steps.filter.outputs.agonara-ci }}
      doc-drift-agent: ${{ steps.filter.outputs.doc-drift-agent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed projects
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - ".github/workflows/**"
              - ".node-version"
              - "package-lock.json"
              - "package.json"
              - "scripts/**"
              - "tsconfig.json"
              - "vendor/**"
            nomos:
              - "nomos/**"
            oracle:
              - "oracle/**"
            release:
              - "release-units.config.toml"
              - "release-units.toml"
              - "scripts/release/**"
              - "clipdeck/**"
              - "loki/**"
              - "nomos/**"
              - "notio/**"
              - "oracle/**"
              - "reinix/**"
            web-scout:
              - "web-scout/**"
            corpus-scout:
              - "corpus-scout/**"
            notio:
              - "notio/backend/**"
            notio-ci:
              - ".github/workflows/notio-core.yml"
            notio-frontend:
              - "notio/frontend/**"
            notio-frontend-ci:
              - ".github/workflows/notio-frontend-core.yml"
              - ".github/workflows/notio-frontend-deploy.yml"
            reinix:
              - "reinix/**"
            reinix-ci:
              - ".github/workflows/reinix-core.yml"
            clipdeck:
              - "clipdeck/src/**"
              - "clipdeck/test/**"
              - "clipdeck/package.json"
              - "clipdeck/package-lock.json"
              - "clipdeck/tsconfig*.json"
              - "clipdeck/vitest*.config.ts"
              - "clipdeck/wrangler.*"
            clipdeck-ci:
              - ".github/workflows/clipdeck-core.yml"
              - ".github/workflows/clipdeck-deploy.yml"
            dev-skills:
              - "dev-skills/public/**"
            agonara:
              - "agonara/**"
            agonara-ci:
              - ".github/workflows/agonara-core.yml"
            doc-drift-agent:
              - "agents/doc-drift-agent/**"
              - "*/README.md"
              - ".github/workflows/doc-drift-agent-core.yml"

  notio-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.notio == 'true' || needs.changes.outputs.notio-ci == 'true' }}
    uses: ./.github/workflows/notio-core.yml

  notio-frontend-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.notio-frontend == 'true' || needs.changes.outputs.notio-frontend-ci == 'true' }}
    uses: ./.github/workflows/notio-frontend-core.yml

  nomos-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.nomos == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/nomos-core.yml

  oracle-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.oracle == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/oracle-core.yml

  web-scout-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.web-scout == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/web-scout-core.yml

  corpus-scout-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.corpus-scout == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/corpus-scout-core.yml

  reinix-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.reinix == 'true' || needs.changes.outputs.reinix-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/reinix-core.yml

  clipdeck-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.clipdeck == 'true' || needs.changes.outputs.clipdeck-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/clipdeck-core.yml

  agonara-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.agonara == 'true' || needs.changes.outputs.agonara-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/agonara-core.yml

  doc-drift-agent-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.doc-drift-agent == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/doc-drift-agent-core.yml

  release-validation:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify manifest is up to date
        run: node scripts/release/generate-manifest.js --check

      - name: Validate manifest invariants
        run: node scripts/release/validate-manifest.js

      - name: Run release script tests
        run: ./scripts/run_silent.sh "release-tests" node --test scripts/release/tests/*.test.js

  dev-skills-validation:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.dev-skills == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate marketplace.json
        run: |
          FILE="dev-skills/public/.claude-plugin/marketplace.json"
          # Valid JSON
          jq empty "$FILE"
          # Skills array is sorted alphabetically
          jq -e '.plugins[0].skills | [., sort] | .[0] == .[1]' "$FILE" > /dev/null
          echo "marketplace.json: valid JSON, skills sorted"

      - name: Verify SKILL.md files exist
        run: |
          FILE="dev-skills/public/.claude-plugin/marketplace.json"
          jq -r '.plugins[0].skills[]' "$FILE" | while read -r skill; do
            SKILL_PATH="dev-skills/public/${skill#./}/SKILL.md"
            if [ ! -f "$SKILL_PATH" ]; then
              echo "ERROR: Missing $SKILL_PATH"
              exit 1
            fi
          done
          echo "All SKILL.md files present"

      - name: Verify codex plugin manifest version matches marketplace
        run: |
          MARKET="dev-skills/public/.claude-plugin/marketplace.json"
          PLUGIN="dev-skills/public/.codex-plugin/plugin.json"
          jq empty "$PLUGIN"
          MARKET_VERSION=$(jq -r '.metadata.version' "$MARKET")
          PLUGIN_VERSION=$(jq -r '.version' "$PLUGIN")
          if [ "$MARKET_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "ERROR: version mismatch: marketplace.json=$MARKET_VERSION plugin.json=$PLUGIN_VERSION"
            exit 1
          fi
          echo "plugin.json version matches marketplace.json ($MARKET_VERSION)"

  real-provider-smoke:
    needs: [changes, oracle-core]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.oracle == 'true' || needs.changes.outputs.shared == 'true') && needs.oracle-core.result == 'success' }}
    uses: ./.github/workflows/core-real-provider-smoke.yml
    with:
      llm_model: ${{ vars.OPENROUTER_CI_MODEL }}
    secrets:
      LLM_API_KEY: ${{ secrets.NOMOS_ORACLE_TOKEN }}

  report:
    if: ${{ always() }}
    needs: [changes, nomos-core, oracle-core, web-scout-core, corpus-scout-core, reinix-core, clipdeck-core, agonara-core, doc-drift-agent-core, notio-core, notio-frontend-core, release-validation, real-provider-smoke, dev-skills-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done

  notify:
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.nomos-core.result == 'failure' || needs.oracle-core.result == 'failure' || needs.web-scout-core.result == 'failure' || needs.corpus-scout-core.result == 'failure' || needs.reinix-core.result == 'failure' || needs.clipdeck-core.result == 'failure' || needs.agonara-core.result == 'failure' || needs.doc-drift-agent-core.result == 'failure' || needs.notio-core.result == 'failure' || needs.notio-frontend-core.result == 'failure' || needs.release-validation.result == 'failure' || needs.real-provider-smoke.result == 'failure' || needs.dev-skills-validation.result == 'failure') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    needs: [changes, nomos-core, oracle-core, web-scout-core, corpus-scout-core, reinix-core, clipdeck-core, agonara-core, doc-drift-agent-core, notio-core, notio-frontend-core, release-validation, real-provider-smoke, dev-skills-validation]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "CI"
      ref_label: "branch"
      ref_value: ${{ github.ref_name }}
      job_results: |
        changes=${{ needs.changes.result }}
        nomos-core=${{ needs.nomos-core.result }}
        oracle-core=${{ needs.oracle-core.result }}
        web-scout-core=${{ needs.web-scout-core.result }}
        corpus-scout-core=${{ needs.corpus-scout-core.result }}
        reinix-core=${{ needs.reinix-core.result }}
        clipdeck-core=${{ needs.clipdeck-core.result }}
        agonara-core=${{ needs.agonara-core.result }}
        doc-drift-agent-core=${{ needs.doc-drift-agent-core.result }}
        notio-core=${{ needs.notio-core.result }}
        notio-frontend-core=${{ needs.notio-frontend-core.result }}
        release-validation=${{ needs.release-validation.result }}
        real-provider-smoke=${{ needs.real-provider-smoke.result }}
        dev-skills-validation=${{ needs.dev-skills-validation.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
