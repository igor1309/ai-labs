name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*_v*"
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nomos: ${{ steps.filter.outputs.nomos }}
      oracle: ${{ steps.filter.outputs.oracle }}
      shared: ${{ steps.filter.outputs.shared }}
      release: ${{ steps.filter.outputs.release }}
      web-scout: ${{ steps.filter.outputs.web-scout }}
      corpus-scout: ${{ steps.filter.outputs.corpus-scout }}
      notio: ${{ steps.filter.outputs.notio }}
      notio-ci: ${{ steps.filter.outputs.notio-ci }}
      notio-frontend: ${{ steps.filter.outputs.notio-frontend }}
      notio-frontend-ci: ${{ steps.filter.outputs.notio-frontend-ci }}
      rexlab: ${{ steps.filter.outputs.rexlab }}
      rexlab-ci: ${{ steps.filter.outputs.rexlab-ci }}
      reinix: ${{ steps.filter.outputs.reinix }}
      reinix-ci: ${{ steps.filter.outputs.reinix-ci }}
      clipdeck: ${{ steps.filter.outputs.clipdeck }}
      clipdeck-ci: ${{ steps.filter.outputs.clipdeck-ci }}
      ntfy-sender: ${{ steps.filter.outputs.ntfy-sender }}
      ntfy-sender-ci: ${{ steps.filter.outputs.ntfy-sender-ci }}
      noreta: ${{ steps.filter.outputs.noreta }}
      noreta-ci: ${{ steps.filter.outputs.noreta-ci }}
      agister: ${{ steps.filter.outputs.agister }}
      agister-ci: ${{ steps.filter.outputs.agister-ci }}
      warder: ${{ steps.filter.outputs.warder }}
      warder-ci: ${{ steps.filter.outputs.warder-ci }}
      dev-skills: ${{ steps.filter.outputs.dev-skills }}
      agonara: ${{ steps.filter.outputs.agonara }}
      agonara-ci: ${{ steps.filter.outputs.agonara-ci }}
      foliotell: ${{ steps.filter.outputs.foliotell }}
      foliotell-ci: ${{ steps.filter.outputs.foliotell-ci }}
      foliotell-android: ${{ steps.filter.outputs.foliotell-android }}
      foliotell-android-ci: ${{ steps.filter.outputs.foliotell-android-ci }}
      session-digest: ${{ steps.filter.outputs.session-digest }}
      session-digest-ci: ${{ steps.filter.outputs.session-digest-ci }}
      loki: ${{ steps.filter.outputs.loki }}
      loki-ci: ${{ steps.filter.outputs.loki-ci }}
      neris: ${{ steps.filter.outputs.neris }}
      neris-ci: ${{ steps.filter.outputs.neris-ci }}
      claude-insights: ${{ steps.filter.outputs.claude-insights }}
      claude-insights-ci: ${{ steps.filter.outputs.claude-insights-ci }}
      langfuse: ${{ steps.filter.outputs.langfuse }}
      langfuse-ci: ${{ steps.filter.outputs.langfuse-ci }}
      mac-health: ${{ steps.filter.outputs.mac-health }}
      mac-health-ci: ${{ steps.filter.outputs.mac-health-ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed projects
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - ".github/workflows/*.yml"
              - ".github/workflows/*.yaml"
              - ".node-version"
              - "package-lock.json"
              - "package.json"
              - "scripts/ci/**"
              - "scripts/run_silent.sh"
              - "tsconfig.json"
              - "vendor/**"
            nomos:
              - "nomos/src/**"
              - "nomos/tests/**"
              - "nomos/scripts/**"
              - "nomos/package.json"
              - "nomos/package-lock.json"
              - "nomos/Dockerfile"
              - "nomos/Caddyfile"
              - "nomos/docker-compose*.yml"
            oracle:
              - "oracle/apps/**"
              - "oracle/packages/**"
              - "oracle/prompts/**"
              - "oracle/copy/**"
            release:
              - "release-units.config.toml"
              - "release-units.toml"
              - "scripts/release/**"
              - "agonara/**"
              - "clipdeck/**"
              - "foliotell/**"
              - "loki/**"
              - "nomos/**"
              - "notio/**"
              - "oracle/**"
              - "reinix/**"
            web-scout:
              - "web-scout/src/**"
              - "web-scout/tests/**"
              - "web-scout/package.json"
              - "web-scout/package-lock.json"
              - "web-scout/requirements.txt"
              - "web-scout/conftest.py"
              - "web-scout/smoke.py"
            corpus-scout:
              - "corpus-scout/src/**"
              - "corpus-scout/tests/**"
              - "corpus-scout/scripts/**"
              - "corpus-scout/tools/**"
              - "corpus-scout/package.json"
            notio:
              - "notio/backend/**"
            notio-ci:
              - ".github/workflows/notio-core.yml"
            notio-frontend:
              - "notio/frontend/**"
            notio-frontend-ci:
              - ".github/workflows/notio-frontend-core.yml"
              - ".github/workflows/notio-frontend-deploy.yml"
            rexlab:
              - "rexlab/src/**"
              - "rexlab/tests/**"
              - "rexlab/scripts/**"
              - "rexlab/index.html"
              - "rexlab/package.json"
              - "rexlab/package-lock.json"
              - "rexlab/tsconfig.json"
              - "rexlab/vite.config.ts"
              - "rexlab/wrangler.toml"
            rexlab-ci:
              - ".github/workflows/rexlab-core.yml"
              - ".github/workflows/rexlab-deploy.yml"
            reinix:
              - "reinix/src/**"
              - "reinix/tests/**"
              - "reinix/examples/**"
              - "reinix/package.json"
            reinix-ci:
              - ".github/workflows/reinix-core.yml"
            clipdeck:
              - "clipdeck/src/**"
              - "clipdeck/test/**"
              - "clipdeck/package.json"
              - "clipdeck/package-lock.json"
              - "clipdeck/tsconfig*.json"
              - "clipdeck/vitest*.config.ts"
              - "clipdeck/wrangler.*"
            clipdeck-ci:
              - ".github/workflows/clipdeck-core.yml"
              - ".github/workflows/clipdeck-deploy.yml"
            ntfy-sender:
              - "ntfy-sender/public/**"
              - "ntfy-sender/tests/**"
              - "ntfy-sender/wrangler.toml"
            ntfy-sender-ci:
              - ".github/workflows/ntfy-sender-core.yml"
              - ".github/workflows/ntfy-sender-deploy.yml"
            noreta:
              - "noreta/src/**"
              - "noreta/tests/**"
              - "noreta/package.json"
              - "noreta/tsconfig.json"
              - "noreta/docs/qa.md"
            noreta-ci:
              - ".github/workflows/noreta-core.yml"
            agister:
              - "agister/**/*.go"
              - "agister/go.mod"
              - "agister/go.sum"
              - "gokit/**"
              - "agister/examples/**"
              - "agister/pages/**"
              - "research/agister/research/verger/policies/**"
              - ".agister/**"
              - "agister/.agister/**"
              - "agister/home/**"
              - "scripts/agister-gate/**"
              - "agister/docs/**"
              - "agister/skills/**"
              - "agister/README.md"
              - "agister/testdata/**"
              - "agister/scripts/**"
              - "**/AGENTS.md"
            agister-ci:
              - ".github/workflows/agister-core.yml"
            warder:
              - "warder/**/*.go"
              - "warder/**/go.mod"
              - "warder/**/go.sum"
              - "warder/**/testdata/**"
              - "warder/scripts/**"
              - "warder/.agister/**"
            warder-ci:
              - ".github/workflows/warder-core.yml"
            dev-skills:
              - "dev-skills/public/**"
            agonara:
              - "agonara/src/**"
              - "agonara/tests/**"
              - "agonara/package.json"
              - "agonara/package-lock.json"
              - "agonara/playwright.config.js"
              - "agonara/Dockerfile"
              - "agonara/compose.yaml"
              - "agonara/compose*.yml"
              - "agonara/scripts/**"
              - "agonara/docs/api/**"
              - "agonara/docs/intent/**"
              - "agonara/skills/**"
              - "agonara/skills-publish-manifest.json"
              - "agonara/publish-assets/**"
              - "docs/loc-dashboard.html"
            agonara-ci:
              - ".github/workflows/agonara-core.yml"
            foliotell:
              - "foliotell/ios/App/**"
              - "foliotell/ios/Config/**"
              - "foliotell/ios/FolioTell.xcodeproj/**"
              - "foliotell/ios/Package.swift"
              - "foliotell/ios/release.toml"
              - "foliotell/ios/scripts/**"
              - "foliotell/ios/Sources/**"
              - "foliotell/ios/Tests/**"
              - "foliotell/ios/.maestro/**"
            foliotell-ci:
              - ".github/workflows/ci.yml"
              - ".github/workflows/foliotell-core.yml"
            foliotell-android:
              - "foliotell/android/**"
            foliotell-android-ci:
              - ".github/workflows/ci.yml"
              - ".github/workflows/foliotell-android-core.yml"
            session-digest:
              - "session-digest/src/**"
              - "session-digest/tests/**"
              - "session-digest/digest-schema.yaml"
              - "session-digest/package.json"
              - "session-digest/tsconfig.json"
            session-digest-ci:
              - ".github/workflows/session-digest-core.yml"
            loki:
              - "loki/**"
              - "**/docker-compose*.yml"
              - "**/docker-compose*.yaml"
              - "**/compose*.yml"
              - "**/compose*.yaml"
            loki-ci:
              - ".github/workflows/loki-core.yml"
            neris:
              - "neris/packages/swift-neris/**"
            neris-ci:
              - ".github/workflows/neris-core.yml"
            claude-insights:
              - "claude-insights/claude-insights.py"
              - "claude-insights/test_claude_insights.py"
              - "claude-insights/supabase/functions/**"
            claude-insights-ci:
              - ".github/workflows/claude-insights-core.yml"
            langfuse:
              - "docker/langfuse/**"
              - "tests/test_langfuse_shared_stack.py"
            langfuse-ci:
              - ".github/workflows/langfuse-core.yml"
            mac-health:
              - "tools/mac-health/checks/**"
              - "tools/mac-health/launchd/**"
              - "tools/mac-health/lib/**"
              - "tools/mac-health/newsyslog/**"
              - "tools/mac-health/tests/**"
              - "tools/mac-health/*.sh"
            mac-health-ci:
              - ".github/workflows/mac-health-core.yml"

  notio-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.notio == 'true' || needs.changes.outputs.notio-ci == 'true' }}
    uses: ./.github/workflows/notio-core.yml

  notio-frontend-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.notio-frontend == 'true' || needs.changes.outputs.notio-frontend-ci == 'true' }}
    uses: ./.github/workflows/notio-frontend-core.yml

  rexlab-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rexlab == 'true' || needs.changes.outputs.rexlab-ci == 'true' }}
    uses: ./.github/workflows/rexlab-core.yml

  nomos-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.nomos == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/nomos-core.yml

  oracle-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.oracle == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/oracle-core.yml

  web-scout-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.web-scout == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/web-scout-core.yml

  corpus-scout-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.corpus-scout == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/corpus-scout-core.yml

  reinix-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.reinix == 'true' || needs.changes.outputs.reinix-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/reinix-core.yml

  clipdeck-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.clipdeck == 'true' || needs.changes.outputs.clipdeck-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/clipdeck-core.yml

  ntfy-sender-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ntfy-sender == 'true' || needs.changes.outputs.ntfy-sender-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/ntfy-sender-core.yml

  noreta-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.noreta == 'true' || needs.changes.outputs.noreta-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/noreta-core.yml

  agister-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.agister == 'true' || needs.changes.outputs.agister-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/agister-core.yml

  warder-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.warder == 'true' || needs.changes.outputs.warder-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/warder-core.yml

  agonara-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.agonara == 'true' || needs.changes.outputs.agonara-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/agonara-core.yml

  foliotell-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.foliotell == 'true' || needs.changes.outputs.foliotell-ci == 'true' }}
    uses: ./.github/workflows/foliotell-core.yml

  foliotell-android-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.foliotell-android == 'true' || needs.changes.outputs.foliotell-android-ci == 'true' }}
    uses: ./.github/workflows/foliotell-android-core.yml

  session-digest-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.session-digest == 'true' || needs.changes.outputs.session-digest-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/session-digest-core.yml

  loki-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.loki == 'true' || needs.changes.outputs.loki-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/loki-core.yml

  neris-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.neris == 'true' || needs.changes.outputs.neris-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/neris-core.yml

  claude-insights-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.claude-insights == 'true' || needs.changes.outputs.claude-insights-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/claude-insights-core.yml

  langfuse-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.langfuse == 'true' || needs.changes.outputs.langfuse-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/langfuse-core.yml

  mac-health-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.mac-health == 'true' || needs.changes.outputs.mac-health-ci == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/mac-health-core.yml

  release-validation:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Verify manifest is up to date
        run: node scripts/release/generate-manifest.js --check

      - name: Validate manifest invariants
        run: node scripts/release/validate-manifest.js

      - name: Validate FolioTell release notes
        run: node scripts/release/validate-foliotell-release-notes.js

      - name: Run release script tests
        run: ./scripts/run_silent.sh "release-tests" node --test scripts/release/tests/*.test.js

  pr-scope:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: A change to Agister changes no other project
        run: node scripts/pr-scope.js "origin/${{ github.base_ref }}"

  # The repository scripts' tests read files across the repository, so
  # they run on every push and pull request, behind no filter.
  repo-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Run the repository scripts' tests
        run: ./scripts/run_silent.sh "repo-scripts-tests" node --test scripts/tests/*.test.js

  dev-skills-validation:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.dev-skills == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate marketplace.json
        run: |
          FILE="dev-skills/public/.claude-plugin/marketplace.json"
          # Valid JSON
          jq empty "$FILE"
          # Skills array is sorted alphabetically
          jq -e '.plugins[0].skills | [., sort] | .[0] == .[1]' "$FILE" > /dev/null
          echo "marketplace.json: valid JSON, skills sorted"

      - name: Verify SKILL.md files exist
        run: |
          FILE="dev-skills/public/.claude-plugin/marketplace.json"
          jq -r '.plugins[0].skills[]' "$FILE" | while read -r skill; do
            SKILL_PATH="dev-skills/public/${skill#./}/SKILL.md"
            if [ ! -f "$SKILL_PATH" ]; then
              echo "ERROR: Missing $SKILL_PATH"
              exit 1
            fi
          done
          echo "All SKILL.md files present"

      - name: Verify codex plugin manifest version matches marketplace
        run: |
          MARKET="dev-skills/public/.claude-plugin/marketplace.json"
          PLUGIN="dev-skills/public/.codex-plugin/plugin.json"
          jq empty "$PLUGIN"
          MARKET_VERSION=$(jq -r '.metadata.version' "$MARKET")
          PLUGIN_VERSION=$(jq -r '.version' "$PLUGIN")
          if [ "$MARKET_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "ERROR: version mismatch: marketplace.json=$MARKET_VERSION plugin.json=$PLUGIN_VERSION"
            exit 1
          fi
          echo "plugin.json version matches marketplace.json ($MARKET_VERSION)"

  real-provider-smoke:
    needs: [changes, oracle-core]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.oracle == 'true' || needs.changes.outputs.shared == 'true') && needs.oracle-core.result == 'success' }}
    uses: ./.github/workflows/core-real-provider-smoke.yml
    with:
      llm_model: ${{ vars.OPENROUTER_CI_MODEL }}
    secrets:
      LLM_API_KEY: ${{ secrets.NOMOS_ORACLE_TOKEN }}

  report:
    # Only a PR's own run satisfies the required `report` check: a push
    # run of the same commit reports under another name.
    name: ${{ github.event_name == 'pull_request' && 'report' || format('report ({0})', github.event_name) }}
    if: ${{ always() }}
    needs: [changes, nomos-core, oracle-core, web-scout-core, corpus-scout-core, reinix-core, clipdeck-core, ntfy-sender-core, noreta-core, agister-core, warder-core, agonara-core, foliotell-core, foliotell-android-core, notio-core, notio-frontend-core, rexlab-core, release-validation, real-provider-smoke, dev-skills-validation, pr-scope, repo-scripts, session-digest-core, loki-core, neris-core, claude-insights-core, langfuse-core, mac-health-core]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done

  notify:
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.nomos-core.result == 'failure' || needs.oracle-core.result == 'failure' || needs.web-scout-core.result == 'failure' || needs.corpus-scout-core.result == 'failure' || needs.reinix-core.result == 'failure' || needs.clipdeck-core.result == 'failure' || needs.ntfy-sender-core.result == 'failure' || needs.noreta-core.result == 'failure' || needs.agister-core.result == 'failure' || needs.warder-core.result == 'failure' || needs.agonara-core.result == 'failure' || needs.foliotell-core.result == 'failure' || needs.foliotell-android-core.result == 'failure' || needs.notio-core.result == 'failure' || needs.notio-frontend-core.result == 'failure' || needs.rexlab-core.result == 'failure' || needs.release-validation.result == 'failure' || needs.real-provider-smoke.result == 'failure' || needs.dev-skills-validation.result == 'failure' || needs.pr-scope.result == 'failure' || needs.repo-scripts.result == 'failure' || needs.session-digest-core.result == 'failure' || needs.loki-core.result == 'failure' || needs.neris-core.result == 'failure' || needs.claude-insights-core.result == 'failure' || needs.langfuse-core.result == 'failure' || needs.mac-health-core.result == 'failure') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    needs: [changes, nomos-core, oracle-core, web-scout-core, corpus-scout-core, reinix-core, clipdeck-core, ntfy-sender-core, noreta-core, agister-core, warder-core, agonara-core, foliotell-core, foliotell-android-core, notio-core, notio-frontend-core, rexlab-core, release-validation, real-provider-smoke, dev-skills-validation, pr-scope, repo-scripts, session-digest-core, loki-core, neris-core, claude-insights-core, langfuse-core, mac-health-core]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "CI"
      ref_label: "branch"
      ref_value: ${{ github.ref_name }}
      job_results: |
        changes=${{ needs.changes.result }}
        nomos-core=${{ needs.nomos-core.result }}
        oracle-core=${{ needs.oracle-core.result }}
        web-scout-core=${{ needs.web-scout-core.result }}
        corpus-scout-core=${{ needs.corpus-scout-core.result }}
