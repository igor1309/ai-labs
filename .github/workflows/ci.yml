name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/core.yml

  real-provider-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run real-provider smoke
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NORMALIZER_MODEL: ${{ vars.OPENROUTER_CI_MODEL }}
          OPENROUTER_TIMEOUT_MS: "90000"
          OUTLOOK_MODEL: ${{ vars.OPENROUTER_CI_MODEL }}
          RUN_REAL_PROVIDER_SMOKE: "1"
        run: ./scripts/run_silent.sh "real-provider-smoke" node --test oracle/apps/am-i-done-web/tests/web-real-provider-smoke.test.js

  notify:
    if: ${{ always() && !cancelled() && (needs.tests.result == 'failure' || needs.real-provider-smoke.result == 'failure') }}
    needs: [tests, real-provider-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
        run: |
          failed_jobs=""
          if [ "${{ needs.tests.result }}" = "failure" ]; then
            failed_jobs="tests"
          fi
          if [ "${{ needs.real-provider-smoke.result }}" = "failure" ]; then
            [ -n "$failed_jobs" ] && failed_jobs="$failed_jobs, "
            failed_jobs="${failed_jobs}real-provider-smoke"
          fi
          text="❌ CI failed: ${failed_jobs}
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./scripts/ci/notify_telegram_failure.sh "${text}"
