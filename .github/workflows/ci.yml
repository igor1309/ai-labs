name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nomos: ${{ steps.filter.outputs.nomos }}
      oracle: ${{ steps.filter.outputs.oracle }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed projects
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - ".github/workflows/**"
              - "loki/**"
              - ".node-version"
              - "package-lock.json"
              - "package.json"
              - "scripts/**"
              - "tsconfig.json"
              - "vendor/**"
            nomos:
              - "nomos/**"
            oracle:
              - "oracle/**"

  oracle-core:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.oracle == 'true' || needs.changes.outputs.nomos == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/oracle-core.yml

  real-provider-smoke:
    needs: [changes, oracle-core]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.oracle == 'true' || needs.changes.outputs.shared == 'true') && needs.oracle-core.result == 'success' }}
    uses: ./.github/workflows/core-real-provider-smoke.yml
    with:
      openrouter_model: ${{ vars.OPENROUTER_CI_MODEL }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  notify:
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.oracle-core.result == 'failure' || needs.real-provider-smoke.result == 'failure') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    needs: [changes, oracle-core, real-provider-smoke]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "CI"
      ref_label: "branch"
      ref_value: ${{ github.ref_name }}
      job_results: |
        changes=${{ needs.changes.result }}
        oracle-core=${{ needs.oracle-core.result }}
        real-provider-smoke=${{ needs.real-provider-smoke.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
