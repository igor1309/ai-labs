name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_provider_smoke:
        description: Run real-provider Worker smoke check (uses OPENROUTER_API_KEY secret)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers npx playwright install --with-deps chromium

      - name: Run tests
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers RUN_WEB_E2E=1 ./scripts/run_silent.sh "tests" npm test

  real-provider-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_provider_smoke == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run real-provider smoke
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUN_REAL_PROVIDER_SMOKE: "1"
        run: ./scripts/run_silent.sh "real-provider-smoke" node --test oracle/apps/am-i-done-web/tests/web-real-provider-smoke.test.js
