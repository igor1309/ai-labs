name: ntfy-sender Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  core:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # The runner keeps browsers in its own cache between jobs.
        run: npx playwright install chromium

      - name: Run browser tests
        run: ./scripts/run_silent.sh "ntfy-sender-tests" npm run test:ntfy-sender
