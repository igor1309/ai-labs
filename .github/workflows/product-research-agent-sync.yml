name: Sync product-research-agent to OpenClaw VPS

on:
  push:
    branches:
      - trunk
    paths:
      - 'agents/product-research-agent/agent/**'
      - 'prompts/product-research.md'
  workflow_dispatch:

concurrency:
  group: product-research-agent-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage workspace bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/workspace-product-research
          rsync -a --delete agents/product-research-agent/agent/ /tmp/workspace-product-research/
          # OpenClaw loads AGENTS.md from the workspace root as the system prompt.
          mv /tmp/workspace-product-research/agent.md /tmp/workspace-product-research/AGENTS.md
          # Deploy the canonical research methodology into the workspace.
          # Single source of truth is prompts/product-research.md — never vendored under agent/.
          cp prompts/product-research.md /tmp/workspace-product-research/research-prompt.md

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OPENCLAW_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 107.172.143.196 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to VPS workspace
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            /tmp/workspace-product-research/ \
            openclaw@107.172.143.196:/home/openclaw/.openclaw/workspace-product-research/

      - name: Verify sync
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes openclaw@107.172.143.196 \
            "ls -la /home/openclaw/.openclaw/workspace-product-research/AGENTS.md /home/openclaw/.openclaw/workspace-product-research/research-prompt.md"
