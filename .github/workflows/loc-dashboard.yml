name: LOC Dashboard

# Daily lines-of-code snapshot sent to Telegram.
# Runs at 06:00 UTC (09:00 Moscow time) — same window as scheduled-health.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loc-dashboard
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run LOC dashboard
        id: loc
        run: |
          output=$(./scripts/loc-dashboard.sh --sort=total)

          # Compact mobile format: name + TOTAL column only (~30 chars wide)
          date_str=$(echo "$output" | awk '/Generated:/{print $2}')
          sep="──────────────────────────────"
          # Aggregate oracle-* sub-projects into a single "oracle" row; sort by total desc
          # Aggregate oracle-* sub-projects into a single "oracle" row; sort by total desc
          # $NF~/^[0-9]+$/ guards against the header row ("project ... TOTAL")
          projects=$(echo "$output" | awk '/^[a-zA-Z]/ && !/^TOTAL/ && $NF~/^[0-9]+$/{if($1~/^oracle-/)o+=$NF;else print $1,$NF} END{if(o)print "oracle",o}' | sort -k2 -rn | awk '{printf "%-22s %6s\n", $1, $2}')
          total_line=$(echo "$output" | awk '/^TOTAL/{printf "%-22s %6s\n", $1, $NF}')
          ratio=$(echo "$output" | grep -o "test/code ratio: [0-9.]*x" || true)

          # Build message via temp file to avoid unindented lines breaking YAML
          tmp=$(mktemp)
          echo "LOC ${date_str}" > "${tmp}"
          echo "${sep}" >> "${tmp}"
          echo "${projects}" >> "${tmp}"
          echo "${sep}" >> "${tmp}"
          echo "${total_line}" >> "${tmp}"
          [ -n "${ratio}" ] && echo "${ratio}" >> "${tmp}"
          msg=$(cat "${tmp}")
          rm "${tmp}"

          echo "msg<<EOF" >> "$GITHUB_OUTPUT"
          echo "$msg" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
          MSG: ${{ steps.loc.outputs.msg }}
        run: |
          msg_html=$(printf '%s' "$MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          curl -fsS -X POST "https://api.telegram.org/bot${CI_BOT_TOKEN}/sendMessage" -d "chat_id=${CI_CHAT_ID}" -d "parse_mode=HTML" --data-urlencode "text=<pre>${msg_html}</pre>"
