name: LOC Dashboard

# Daily lines-of-code snapshot sent to Telegram.
# Runs at 06:00 UTC (09:00 Moscow time) — same window as scheduled-health.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loc-dashboard
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run LOC dashboard
        id: loc
        run: |
          output=$(./scripts/loc-dashboard.sh --sort=total)

          # Compact mobile format: name + TOTAL column only (~30 chars wide)
          date_str=$(echo "$output" | awk '/Generated:/{print $2}')
          sep="──────────────────────────────"
          projects=$(echo "$output" | awk '/^[a-zA-Z]/ && !/^TOTAL/{printf "%-22s %6s\n", $1, $NF}')
          total_line=$(echo "$output" | awk '/^TOTAL/{printf "%-22s %6s\n", $1, $NF}')
          ratio=$(echo "$output" | grep -o "test/code ratio: [0-9.]*x" || true)

          msg="LOC ${date_str}
${sep}
${projects}
${sep}
${total_line}
${ratio}"

          echo "msg<<EOF" >> "$GITHUB_OUTPUT"
          echo "$msg" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
          MSG: ${{ steps.loc.outputs.msg }}
        run: |
          # HTML parse_mode with <pre> ensures monospace alignment on mobile
          msg_html=$(printf '%s' "$MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          curl -fsS -X POST "https://api.telegram.org/bot${CI_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CI_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=<pre>${msg_html}</pre>"
