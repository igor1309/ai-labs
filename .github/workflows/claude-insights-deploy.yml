name: Claude Insights - Deploy Supabase Functions

on:
  push:
    branches:
      - trunk
    paths:
      - "claude-insights/supabase/functions/**"
      - ".github/workflows/claude-insights-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      notify-insights: ${{ steps.filter.outputs.notify-insights }}
      telegram-bot: ${{ steps.filter.outputs.telegram-bot }}
      workflow-file: ${{ steps.filter.outputs.workflow-file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed functions
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            notify-insights:
              - "claude-insights/supabase/functions/notify-insights/**"
              - "claude-insights/supabase/functions/_shared/**"
            telegram-bot:
              - "claude-insights/supabase/functions/telegram-bot/**"
              - "claude-insights/supabase/functions/_shared/**"
            workflow-file:
              - ".github/workflows/claude-insights-deploy.yml"

  deploy-notify-insights:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.notify-insights == 'true' || needs.changes.outputs.workflow-file == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy notify-insights
        run: |
          supabase functions deploy notify-insights \
            --no-verify-jwt \
            --project-ref uvnxjuzofcdxhdkrsocq
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: claude-insights

  deploy-telegram-bot:
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.telegram-bot == 'true' || needs.changes.outputs.workflow-file == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy telegram-bot
        run: |
          supabase functions deploy telegram-bot \
            --no-verify-jwt \
            --project-ref uvnxjuzofcdxhdkrsocq
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: claude-insights

  report:
    if: ${{ always() }}
    needs: [changes, deploy-notify-insights, deploy-telegram-bot]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done

  notify:
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.deploy-notify-insights.result == 'failure' || needs.deploy-telegram-bot.result == 'failure') }}
    needs: [changes, deploy-notify-insights, deploy-telegram-bot]
    uses: ./.github/workflows/notify-telegram-failure.yml
    with:
      title: "Claude Insights Deploy"
      ref_label: "branch"
      ref_value: ${{ github.ref_name }}
      job_results: |
        changes=${{ needs.changes.result }}
        deploy-notify-insights=${{ needs.deploy-notify-insights.result }}
        deploy-telegram-bot=${{ needs.deploy-telegram-bot.result }}
    secrets:
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      CI_CHAT_ID: ${{ secrets.CI_CHAT_ID }}
