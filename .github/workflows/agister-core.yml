name: Agister Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout."
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: [self-hosted, local-mac]
    timeout-minutes: 10
    # agister/archive is kept as reference and is not built or tested here.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gokit/go.mod
          # Self-hosted: Go caches persist on the runner; uploading them hangs.
          cache: false

      - name: Agister
        run: agister/scripts/test.sh

      # The gate drives agister's runs and knows their kinds of work, so it
      # is its own module, outside agister's code.
      - name: Gate
        working-directory: scripts/agister-gate
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
