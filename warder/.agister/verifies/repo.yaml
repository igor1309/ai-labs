# Warder's check for every process that names verify:repo (ADR-010),
# launched in warder/ (ADR-028 rule 1): format, vet and race tests for the
# warder module (warder/scripts/test.sh), run from the worktree root
# (ADR-028 rule 2).
schema: agister.verify/v1alpha1
name: repo
command: warder/scripts/test.sh
timeout: 5m
max_attempts: 3
instruction: >-
  The verification command failed on your changes. Fix the cause in the
  code; do not weaken, skip or delete a check or a test.
