schema_version = 1
runtime = "codex"
launcher = "codex"
executable = "codex"
provider = "openai"
unavailable_model_policy = "stop"

[roles.planner]
model = "gpt-5.6-sol"
reasoning_effort = "high"
context_mode = "warm"
access = "read-only"

[roles.implementer]
model = "gpt-5.6-terra"
reasoning_effort = "medium"
context_mode = "cold"
access = "workspace-write"

[roles.reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "high"
context_mode = "cold"
access = "read-only"

[roles.escalation]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
context_mode = "warm"
access = "read-only"

[independent_review]
runtime = "codex"
launcher = "codex"
executable = "codex"
provider = "openai"
model = "gpt-5.6-luna"
reasoning_effort = "max"
context_mode = "cold"
access = "read-only"
classification = "same-runtime-fresh-pass"

[presets.luna-max]
model = "gpt-5.6-luna"
reasoning_effort = "max"
