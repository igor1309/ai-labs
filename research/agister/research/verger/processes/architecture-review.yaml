# Architecture-focused role instantiated with the same reviewer agent profile.

schema: agister.process/v1alpha1
name: architecture_review
status: example

type: process
uses: agent:reviewer

input:
  instruction: >-
    Review the exact candidate against the governing architecture and module
    responsibilities. Report boundary drift, misplaced decisions, duplicated
    responsibilities, dependency violations, and missing integration behavior.
  required:
    - base_revision
    - candidate_revision
    - diff
    - changed_files
    - architecture_context
    - writer_model_family

agent_selection:
  different_family_from: input.writer_model_family
  on_unsatisfied: fail

workspace:
  access: read-only
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.diff
    - repository.search
  deny:
    - repository.write
    - repository.history.write
    - process.execute
    - network

timeout: 20m
retry:
  max_attempts: 1
resources:
  - reviews

isolation:
  network: denied
  repository_write: denied

output:
  format: json
  schema: agister.review-result/v1alpha1
  require_valid: true

artifacts:
  retain:
    - review_result
    - run_log
