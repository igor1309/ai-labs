# Architecture-focused role instantiated with the same reviewer agent profile.

schema: agister.process/v1alpha1
name: architecture_review
status: example

type: process
uses: agent:reviewer
policy: process-policy:static-review

input:
  instruction: >-
    Review the exact candidate against the governing architecture and module
    responsibilities. Report boundary drift, misplaced decisions, duplicated
    responsibilities, dependency violations, and missing integration behavior.
  required:
    - base_revision
    - candidate_revision
    - diff
    - changed_files
    - architecture_context
    - writer_model_family
