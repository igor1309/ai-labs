# Concrete review role instantiated with the reusable reviewer agent profile.

schema: agister.process/v1alpha1
name: adversarial_review
status: example

type: process
uses: agent:reviewer
policy: process-policy:static-review

input:
  instruction: >-
    Review the exact candidate independently and adversarially. Report material
    correctness, safety, contract, and maintainability findings. Do not assume a
    suspected defect or focus supplied outside this process.
  required:
    - base_revision
    - candidate_revision
    - diff
    - changed_files

output:
  format: json
  schema: agister.review-result/v1alpha1
  require_valid: true
