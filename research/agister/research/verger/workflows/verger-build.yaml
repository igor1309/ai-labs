# Draft workflow derived from ../orchestrator.md and the Verger lessons.
#
# Scope: advance one durable Verger task scope until its required steps,
# milestone gates, and coherence reviews are complete.
#
# Schema names are provisional. Stage identity is separate from implementation:
# external work names a process, while transactional state operations use the
# core's closed set of built-ins. Process retry, timeout, isolation, resource,
# and provider policy remain outside this workflow.

schema: agister.workflow/v1alpha1
name: verger-build
status: draft

description: >-
  Select and complete small Verger build steps, attach deterministic evidence
  to exact candidate revisions, route independent review findings into durable
  follow-up work, and close milestones only after their gate and coherence
  review pass.

inputs:
  repository: task.repository
  scope: task.scope
  limits: task.limits

start: select_step

defaults:
  on_failure:
    terminal: failed
  on_exhausted:
    terminal: failed

# Limits are resolved from the run-start task revision. Every transition sharing
# a budget consumes the same counter. Subject-scoped counters reset only when
# the corresponding durable identity changes.
budgets:
  progress_cycles:
    limit: '${inputs.limits.max_progress_cycles}'
    scope: run
  steps:
    limit: '${inputs.limits.max_steps}'
    scope: run
  corrections:
    limit: '${inputs.limits.max_corrections_per_step}'
    scope: task.active_step.id
  step_infrastructure_failures:
    limit: '${inputs.limits.max_infrastructure_failures}'
    scope: task.active_step.id
  milestone_infrastructure_failures:
    limit: '${inputs.limits.max_infrastructure_failures}'
    scope: task.active_milestone.id
  milestone_cycles:
    limit: '${inputs.limits.max_milestone_cycles}'
    scope: run
  owner_waits:
    limit: '${inputs.limits.max_owner_waits}'
    scope: run

stages:
  select_step:
    builtin: select-step
    consume: progress_cycles
  generate_brief:
    builtin: generate-brief
  build:
    process: process:build
  record_builder_result:
    builtin: record-builder-result
  record_specification_friction:
    builtin: record-specification-friction
  gate:
    process: process:gate
  preflight_plants:
    process: process:preflight-plants
  plants:
    process: process:plants
  record_gate_infrastructure_failure:
    builtin: record-infrastructure-failure
    consume: step_infrastructure_failures
    on_exhausted:
      to: commit_gate_infrastructure_root_cause
  record_plant_infrastructure_failure:
    builtin: record-infrastructure-failure
    consume: step_infrastructure_failures
    on_exhausted:
      to: commit_plant_infrastructure_root_cause
  accept:
    builtin: accept-candidate
  review:
    process: process:adversarial_review
  judge_review:
    process: process:judge-review
  commit_review_findings:
    builtin: commit-review-findings
  close_step:
    builtin: close-step
  milestone_gate:
    process: process:milestone-gate
  record_milestone_infrastructure_failure:
    builtin: record-infrastructure-failure
    consume: milestone_infrastructure_failures
    on_exhausted:
      to: commit_milestone_infrastructure_root_cause
  commit_milestone_findings:
    builtin: commit-milestone-findings
  coherence_review:
    # Its process policy resolves every accepted revision's writer provenance
    # and requires a reviewer family different from all of them.
    process: process:cross-family-coherence-review
  judge_coherence:
    process: process:judge-coherence
  commit_coherence_findings:
    builtin: commit-coherence-findings
  close_milestone:
    builtin: close-milestone
  commit_gate_infrastructure_root_cause:
    builtin: commit-infrastructure-root-cause
  commit_plant_infrastructure_root_cause:
    builtin: commit-infrastructure-root-cause
  commit_milestone_infrastructure_root_cause:
    builtin: commit-infrastructure-root-cause

# Routes express execution dependencies. Conditional choices are
# exhaustive, and every repeating route consumes one named finite budget.
routes:
  select_step:
    - when: 'output.route == "step_ready"'
      to: generate_brief
    - when: 'output.route == "milestone_gate_ready"'
      to: milestone_gate
    - when: 'output.route == "waiting_for_owner"'
      suspend:
        until: 'decision.applied(${select_step.output.decision_id})'
        resume: select_step
        consume: owner_waits
    - when: 'output.route == "scope_complete"'
      terminal: succeeded
    - default: true
      terminal: failed

  generate_brief:
    - to: build

  build:
    - when: 'output.status == "candidate_ready"'
      to: record_builder_result
    - when: 'output.status == "blocked_by_specification"'
      to: record_specification_friction
    - default: true
      terminal: failed

  record_builder_result:
    - to: gate

  record_specification_friction:
    - to: select_step
      consume: corrections

  gate:
    - when: 'output.status == "passed"'
      to: preflight_plants
    - when: 'output.status == "product_failure"'
      to: generate_brief
      consume: corrections
    - when: 'output.status == "infrastructure_failure"'
      to: record_gate_infrastructure_failure
    - default: true
      terminal: failed

  preflight_plants:
    - when: 'output.status == "ready"'
      to: plants
    - when: 'output.status == "invalid_plant"'
      to: generate_brief
      consume: corrections
    - default: true
      terminal: failed

  plants:
    - when: 'output.status == "passed"'
      to: accept
    - when: 'output.status == "product_failure"'
      to: generate_brief
      consume: corrections
    - when: 'output.status == "infrastructure_failure"'
      to: record_plant_infrastructure_failure
    - default: true
      terminal: failed

  record_gate_infrastructure_failure:
    - to: gate

  record_plant_infrastructure_failure:
    - to: plants

  accept:
    - when: 'output.status == "accepted"'
      to: review
    - default: true
      terminal: failed

  review:
    - when: 'output.status == "completed"'
      to: judge_review
    - default: true
      terminal: failed

  judge_review:
    - when: 'output.status == "no_findings"'
      to: close_step
    - when: 'output.status == "follow_up_required"'
      to: commit_review_findings
    - default: true
      terminal: failed

  commit_review_findings:
    - to: close_step

  close_step:
    - to: select_step
      consume: steps

  milestone_gate:
    - when: 'output.status == "passed"'
      to: coherence_review
    - when: 'output.status == "product_failure"'
      to: commit_milestone_findings
    - when: 'output.status == "infrastructure_failure"'
      to: record_milestone_infrastructure_failure
    - default: true
      terminal: failed

  commit_milestone_findings:
    - to: select_step
      consume: milestone_cycles

  record_milestone_infrastructure_failure:
    - to: milestone_gate

  coherence_review:
    - when: 'output.status == "completed"'
      to: judge_coherence
    - default: true
      terminal: failed

  judge_coherence:
    - when: 'output.status == "no_findings"'
      to: close_milestone
    - when: 'output.status == "follow_up_required"'
      to: commit_coherence_findings
    - default: true
      terminal: failed

  commit_coherence_findings:
    - to: select_step
      consume: milestone_cycles

  close_milestone:
    - to: select_step
      consume: milestone_cycles

  commit_gate_infrastructure_root_cause:
    - terminal: failed

  commit_plant_infrastructure_root_cause:
    - terminal: failed

  commit_milestone_infrastructure_root_cause:
    - terminal: failed

# Provisional data bindings. Processes may consume durable task state and named
# upstream output independently of the route that invoked them.
data:
  select_step:
    task: task.current
    scope: inputs.scope

  generate_brief:
    task: task.current
    step: task.active_step
    prior_failure: task.active_step.latest_failure

  build:
    task: task.current
    step: task.active_step
    brief: generate_brief.output.brief
    unverified_work: task.active_step.recovery_artifact

  record_builder_result:
    step: task.active_step
    result: build.output
    optional_friction: build.output.friction

  record_specification_friction:
    step: task.active_step
    friction: build.output.friction

  gate:
    step: task.active_step
    candidate: task.active_step.candidate_revision

  preflight_plants:
    step: task.active_step
    candidate: task.active_step.candidate_revision
    plants: task.active_step.plants

  plants:
    step: task.active_step
    candidate: task.active_step.candidate_revision
    plants: task.active_step.plants

  record_gate_infrastructure_failure:
    step: task.active_step
    failure: gate.output

  record_plant_infrastructure_failure:
    step: task.active_step
    failure: plants.output

  accept:
    step: task.active_step
    candidate: task.active_step.candidate_revision

  review:
    step: task.active_step
    base_revision: task.active_step.base_revision
    candidate_revision: accept.output.revision
    diff: evidence.candidate(accept.output.revision).diff
    changed_files: evidence.candidate(accept.output.revision).changed_files

  judge_review:
    step: task.active_step
    review: review.output

  commit_review_findings:
    step: task.active_step
    findings: judge_review.output.findings

  close_step:
    step: task.active_step

  milestone_gate:
    task: task.current
    milestone: task.active_milestone

  commit_milestone_findings:
    milestone: task.active_milestone
    findings: milestone_gate.output.findings

  record_milestone_infrastructure_failure:
    milestone: task.active_milestone
    failure: milestone_gate.output

  coherence_review:
    milestone: task.active_milestone
    candidate_revisions: task.active_milestone.accepted_revisions

  judge_coherence:
    milestone: task.active_milestone
    review: coherence_review.output

  commit_coherence_findings:
    milestone: task.active_milestone
    findings: judge_coherence.output.findings

  close_milestone:
    milestone: task.active_milestone

  commit_gate_infrastructure_root_cause:
    task: task.current
    step: task.active_step
    failure: gate.output

  commit_plant_infrastructure_root_cause:
    task: task.current
    step: task.active_step
    failure: plants.output

  commit_milestone_infrastructure_root_cause:
    task: task.current
    milestone: task.active_milestone
    failure: milestone_gate.output
