# Review of the architecture decisions one change adds or edits: the ADR
# review of the candidate against the base, then the judge's rulings on it.
#   agister run adr_review --param base=<rev> --param candidate=<rev>
schema: agister.workflow/v1alpha1
name: adr_review

type: workflow

input:
  params:
    base: {default: origin/agister}
    candidate: {default: HEAD}
  # Resolved once: the review and the judge get the same two commits.
  values:
    base: {source: git.revision, rev: "${param.base}"}
    candidate: {source: git.revision, rev: "${param.candidate}"}

fan_out:
  - {node: adr, uses: process:adr_review_codex}

join: {node: judge, uses: process:review_judge}
