# Review of one change (ADR-003): the architecture and tests reviews of the
# same candidate against the same base, concurrently, then the judge's
# rulings on both. The judge starts only if both reviews completed, and
# receives their recorded outputs as its collection and nothing else.
#   agister run review --param base=<rev> --param candidate=<rev>
schema: agister.workflow/v1alpha1
name: review

type: workflow

input:
  params:
    base: {default: origin/agister}
    candidate: {default: HEAD}
  # Resolved once: every review gets the same two commits.
  values:
    base: {source: git.revision, rev: "${param.base}"}
    candidate: {source: git.revision, rev: "${param.candidate}"}

fan_out:
  - {node: architecture, uses: process:architecture_review_codex}
  - {node: tests, uses: process:tests_review_codex}

join: {node: judge, uses: process:review_judge}
