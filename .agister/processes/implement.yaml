schema: agister.process/v1alpha1
name: implement
type: process
uses: agent:claude-implementer-opus
policy: process-policy:implement

input:
  instruction: >-
    Implement the task given as input brief in this checkout of the
    candidate. Do not commit; Agister keeps your changes. Run the checks the
    brief asks for and report each with its exit code and final line; list
    every file you changed, repository-relative.
  params:
    candidate: {default: HEAD}
    brief: {}
  values:
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    brief: {source: file, path: "${param.brief}"}

workspace:
  checkout: candidate_revision

output:
  format: json
  schema: implementation
  require_valid: true
