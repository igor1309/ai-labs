# implement on Pi with GLM-5.3 (agent pi-implementer-glm-53, policy implement_pi).
schema: agister.process/v1alpha1
name: implement_pi_glm
type: process
uses: agent:pi-implementer-glm-53
policy: process-policy:implement_pi

input:
  instruction: >-
    Implement the task given as input brief in this checkout of the
    candidate. Do not commit; Agister keeps your changes. Agister runs the
    verification command after your turn; run any further checks the brief
    asks for and report each with its exit code and final line; list every
    file you changed, repository-relative. Run commands in the foreground:
    once your turn ends, nothing waits for a background command. Run tests
    with the repository's recommended test command (its AGENTS.md) if it
    has one; otherwise quietly, e.g. `go test` without -v for Go.
  params:
    candidate: {default: HEAD}
    brief: {}
  values:
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    brief: {source: file, path: "${param.brief}"}

workspace:
  checkout: candidate_revision

output:
  format: json
  schema: implementation
  require_valid: true

# Agister's own checks, run with the operator's authority after each valid
# turn, in a clean checkout of the candidate with the turn's patch applied;
# the node completes only when they pass.
verify:
  command: >-
    cd agister && test -z "$(gofmt -l .)" && go vet ./... &&
    go test -count=1 ./... && go test -race -count=1 ./internal/app/...
  timeout: 5m
  max_attempts: 3
  instruction: >-
    The verification command failed on your changes. Fix the cause in the
    code; do not weaken, skip or delete a check or a test.
