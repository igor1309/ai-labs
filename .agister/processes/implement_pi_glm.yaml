# implement on Pi with GLM-5.3 (agent pi-implementer-glm-53, policy implement_pi).
schema: agister.process/v1alpha1
name: implement_pi_glm
type: process
uses: agent:pi-implementer-glm-53
policy: process-policy:implement_pi

input:
  instruction: >-
    Implement the task given as input brief in this checkout of the
    candidate. Do not commit; Agister keeps your changes. Before you finish, run
    your testing command, as your skills and the repository's AGENTS.md
    describe it, and any further checks the brief asks for, and report each with its exit code and final line; list every
    file you changed, repository-relative. Run commands in the foreground:
    once your turn ends, nothing waits for a background command. Any
    guidance given as further inputs applies to the code it names.
  params:
    candidate: {default: HEAD}
    brief: {}
  values:
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    brief: {source: file, path: "${param.brief}"}
    go_testing: {source: prompt, name: go-testing-seams, optional: true}
    go_architecture: {source: prompt, name: go-architecture, optional: true}

workspace:
  checkout: candidate_revision

output:
  format: json
  schema: implementation
  require_valid: true


# The repository's own check: <repo>/.agister/verifies/repo.yaml. Calls
# are refused in a repository without one (ADR-010).
verify: verify:repo
