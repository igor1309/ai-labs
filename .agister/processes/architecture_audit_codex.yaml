# Architecture audit of a whole candidate (no diff) against
# prompts/code-review-architecture.md, or another prompt given as param
# prompt (a focused question, for example).
schema: agister.process/v1alpha1
name: architecture_audit_codex

type: process
uses: agent:codex-sol
policy: process-policy:codex-review

input:
  instruction: >-
    Audit the whole Agister module (agister/) at the exact candidate,
    following the review prompt given as input review_prompt. Report
    material findings only, with repository-relative paths and candidate
    line numbers.
    Each finding carries its evidence: the concrete case, the trace you
    verified and whether the change introduced it. A judge who never reads
    the code rules on that evidence alone; a finding without it is rejected.
  params:
    candidate: {default: HEAD}
    prompt: {default: prompts/code-review-architecture.md}
  values:
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    review_prompt: {source: file, path: "${param.prompt}"}

workspace:
  checkout: candidate_revision

output:
  format: json
  schema: review-result
  require_valid: true
