# Decides one open build question from the recorded decisions, per
# prompts/advisor.md (ADR-007): a decision, to be appended to
# agister/docs/decisions.md, or owner for a policy question.
#   agister run advisor --param question=<file> --param revision=<rev>
schema: agister.process/v1alpha1
name: advisor

type: process
uses: agent:codex-sol-61
policy: process-policy:codex-review

input:
  instruction: >-
    Answer the question given as input question, following the prompt given
    as input advisor_prompt. The question file holds who asked, the question
    and its options. Your working directory is a read-only checkout of the
    revision: read the recorded decisions there yourself.
  params:
    question: {}
    revision: {default: HEAD}
  values:
    revision: {source: git.revision, rev: "${param.revision}"}
    question: {source: file, path: "${param.question}"}
    advisor_prompt: {source: file, path: prompts/advisor.md}

workspace:
  checkout: revision

output:
  format: json
  schema: advice
  require_valid: true
