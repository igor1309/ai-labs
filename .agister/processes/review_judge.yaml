# Rules on the findings of one change's reviews against
# prompts/code-review-judge.md: fix, defer, owner or reject. The judge sees
# only the reviews (scripts/review-bundle.py), never the code.
schema: agister.process/v1alpha1
name: review_judge

type: process
uses: agent:claude-judge
policy: process-policy:judge

input:
  instruction: >-
    Rule on the review findings given as input reviews, following the prompt
    given as input judge_prompt. They are all you have: rule on the evidence
    each finding presents.
  params:
    reviews: {}
  values:
    reviews: {source: file, path: "${param.reviews}"}
    judge_prompt: {source: file, path: prompts/code-review-judge.md}

output:
  format: json
  schema: judgement
  require_valid: true
