# Critical review of a decision document (ADR, deferred work, research note)
# against the prompt file given as param prompt.
schema: agister.process/v1alpha1
name: decision_review_codex

type: process
uses: agent:codex-sol
policy: process-policy:codex-review

input:
  instruction: >-
    Review the decision documents changed from the base to the candidate,
    following the review prompt given as input review_prompt. Check them
    against the documents and code they cite in the candidate checkout.
    Report material findings only, with repository-relative paths and
    candidate line numbers.
    Each finding carries its evidence: the concrete case, the trace you
    verified and whether the change introduced it. A judge who never reads
    the code rules on that evidence alone; a finding without it is rejected.
  params:
    base: {default: origin/agister}
    candidate: {default: HEAD}
    prompt: {}
  values:
    base_revision: {source: git.revision, rev: "${param.base}"}
    candidate_revision: {source: git.revision, rev: "${param.candidate}"}
    diff: {source: git.diff, base: "${value.base_revision}", head: "${value.candidate_revision}"}
    changed_files: {source: git.changed_files, base: "${value.base_revision}", head: "${value.candidate_revision}"}
    review_prompt: {source: file, path: "${param.prompt}"}

workspace:
  checkout: candidate_revision

output:
  format: json
  schema: review-result
  require_valid: true
