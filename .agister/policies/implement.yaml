# Implementation in a checkout of the candidate. Claude Code gets Bash,
# which grants everything its mapping lists (runtimes/claude-code.yaml), so
# this policy allows all of it; Agister keeps the checkout's changes as a
# patch artifact.
schema: agister.process-policy/v1alpha1
name: implement

workspace:
  access: read-write
  scope: candidate

tools:
  allow:
    - repository.read
    - repository.search
    - repository.diff
    - repository.history.read
    - repository.write
    - repository.history.write
    - process.execute
    - network
    - host.read
    - host.write

timeout: 45m
retry:
  max_attempts: 1

# 2x+ implement runs' longest event gap (604 s) and command (400 s), 09-30..10-01; no_output unset: verify is quiet until it ends.
stale:
  no_event: 21m
  tool_command: 15m
  repeated_tool_calls: 5
