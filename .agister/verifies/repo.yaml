# This repository's check for every process that names verify:repo
# (ADR-010): run with the operator's authority after each valid turn, in a
# clean checkout of the candidate with the turn's patch applied; the node
# completes only when it passes.
schema: agister.verify/v1alpha1
name: repo
command: >-
  cd agister && test -z "$(gofmt -l .)" && go vet ./... &&
  go test -count=1 ./... && go test -race -count=1 ./internal/app/...
timeout: 5m
max_attempts: 3
instruction: >-
  The verification command failed on your changes. Fix the cause in the
  code; do not weaken, skip or delete a check or a test.
