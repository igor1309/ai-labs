# Warder's check for every process that names verify:warder: format, vet
# and race tests for the warder module (warder/scripts/test.sh).
schema: agister.verify/v1alpha1
name: warder
command: warder/scripts/test.sh
timeout: 5m
max_attempts: 3
instruction: >-
  The verification command failed on your changes. Fix the cause in the
  code; do not weaken, skip or delete a check or a test.
